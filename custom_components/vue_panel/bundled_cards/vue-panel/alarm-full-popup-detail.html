<script data-vue-panel-javascript>
  const config = vuePanel.config;
  const context = vuePanel.context;
  const entityId = String(config.entity || context.entity || '');
  const action = context.action === 'disarm' ? 'disarm' : context.action === 'arm' ? 'arm' : '';
  const modeKey = String(context.mode || '');
  const codeDisplay = context.codeDisplay === 'input' ? 'input' : 'dots';
  const configuredLength = Number(context.codeLength);
  const codeLength = Number.isFinite(configuredLength)
    ? Math.round(Math.min(12, Math.max(1, configuredLength)))
    : 4;

  const MODES = {
    armed_home: {service: 'alarm_arm_home', icon: 'mdi:shield-home'},
    armed_away: {service: 'alarm_arm_away', icon: 'mdi:shield-lock'},
    armed_night: {service: 'alarm_arm_night', icon: 'mdi:shield-moon'},
    armed_vacation: {service: 'alarm_arm_vacation', icon: 'mdi:shield-airplane'},
    armed_custom_bypass: {service: 'alarm_arm_custom_bypass', icon: 'mdi:shield-star'}
  };
  const mode = MODES[modeKey] || null;

  const card = document.getElementById('card');
  const actionView = document.getElementById('action-view');
  const actionIcon = document.getElementById('action-icon');
  const actionTitle = document.getElementById('action-title');
  const actionHint = document.getElementById('action-hint');
  const pinEntry = document.getElementById('pin-entry');
  const pinDots = document.getElementById('pin-dots');
  const pinInput = document.getElementById('pin-input');
  const keypad = document.getElementById('keypad');
  const backspace = document.getElementById('backspace');
  const confirm = document.getElementById('confirm');
  const directConfirm = document.getElementById('direct-confirm');
  const status = document.getElementById('status');
  const sensorView = document.getElementById('sensor-view');
  const sensorTitle = document.getElementById('sensor-title');
  const sensorList = document.getElementById('sensor-list');
  const retry = document.getElementById('retry');
  const force = document.getElementById('force');
  const sensorStatus = document.getElementById('sensor-status');

  let entity = null;
  let code = '';
  let commandInFlight = false;
  let commandTimer = null;
  let lastCode = '';
  let renderVersion = 0;

  function openSensorsOf(value) {
    const sensors = value?.attributes?.open_sensors;
    if (!sensors || typeof sensors !== 'object' || Array.isArray(sensors)) return [];
    return Object.entries(sensors)
      .filter(([id]) => /^[a-z0-9_]+\.[a-z0-9_]+$/.test(id))
      .map(([id, state]) => ({id, state: String(state || 'unknown')}));
  }

  function needsCode(value) {
    const hasFormat = Boolean(value?.attributes?.code_format);
    return action === 'disarm' ? hasFormat : hasFormat && value?.attributes?.code_arm_required === true;
  }

  function targetReached(value) {
    if (!value) return false;
    if (action === 'disarm') return ['disarmed', 'disarming'].includes(value.state);
    return Boolean(mode) && [modeKey, 'arming', 'pending'].includes(value.state);
  }

  function setStatus(element, key, kind = 'error') {
    element.textContent = vuePanel.t(key);
    element.hidden = false;
    element.classList.toggle('is-progress', kind === 'progress');
    element.classList.toggle('is-success', kind === 'success');
  }

  function clearStatus(element) {
    element.hidden = true;
    element.classList.remove('is-progress', 'is-success');
  }

  function renderCode() {
    pinInput.value = code;
    for (const [index, dot] of [...pinDots.children].entries()) {
      dot.classList.toggle('is-filled', index < code.length);
    }
    confirm.disabled = commandInFlight || (needsCode(entity) && !code);
    directConfirm.disabled = commandInFlight;
    backspace.disabled = commandInFlight || !code;
  }

  function buildDots() {
    pinDots.replaceChildren();
    for (let index = 0; index < codeLength; index += 1) {
      const dot = document.createElement('span');
      dot.className = 'pin-dot';
      pinDots.append(dot);
    }
  }

  async function renderSensors() {
    const version = ++renderVersion;
    const sensors = openSensorsOf(entity);
    sensorTitle.replaceChildren();
    sensorTitle.append(`${vuePanel.t('translation.openSensors.beforeCount')} `);
    const count = document.createElement('strong');
    count.textContent = `${sensors.length} ${vuePanel.t(
      sensors.length === 1 ? 'translation.openSensors.sensor' : 'translation.openSensors.sensors'
    )}`;
    sensorTitle.append(count, ` ${vuePanel.t('translation.openSensors.afterCount')}`);

    const rows = document.createDocumentFragment();
    for (const sensor of sensors) {
      const sensorEntity = await vuePanel.getEntity(sensor.id);
      if (version !== renderVersion) return;
      const item = document.createElement('div');
      item.className = 'sensor-item';
      const icon = document.createElement('span');
      icon.className = 'sensor-item-icon';
      const image = document.createElement('img');
      image.alt = '';
      image.src = await vuePanel.getIcon(String(sensorEntity?.attributes?.icon || 'mdi:window-open-variant'), {
        size: 40,
        color: getComputedStyle(card).color
      });
      if (version !== renderVersion) return;
      const badge = document.createElement('span');
      badge.className = 'sensor-item-state';
      const stateKey = ['open', 'unavailable'].includes(sensor.state) ? sensor.state : 'unknown';
      badge.textContent = vuePanel.t(`translation.openSensors.${stateKey}`);
      const name = document.createElement('span');
      name.className = 'sensor-item-name';
      name.textContent = String(sensorEntity?.attributes?.friendly_name || sensor.id);
      icon.append(image, badge);
      item.append(icon, name);
      rows.append(item);
    }
    if (version === renderVersion) sensorList.replaceChildren(rows);
  }

  async function showSensorView() {
    commandInFlight = false;
    if (commandTimer) clearTimeout(commandTimer);
    commandTimer = null;
    actionView.hidden = true;
    sensorView.hidden = false;
    clearStatus(sensorStatus);
    retry.disabled = false;
    force.disabled = false;
    await renderSensors();
  }

  function showActionView() {
    sensorView.hidden = true;
    actionView.hidden = false;
    clearStatus(status);
    clearStatus(sensorStatus);
    renderCode();
  }

  function finishTimer() {
    if (commandTimer) clearTimeout(commandTimer);
    commandTimer = null;
  }

  function commandFailed() {
    commandInFlight = false;
    finishTimer();
    if (action === 'arm' && openSensorsOf(entity).length) {
      showSensorView();
      return;
    }
    setStatus(status, 'translation.pin.wrong');
    renderCode();
  }

  function startWaiting(targetStatus = status) {
    commandInFlight = true;
    setStatus(targetStatus, 'translation.progress', 'progress');
    renderCode();
    finishTimer();
    commandTimer = setTimeout(commandFailed, 2500);
  }

  async function submit() {
    if (commandInFlight || !entityId || !action || (action === 'arm' && !mode)) return;
    if (needsCode(entity) && !code) return;
    lastCode = code;
    startWaiting();
    const service = action === 'disarm' ? 'alarm_disarm' : mode.service;
    try {
      await vuePanel.callService(
        'alarm_control_panel',
        service,
        code ? {code} : {},
        {entity_id: entityId}
      );
    } catch (error) {
      commandFailed();
    }
  }

  async function forceArm() {
    if (commandInFlight || action !== 'arm' || !mode || !entityId) return;
    startWaiting(sensorStatus);
    retry.disabled = true;
    force.disabled = true;
    const shortMode = modeKey.replace(/^armed_/, '').replace('custom_bypass', 'custom');
    const data = {entity_id: entityId, mode: shortMode, force: true};
    if (lastCode) data.code = lastCode;
    try {
      await vuePanel.callService('alarmo', 'arm', data);
    } catch (error) {
      commandInFlight = false;
      finishTimer();
      retry.disabled = false;
      force.disabled = false;
      setStatus(sensorStatus, 'translation.pin.wrong');
    }
  }

  async function renderEntity(value) {
    entity = value;
    if (commandInFlight && targetReached(value)) {
      commandInFlight = false;
      finishTimer();
      const targetStatus = sensorView.hidden ? status : sensorStatus;
      setStatus(targetStatus, 'translation.success', 'success');
      retry.disabled = true;
      force.disabled = true;
    }
    const required = needsCode(value);
    pinEntry.hidden = !required;
    directConfirm.hidden = required;
    actionHint.textContent = vuePanel.t(required ? 'translation.pin.required' : 'translation.pin.optional');
    renderCode();
  }

  keypad.addEventListener('click', event => {
    const key = event.target.closest('[data-key]')?.dataset.key;
    if (key !== undefined && !commandInFlight && (codeDisplay === 'input' || code.length < codeLength)) {
      code += key;
      renderCode();
    }
  });
  pinInput.addEventListener('input', () => {
    code = pinInput.value.replace(/\D/g, '');
    renderCode();
  });
  pinInput.addEventListener('keydown', event => {
    if (event.key === 'Enter') submit();
  });
  backspace.addEventListener('click', () => {
    code = code.slice(0, -1);
    renderCode();
  });
  confirm.addEventListener('click', submit);
  directConfirm.addEventListener('click', submit);
  retry.addEventListener('click', showActionView);
  force.addEventListener('click', forceArm);

  directConfirm.textContent = vuePanel.t('translation.pin.confirm');
  retry.textContent = vuePanel.t('translation.openSensors.retry');
  force.textContent = vuePanel.t('translation.openSensors.force');
  backspace.setAttribute('aria-label', vuePanel.t('translation.pin.backspace'));
  confirm.setAttribute('aria-label', vuePanel.t('translation.pin.confirm'));
  directConfirm.hidden = true;
  pinDots.hidden = codeDisplay === 'input';
  pinInput.hidden = codeDisplay !== 'input';
  buildDots();

  const validAction = action === 'disarm' || (action === 'arm' && mode);
  if (!validAction || !entityId) {
    actionTitle.textContent = vuePanel.t('translation.noAction');
    actionHint.textContent = '';
    pinEntry.hidden = true;
    directConfirm.hidden = true;
  } else {
    const translationKey = action === 'disarm' ? 'disarm' : modeKey;
    actionTitle.textContent = vuePanel.t(`translation.actions.${translationKey}`);
    actionIcon.src = await vuePanel.getIcon(
      action === 'disarm' ? 'mdi:shield-off-outline' : mode.icon,
      {size: 48, color: '#8a6700'}
    );
    document.getElementById('backspace-icon').src = await vuePanel.getIcon('mdi:backspace-outline', {
      size: 40,
      color: getComputedStyle(card).color
    });
    document.getElementById('confirm-icon').src = await vuePanel.getIcon('mdi:check', {
      size: 40,
      color: getComputedStyle(card).color
    });
    document.getElementById('sensor-alert-icon').src = await vuePanel.getIcon('mdi:alert-outline', {
      size: 40,
      color: '#f24b45'
    });
    entity = await vuePanel.getEntity(entityId);
    await renderEntity(entity);
    vuePanel.subscribeEntity(entityId, renderEntity);
    if (codeDisplay === 'input' && needsCode(entity)) setTimeout(() => pinInput.focus(), 0);
  }
</script>
