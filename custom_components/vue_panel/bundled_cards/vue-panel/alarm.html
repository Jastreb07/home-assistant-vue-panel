<script data-vue-panel-javascript>
  const config = vuePanel.config;

  /* Ein einfacher Umschalter für jede Domain */
  async function toggleEntity(id) {
    if (!id) return;
    await vuePanel.callService('homeassistant', 'toggle', {}, {entity_id: id});
  }

  /*
   * Tipp-Aktionen: Tippen, Doppeltippen und Halten. "default" behält die
   * eingebaute Aktion der Card und öffnet beim Halten ohne eigene Aktion die
   * automatische Detailansicht; "more-info" öffnet die Detailansicht (Ziel ist
   * optional eine bestimmte Dialog-Card), "popup" ein eigenes Popup. "assist"
   * braucht einen Home-Assistant-Dialog, den das Panel nicht öffnen kann.
   */
  function bindGestures(element, settings, handlers) {
    /* Das Panel speichert je Geste eine Aktion samt Ziel */
    const slotOf = gesture => (settings.actions || {})[gesture] || {};
    const actionOf = gesture => String(slotOf(gesture).action || 'default');

    const run = async gesture => {
      const action = actionOf(gesture);
      const target = String(slotOf(gesture).target || '');

      if (action === 'none' || action === 'assist') return;
      if (action === 'more-info') {
        return vuePanel.showDetail(target ? {card: target, entity: handlers.entityId} : {entity: handlers.entityId});
      }
      if (action === 'popup') return target ? vuePanel.openPopup(target) : undefined;
      if (action === 'default') {
        const handled = handlers.default ? handlers.default(gesture) : undefined;
        if (handled !== undefined) return handled;
        /* Ohne eigene Card-Aktion öffnet Halten die automatische Detailansicht */
        if (gesture === 'hold' && handlers.entityId) return vuePanel.showDetail({entity: handlers.entityId});
        return undefined;
      }
      if (action === 'toggle') return handlers.toggle ? handlers.toggle() : undefined;
      if (action === 'navigate') return target ? vuePanel.navigate(target) : undefined;
      if (action === 'url') {
        if (target) window.open(target, '_blank', 'noopener');
        return;
      }
      if (action === 'perform-action') {
        const [domain, service] = target.split('.');
        if (!domain || !service) return;
        await vuePanel.callService(domain, service, {}, handlers.entityId ? {entity_id: handlers.entityId} : {});
      }
    };

    const ignored = event => Boolean(handlers.ignore) && Boolean(event.target.closest(handlers.ignore));
    let holdTimer = null;
    let held = false;
    let taps = 0;

    element.addEventListener('pointerdown', event => {
      if (ignored(event)) return;
      held = false;
      holdTimer = setTimeout(() => {
        holdTimer = null;
        held = true;
        run('hold');
      }, 500);
    });

    for (const name of ['pointerup', 'pointercancel', 'pointerleave']) {
      element.addEventListener(name, () => {
        if (holdTimer) clearTimeout(holdTimer);
        holdTimer = null;
      });
    }

    element.addEventListener('click', event => {
      if (ignored(event)) return;
      if (held) {
        held = false;
        return;
      }
      const doubled = actionOf('double_tap');
      /* Ohne Doppeltipp-Aktion reagiert der einfache Tipp sofort */
      if (doubled === 'default' || doubled === 'none') {
        run('tap');
        return;
      }
      taps += 1;
      if (taps > 1) return;
      setTimeout(() => {
        const wasDoubled = taps > 1;
        taps = 0;
        run(wasDoubled ? 'double_tap' : 'tap');
      }, 250);
    });
  }

  const ARM_AWAY = 2;
  const ARM_NIGHT = 4;

  const ARM_VACATION = 32;

    armed_home: 'translation.states.armed_home',
    armed_away: 'translation.states.armed_away',
    armed_night: 'translation.states.armed_night',
    armed_vacation: 'translation.states.armed_vacation',
    armed_custom_bypass: 'translation.states.armed_custom_bypass',
    arming: 'translation.states.arming',
    pending: 'translation.states.pending',
    disarming: 'translation.states.disarming',
    triggered: 'translation.states.triggered',
    unavailable: 'translation.states.unavailable'
  };

  const STATE_ICONS = {
    disarmed: 'mdi:shield-off-outline',
    armed_home: 'mdi:shield-home',
    armed_away: 'mdi:shield-lock',
    armed_night: 'mdi:shield-moon',
    armed_vacation: 'mdi:shield-airplane',
    armed_custom_bypass: 'mdi:shield-star',
    arming: 'mdi:shield-sync-outline',
    disarming: 'mdi:shield-sync-outline',
    pending: 'mdi:shield-alert-outline',
    triggered: 'mdi:bell-alert',
    unavailable: 'mdi:shield-off-outline'
  };

  const LOCK_STATE_LABELS = {
    locked: 'translation.locks.locked',
    unlocked: 'translation.locks.unlocked',
    locking: 'translation.locks.locking',
    unlocking: 'translation.locks.unlocking',
    jammed: 'translation.locks.jammed',
    unavailable: 'translation.locks.unavailable'
  };

  function knownState(raw) {
    return STATE_LABELS[raw] ? raw : 'unknown';
  }

  /* Welche Arm-Modi das Entity anbietet — identisch für HA-nativ und Alarmo */
  function supportedArmModes(entity) {
    const bits = Number(entity?.attributes?.supported_features) || 0;
    return ARM_MODES.filter(mode => (bits & mode.bit) === mode.bit);
  }

  /* Ob ein Code nötig ist, direkt aus den Standard-Attributen gelesen */
  function codeInfo(entity) {
    const format = entity?.attributes?.code_format || null;
    const armRequired = entity?.attributes?.code_arm_required !== false;
    return {format, armRequired};
  }

  const entityId = String(config.entity || '');
  const card = document.getElementById('card');
  card.dataset.size = ['compact', 'normal', 'large'].includes(config.size) ? config.size : 'normal';

  const iconElement = document.getElementById('icon');
  const nameElement = document.getElementById('name');
  const stateElement = document.getElementById('state');
  const modesElement = document.getElementById('modes');

  const codePanel = document.getElementById('code-panel');
  const codeCancel = document.getElementById('code-cancel');
  const codeDots = document.getElementById('code-dots');
  const keypad = document.getElementById('keypad');
  const keyBack = document.getElementById('key-back');
  const keyConfirm = document.getElementById('key-confirm');
  const codeError = document.getElementById('code-error');
  const locksElement = document.getElementById('locks');

  codeCancel.setAttribute('aria-label', vuePanel.t('translation.code.cancel'));
  keyBack.setAttribute('aria-label', vuePanel.t('translation.code.backspace'));
  keyConfirm.setAttribute('aria-label', vuePanel.t('translation.code.confirm'));

  const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#737373';
  for (const [id, icon, color] of [
    ['code-cancel-icon', 'mdi:close', '#737373'],
    ['key-back-icon', 'mdi:backspace-outline', '#737373'],
    ['key-confirm-icon', 'mdi:check', accentColor]
  ]) document.getElementById(id).src = await vuePanel.getIcon(icon, {size: 32, color});

  let currentEntity = null;
  let pendingAction = null; // {type: 'arm', mode} | {type: 'disarm'}
  let requestedMode = null; // rein kosmetisch: welcher Modus lokal angefragt wurde
  let code = '';

  function renderDots() {
    codeDots.replaceChildren();
    const total = Math.max(code.length, 4);
    for (let index = 0; index < total; index++) {
      const dot = document.createElement('span');
      dot.className = 'alarm-dot';
      if (index < code.length) dot.classList.add('is-filled');
      codeDots.append(dot);
    }
  }

  function updateCodePanelVisibility() {
    const info = codeInfo(currentEntity);
    const show = Boolean(info.format) && (pendingAction !== null || config.pinAlwaysVisible === true);
    codePanel.hidden = !show;
    codeCancel.hidden = pendingAction === null;
    keyConfirm.disabled = pendingAction === null;
  }

  function openCodePanel(action) {
    pendingAction = action;
    code = '';
    codeError.hidden = true;
    renderDots();
    updateCodePanelVisibility();
  }

  function closeCodePanel() {
    pendingAction = null;
    requestedMode = null;
    code = '';
    renderDots();
    updateCodePanelVisibility();
  }

  function showCodeError() {
    code = '';
    renderDots();
    codeError.textContent = vuePanel.t('translation.code.wrong');
    codeError.hidden = false;
  }

  async function performArm(mode, codeValue) {
    requestedMode = mode.key;
    renderModes();
    try {
      await vuePanel.callService('alarm_control_panel', mode.service, codeValue ? {code: codeValue} : {}, {entity_id: entityId});
      closeCodePanel();
    } catch (error) {
      showCodeError();
    }
  }

  async function performDisarm(codeValue) {
    requestedMode = 'disarmed';
    renderModes();
    try {
      await vuePanel.callService('alarm_control_panel', 'alarm_disarm', codeValue ? {code: codeValue} : {}, {entity_id: entityId});
      closeCodePanel();
    } catch (error) {
      showCodeError();
    }
  }

  function requestArm(mode) {
    if (!entityId) return;
    const info = codeInfo(currentEntity);
    if (info.format && info.armRequired) {
      openCodePanel({type: 'arm', mode});
    } else {
      performArm(mode, '');
    }
  }

  function requestDisarm() {
    if (!entityId) return;
    const info = codeInfo(currentEntity);
    if (info.format) {
      openCodePanel({type: 'disarm'});
    } else {
      performDisarm('');
    }
  }

  function submitCode() {
    if (!pendingAction || !code) return;
    if (pendingAction.type === 'disarm') performDisarm(code);
    else performArm(pendingAction.mode, code);
  }

  keypad.addEventListener('click', event => {
    const button = event.target.closest('[data-key]');
    if (button) {
      if (code.length < 8) code += button.dataset.key;
      renderDots();
    }
  });

  keyBack.addEventListener('click', () => {
    code = code.slice(0, -1);
    renderDots();
  });

  keyConfirm.addEventListener('click', submitCode);
  codeCancel.addEventListener('click', closeCodePanel);

  function renderModes() {
    const modes = [DISARM_MODE, ...supportedArmModes(currentEntity)];
    const state = knownState(currentEntity?.state);
    const busy = ['arming', 'pending', 'disarming'].includes(state) || state === 'triggered';
    const activeKey = busy ? requestedMode : state;

    modesElement.replaceChildren();
    const buttons = modes.map(mode => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'alarm-mode';
      button.classList.toggle('active', mode.key === activeKey);
      const img = document.createElement('img');
      img.className = 'alarm-mode-icon';
      img.alt = '';
      const label = document.createElement('span');
      label.className = 'alarm-mode-label';
      label.textContent = vuePanel.t(mode.label);
      button.append(img, label);
      button.addEventListener('click', () => {
        if (mode.key === 'disarmed') {
          if (state === 'disarmed') return;
          requestDisarm();
        } else {
          if (state === mode.key) return;
          requestArm(mode);
        }
      });
      modesElement.append(button);
      return {button, img, icon: mode.icon};
    });

    Promise.all(buttons.map(async entry => {
      entry.img.src = await vuePanel.getIcon(entry.icon, {size: 48, color: '#737373'});
    }));
  }

  async function render(entity) {
    currentEntity = entity;
    const state = !entityId ? 'unknown' : !entity ? 'unknown' : knownState(entity.state);
    const armed = state.startsWith('armed');
    const busy = ['arming', 'pending', 'disarming'].includes(state);
    const alarm = state === 'triggered';

    card.classList.toggle('is-armed', armed);
    card.classList.toggle('is-busy', busy);
    card.classList.toggle('is-alarm', alarm);

    nameElement.textContent = String(config.name || entity?.attributes?.friendly_name || vuePanel.t('translation.defaultName'));
    stateElement.textContent = !entityId
      ? vuePanel.t('translation.noEntity')
      : !entity
        ? vuePanel.t('translation.entityNotFound')
        : vuePanel.t(STATE_LABELS[state] || 'translation.states.unknown');

    iconElement.src = await vuePanel.getIcon(STATE_ICONS[state] || 'mdi:shield-off-outline', {
      size: 64,
      color: alarm ? '#e53935' : busy ? '#d59c00' : armed ? '#2f8f4b' : '#737373'
    });

    if (!busy && !alarm) requestedMode = null;

    renderModes();
    updateCodePanelVisibility();
  }

  /* Smart Locks — feste Liste, jede Zeile abonniert ihr eigenes Entity */
  const lockEntries = (Array.isArray(config.locks) ? config.locks : [])
    .filter(item => item && typeof item.entity === 'string' && item.entity);

  function buildLocks() {
    if (!lockEntries.length) {
      locksElement.hidden = true;
      return;
    }
    locksElement.hidden = false;
    locksElement.replaceChildren();

    for (const item of lockEntries) {
      const id = item.entity;
      const row = document.createElement('div');
      row.className = 'alarm-lock';

      const iconWrap = document.createElement('span');
      iconWrap.className = 'alarm-lock-icon';
      const img = document.createElement('img');
      img.alt = '';
      iconWrap.append(img);

      const copy = document.createElement('div');
      copy.className = 'alarm-lock-copy';
      const lockName = document.createElement('div');
      lockName.className = 'alarm-lock-name';
      const lockState = document.createElement('div');
      lockState.className = 'alarm-lock-state';
      copy.append(lockName, lockState);

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'alarm-lock-button';

      row.append(iconWrap, copy, button);
      locksElement.append(row);

      const renderLock = async lockEntity => {
        const state = lockEntity?.state || 'unknown';
        const locked = state === 'locked';
        lockName.textContent = item.name || lockEntity?.attributes?.friendly_name || id || vuePanel.t('translation.locks.defaultName');
        lockState.textContent = vuePanel.t(LOCK_STATE_LABELS[state] || 'translation.locks.unknown');
        button.textContent = vuePanel.t(locked ? 'translation.locks.unlock' : 'translation.locks.lock');
        button.disabled = !lockEntity || state === 'unavailable';
        img.src = await vuePanel.getIcon(locked ? 'mdi:lock' : 'mdi:lock-open-variant', {
          size: 40,
          color: locked ? '#5c635e' : '#9a6d37'
        });
      };

      button.addEventListener('click', async () => {
        const lockEntity = await vuePanel.getEntity(id);
        const service = lockEntity?.state === 'locked' ? 'unlock' : 'lock';
        await vuePanel.callService('lock', service, {}, {entity_id: id});
      });

      vuePanel.getEntity(id).then(renderLock);
      vuePanel.subscribeEntity(id, renderLock);
    }
  }

  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else {
    await render(null);
  }
  buildLocks();

  bindGestures(card, config, {
    entityId,
    ignore: '#modes, #code-panel, #locks',
    toggle: () => toggleEntity(entityId)
  });
</script>
