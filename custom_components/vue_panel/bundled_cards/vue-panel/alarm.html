  const config = vuePanel.config;

  /*
   * Tipp-Aktionen: Tippen, Doppeltippen und Halten. "default" behält die

    const run = async gesture => {
      const action = actionOf(gesture);
      const target = String(slotOf(gesture).target || '');

      if (action === 'none' || action === 'assist') return;
      if (action === 'more-info') {
        return vuePanel.showDetail(target ? {card: target, entity: handlers.entityId} : {entity: handlers.entityId});
      }
      if (action === 'popup') return target ? vuePanel.openPopup(target) : undefined;
      if (action === 'default') {
        const handled = handlers.default ? handlers.default(gesture) : undefined;
        if (handled !== undefined) return handled;
        /* Ohne eigene Card-Aktion öffnet Halten die automatische Detailansicht */
        if (gesture === 'hold' && handlers.entityId) return vuePanel.showDetail({entity: handlers.entityId});
        return undefined;
      }
      if (action === 'toggle') return handlers.toggle ? handlers.toggle() : undefined;
      if (action === 'navigate') return target ? vuePanel.navigate(target) : undefined;
      if (action === 'url') {
        if (target) window.open(target, '_blank', 'noopener');
        return;
      }
      if (action === 'perform-action') {
        const [domain, service] = target.split('.');
        if (!domain || !service) return;
        await vuePanel.callService(domain, service, {}, handlers.entityId ? {entity_id: handlers.entityId} : {});
      }

    const ignored = event => Boolean(handlers.ignore) && Boolean(event.target.closest(handlers.ignore));

    let held = false;

      if (ignored(event)) return;
      held = false;

        held = true;
        run('hold');
      }, 500);

      element.addEventListener(name, () => {
        if (holdTimer) clearTimeout(holdTimer);
        holdTimer = null;
      });

      if (ignored(event)) return;
      if (held) {
        held = false;
        return;
      }
      const doubled = actionOf('double_tap');
      /* Ohne Doppeltipp-Aktion reagiert der einfache Tipp sofort */
      if (doubled === 'default' || doubled === 'none') {
        run('tap');
        return;

      if (taps > 1) return;

      codeError.hidden = false;
    } else {
      actionError.textContent = vuePanel.t('translation.action.failed');
      actionError.hidden = false;
    }
    updateCodePanelVisibility();
    renderModes();
  }

  function clearPendingCommand() {
    commandInFlight = false;
    if (commandTimer) clearTimeout(commandTimer);
    commandTimer = null;
    pendingCommand = null;
    actionError.hidden = true;
    closeCodePanel();
    renderModes();
  }

  function startCommand(command) {
    pendingCommand = command;
    commandInFlight = true;
    codeError.hidden = true;
    actionError.hidden = true;
    updateCodePanelVisibility();
    if (commandTimer) clearTimeout(commandTimer);
    commandTimer = setTimeout(() => {
      if (openSensorsOf(currentEntity).length && command.type === 'arm') {
        showOpenSensors(currentEntity);
        return;
      }
      showCommandError();
    }, 2500);
  }

  async function performArm(mode, codeValue) {
    if (currentEntity?.state === 'arming') clearDelayCountdown();
    requestedMode = mode.key;
    startCommand({
      type: 'arm',
      mode,
      code: codeValue,
      previousState: currentEntity?.state || 'unknown'
    });
    renderModes();
    try {
      await vuePanel.callService('alarm_control_panel', mode.service, codeValue ? {code: codeValue} : {}, {entity_id: entityId});
    } catch (error) {
      showCommandError();
    }
  }

  async function performDisarm(codeValue) {
    requestedMode = 'disarmed';
    startCommand({
      type: 'disarm',
      code: codeValue,
      previousState: currentEntity?.state || 'unknown'
    });
    renderModes();
    try {
      await vuePanel.callService('alarm_control_panel', 'alarm_disarm', codeValue ? {code: codeValue} : {}, {entity_id: entityId});
    } catch (error) {
      showCommandError();
    }
  }

  function requestArm(mode) {
    if (!entityId) return;
    const info = codeInfo(currentEntity);
    if (info.format && info.armRequired) {
      requestedMode = mode.key;
      renderModes();
      openCodePanel({type: 'arm', mode});
    } else {
      performArm(mode, '');
    }
  }

  function requestDisarm() {
    if (!entityId) return;
    const info = codeInfo(currentEntity);
    if (info.format) {
      requestedMode = 'disarmed';
      renderModes();
      openCodePanel({type: 'disarm'});
    } else {
      performDisarm('');
    }
  }

  function submitCode() {
    if (!pendingAction || !code || commandInFlight) return;
    if (pendingAction.type === 'disarm') performDisarm(code);
    else performArm(pendingAction.mode, code);
  }

  keypad.addEventListener('click', event => {
    const button = event.target.closest('[data-key]');
    if (button) {
      if (codeDisplay === 'input' || code.length < codeLength) code += button.dataset.key;
      renderDots();
    }
  });

  codeInput.addEventListener('input', () => {
    code = codeInput.value;
    renderDots();
  });
  codeInput.addEventListener('keydown', event => {
    if (event.key === 'Enter') submitCode();
  });

  keyBack.addEventListener('click', () => {
    code = code.slice(0, -1);
    renderDots();
  });

  keyConfirm.addEventListener('click', submitCode);
  codeCancel.addEventListener('click', closeCodePanel);

  async function renderOpenSensors(entity) {
    const renderVersion = ++openSensorsRenderVersion;
    const sensors = openSensorsOf(entity);
    openSensorsPanel.hidden = !openSensorsVisible || !sensors.length;
    openSensorsPanel.setAttribute('aria-hidden', openSensorsPanel.hidden ? 'true' : 'false');
    if (openSensorsPanel.hidden) return;

    openSensorsTitle.replaceChildren();
    openSensorsTitle.append(`${vuePanel.t('translation.openSensors.beforeCount')} `);
    const count = document.createElement('strong');
    count.textContent = `${sensors.length} ${vuePanel.t(
      sensors.length === 1 ? 'translation.openSensors.sensor' : 'translation.openSensors.sensors'
    )}`;
    openSensorsTitle.append(count, ` ${vuePanel.t('translation.openSensors.afterCount')}`);
    const rows = document.createDocumentFragment();
    for (const sensor of sensors) {
      const sensorEntity = await vuePanel.getEntity(sensor.id);
      const row = document.createElement('div');
      row.className = 'alarm-open-sensor';

      const iconWrap = document.createElement('div');
      iconWrap.className = 'alarm-open-sensor-icon-wrap';
      const icon = document.createElement('div');
      icon.className = 'alarm-open-sensor-icon';
      const img = document.createElement('img');
      img.alt = '';
      img.src = await vuePanel.getIcon(
        String(sensorEntity?.attributes?.icon || 'mdi:window-closed-variant'),
        {size: 40, color: '#606060'}
      );

      const sensorState = document.createElement('span');
      sensorState.className = 'alarm-open-sensor-state';
      const stateKey = ['open', 'unavailable'].includes(sensor.state) ? sensor.state : 'unknown';
      sensorState.textContent = vuePanel.t(`translation.openSensors.${stateKey}`);
      icon.append(img);
      iconWrap.append(icon, sensorState);

      const name = document.createElement('span');
      name.className = 'alarm-open-sensor-name';
      name.textContent = String(sensorEntity?.attributes?.friendly_name || sensor.id);
      row.append(iconWrap, name);
      rows.append(row);
    }
    if (renderVersion !== openSensorsRenderVersion || !openSensorsVisible) return;
    openSensorsList.replaceChildren(rows);
  }

  function showOpenSensors(entity) {
    if (!pendingCommand || pendingCommand.type !== 'arm') return;
    commandInFlight = false;
    if (commandTimer) clearTimeout(commandTimer);
    commandTimer = null;
    pendingAction = null;
    code = '';
    renderDots();
    openSensorsVisible = true;
    renderOpenSensors(entity);
    updateCodePanelVisibility();
    renderModes();
  }

  async function forceArm() {
    if (!pendingCommand || pendingCommand.type !== 'arm' || commandInFlight) return;
    const previous = pendingCommand;
    const shortMode = previous.mode.key
      .replace(/^armed_/, '')
      .replace('custom_bypass', 'custom');
    openSensorsVisible = false;
    openSensorsPanel.hidden = true;
    openSensorsPanel.setAttribute('aria-hidden', 'true');
    startCommand({
      ...previous,
      previousState: currentEntity?.state || previous.previousState
    });
    const data = {
      entity_id: entityId,
      mode: shortMode,
      force: true
    };
    if (previous.code) data.code = previous.code;
    try {
      await vuePanel.callService('alarmo', 'arm', data);
    } catch (error) {
      showCommandError();
    }
  }

  openSensorsCancel.addEventListener('click', () => {
    openSensorsVisible = false;
    openSensorsPanel.hidden = true;
    openSensorsPanel.setAttribute('aria-hidden', 'true');
    clearPendingCommand();
  });
  openSensorsForce.addEventListener('click', forceArm);
  openSensorsPanel.addEventListener('click', event => {
    if (event.target === openSensorsPanel) openSensorsCancel.click();
  });
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    if (!openSensorsPanel.hidden) openSensorsCancel.click();
    else if (codePanel.classList.contains('is-popup')) closeCodePanel();
  });
  codePanel.addEventListener('click', event => {
    if (event.target === codePanel && codePanel.classList.contains('is-popup')) closeCodePanel();
  });

  function renderModes() {
    const modes = [DISARM_MODE, ...supportedArmModes(currentEntity)];
    const state = knownState(currentEntity?.state);
    const busy = ['arming', 'pending', 'disarming'].includes(state) || state === 'triggered';
    /*
     * Ein laufender Befehl oder das Offene-Sensoren-Popup sperren alles.
     * "pending"/"disarming"/"triggered" sperren dagegen nur die Arm-Modi —
     * gerade dann muss sich die Anlage noch deaktivieren lassen.
     */
    const interactionLocked = commandInFlight || openSensorsVisible;
    const armLocked = interactionLocked || ['pending', 'disarming', 'triggered'].includes(state);
    const activeKey = requestedMode || state;

    modesElement.replaceChildren();
    const buttons = modes.map(mode => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'alarm-mode';
      button.classList.toggle('active', mode.key === activeKey);
      button.classList.toggle('selected', mode.key === requestedMode);
      button.disabled = mode.key === 'disarmed' ? interactionLocked : armLocked;
      const img = document.createElement('img');
      img.className = 'alarm-mode-icon';
      img.alt = '';
      const iconWrap = document.createElement('span');
      iconWrap.className = 'alarm-mode-icon-wrap';
      iconWrap.append(img);
      const label = document.createElement('span');
      label.className = 'alarm-mode-label';
      label.textContent = vuePanel.t(mode.label);
      button.append(iconWrap, label);
      button.addEventListener('click', () => {
        if (mode.key === 'disarmed') {
          if (state === 'disarmed') return;
          requestDisarm();
        } else {
          if (state === mode.key) return;
          requestArm(mode);
        }
      });
      modesElement.append(button);
      return {button, img, icon: mode.icon};
    });

    Promise.all(buttons.map(async entry => {
      entry.img.src = await vuePanel.getIcon(entry.icon, {
        size: 48,
        color: entry.button.classList.contains('active') ? '#ffffff' : '#202020'
      });
    }));
  }

  async function render(entity) {
    currentEntity = entity;
    const state = !entityId ? 'unknown' : !entity ? 'unknown' : knownState(entity.state);
    const armed = state.startsWith('armed');
    const busy = ['arming', 'pending', 'disarming'].includes(state);
    const alarm = state === 'triggered';

    card.classList.toggle('is-armed', armed);
    card.classList.toggle('is-busy', busy);
    card.classList.toggle('is-alarm', alarm);
    updateDelayCountdown(state, entity);
    updateCompleteArc(state);

    nameElement.textContent = String(config.name || entity?.attributes?.friendly_name || vuePanel.t('translation.defaultName'));
    stateElement.textContent = !entityId
      ? vuePanel.t('translation.noEntity')
      : !entity
        ? vuePanel.t('translation.entityNotFound')
        : vuePanel.t(STATE_LABELS[state] || 'translation.states.unknown');

    iconElement.src = await vuePanel.getIcon(STATE_ICONS[state] || 'mdi:shield-off-outline', {
      size: 64,
      color: alarm ? '#e53935' : busy ? '#d59c00' : armed ? '#2f8f4b' : '#737373'
    });

    if (pendingCommand) {
      const succeeded = pendingCommand.type === 'disarm'
        ? ['disarmed', 'disarming'].includes(state)
        : state === pendingCommand.mode.key || state === 'arming';
      if (succeeded && state !== pendingCommand.previousState) {
        const armedMode = pendingCommand.type === 'arm' ? pendingCommand.mode.key : null;
        openSensorsVisible = false;
        openSensorsPanel.hidden = true;
        clearPendingCommand();
        if (state === 'arming') requestedMode = armedMode;
      } else if (pendingCommand.type === 'arm' && openSensorsOf(entity).length) {
        showOpenSensors(entity);
      }
    }

    if (!pendingAction && !pendingCommand && !busy && !alarm) requestedMode = null;

    renderModes();
    await renderOpenSensors(entity);
    updateCodePanelVisibility();
  }

  /* Smart Locks — feste Liste, jede Zeile abonniert ihr eigenes Entity */
  const lockEntries = (Array.isArray(config.locks) ? config.locks : [])
    .filter(item => item && typeof item.entity === 'string' && item.entity);

  function buildLocks() {
    if (!lockEntries.length) {
      locksElement.hidden = true;
      return;
    }
    locksElement.hidden = false;
    locksElement.replaceChildren();

    for (const item of lockEntries) {
      const id = item.entity;
      const row = document.createElement('div');
      row.className = 'alarm-lock';

      const iconWrap = document.createElement('span');
      iconWrap.className = 'alarm-lock-icon';
      const img = document.createElement('img');
      img.alt = '';
      iconWrap.append(img);

      const copy = document.createElement('div');
      copy.className = 'alarm-lock-copy';
      const lockName = document.createElement('div');
      lockName.className = 'alarm-lock-name';
      const lockState = document.createElement('div');
      lockState.className = 'alarm-lock-state';
      copy.append(lockName, lockState);

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'alarm-lock-button';

      row.append(iconWrap, copy, button);
      locksElement.append(row);

      const renderLock = async lockEntity => {
        const state = lockEntity?.state || 'unknown';
        const locked = state === 'locked';
        lockName.textContent = item.name || lockEntity?.attributes?.friendly_name || id || vuePanel.t('translation.locks.defaultName');
        lockState.textContent = vuePanel.t(LOCK_STATE_LABELS[state] || 'translation.locks.unknown');
        button.textContent = vuePanel.t(locked ? 'translation.locks.unlock' : 'translation.locks.lock');
        button.disabled = !lockEntity || state === 'unavailable';
        img.src = await vuePanel.getIcon(locked ? 'mdi:lock' : 'mdi:lock-open-variant', {
          size: 40,
          color: locked ? '#5c635e' : '#9a6d37'
        });
      };

      button.addEventListener('click', async () => {
        const lockEntity = await vuePanel.getEntity(id);
        const service = lockEntity?.state === 'locked' ? 'unlock' : 'lock';
        await vuePanel.callService('lock', service, {}, {entity_id: id});
      });

      vuePanel.getEntity(id).then(renderLock);
      vuePanel.subscribeEntity(id, renderLock);
    }
  }

  renderDots();
  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else {
    await render(null);
  }
  buildLocks();

  bindGestures(card, config, {
    entityId,
    ignore: '#modes, #code-panel, #locks',
    toggle: () => toggleEntity(entityId)
  });
</script>
