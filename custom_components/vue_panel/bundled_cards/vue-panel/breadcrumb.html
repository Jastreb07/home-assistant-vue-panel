<script data-vue-panel-javascript>
  const card = document.getElementById('card');

  /*
   * Navigating rebuilds the trail while the icon requests of the previous
   * run may still be pending. Only the newest run may swap the DOM, and it
   * does so in one go — otherwise two runs would append side by side.
   */
  let renderToken = 0;

  /*
   * The trail comes from the view path: "rooms/kitchen" sits below "rooms".
   * Only views that really exist become crumbs, so a gap in the hierarchy
   * shortens the trail instead of producing a dead link.
   */
  function trailFor(view, views) {
    if (!view || typeof view.path !== 'string') return [];

    const segments = view.path.split('/').filter(Boolean);
    const trail = [];

    for (let index = 0; index < segments.length; index++) {
      const path = segments.slice(0, index + 1).join('/');
      const match = views.find(other => other?.path === path);

      if (match) trail.push(match);
    }

    /* The current view always ends the trail, even without a stored path */
    if (!trail.some(entry => entry.path === view.path)) trail.push(view);

    return trail;
  }

  async function buildCrumb(view, isCurrent, options) {
    const element = document.createElement(isCurrent ? 'span' : 'button');

    if (!isCurrent) element.type = 'button';

    element.className = 'breadcrumb-card__crumb';
    element.classList.toggle('current', isCurrent);

    const label = document.createElement('span');

    label.className = 'breadcrumb-card__text';
    label.textContent = view?.title || '';

    element.append(label);

    if (options.showIcon && view?.icon) {
      const icon = document.createElement('img');

      icon.className = 'breadcrumb-card__icon';
      icon.alt = '';
      icon.src = await vuePanel.getIcon(String(view.icon), {
        size: 40,
        color: options.iconColor
      });

      element.append(icon);
    }

    if (!isCurrent) {
      element.addEventListener('click', () => vuePanel.navigate(view.id));
    }

    return element;
  }

  async function render(view) {
    const token = ++renderToken;
    const config = vuePanel.config;

    const showIcon = config.showIcon !== false;
    const iconPosition = String(config.iconPosition || 'before');

    const iconColor =
      getComputedStyle(document.documentElement)
        .getPropertyValue('--text-primary')
        .trim() || '#ffffff';

    const views = await vuePanel.listViews();

    /* A newer run took over — discard this one */
    if (token !== renderToken) return;

    const trail = trailFor(view, views);
    const children = [];

    for (let index = 0; index < trail.length; index++) {
      if (index > 0) {
        const separator = document.createElement('span');

        separator.className = 'breadcrumb-card__separator';
        separator.textContent = '›';

        children.push(separator);
      }

      const crumb = await buildCrumb(trail[index], index === trail.length - 1, {
        showIcon,
        iconColor
      });

      /* A newer run took over — discard this one */
      if (token !== renderToken) return;

      children.push(crumb);
    }

    card.classList.toggle('icon-after', iconPosition === 'after');
    card.replaceChildren(...children);
  }

  await render(await vuePanel.currentView());

  vuePanel.subscribeNavigation(view => {
    render(view);
  });
</script>
