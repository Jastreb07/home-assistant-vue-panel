<script data-vue-panel-config>
const vuePanelCard={
  "format": "vue-panel-card",
  "formatVersion": 2,
  "apiVersion": 1,
  "manufacturer": "vue-panel",
  "cardName": "cover",
  "name": "Rollladen",
  "description": "Steuert einen Rollladen oder eine Abdeckung",
  "icon": "mdi:window-shutter",
  "group": "Vue Panel",
  "areas": [
    "dashboard",
    "sidebar",
    "header",
    "bottom"
  ],
  "capabilities": [
    "entity:read",
    "entity:subscribe",
    "icon:render",
    "service:call"
  ],
  "defaultSize": {
    "cols": 1,
    "rows": 1,
    "width": 140,
    "height": 120
  },
  "defaultResponsive": {
    "mobile": true,
    "tablet": true,
    "desktop": true,
    "mobileMax": 767,
    "tabletMax": 1023
  },
  "fullRow": false,
  "variables": [
    {
      "key": "entity",
      "label": "Rollladen-Entity",
      "type": "entity",
      "required": true,
      "domain": "cover",
      "default": ""
    },
    {
      "key": "name",
      "label": "Anzeigename",
      "type": "string",
      "required": false,
      "default": ""
    }
  ]
};
</script>
<template data-vue-panel-html>
<article class="tile cover-card" id="card"><span class="tile__icon"><img id="icon" alt=""></span><div class="controls" id="controls"><button data-service="open_cover" title="Öffnen"><img id="open-icon" alt=""></button><button data-service="stop_cover" title="Stoppen"><img id="stop-icon" alt=""></button><button data-service="close_cover" title="Schließen"><img id="close-icon" alt=""></button></div><div class="tile__info"><div class="tile__name" id="name"></div><div class="tile__state" id="state"></div></div></article>
</template>
<style data-vue-panel-css>
.tile{position:relative;width:100%;height:100%;min-height:120px;padding:14px 16px;border-radius:var(--card-radius);display:flex;flex-direction:column;align-items:flex-start;background:var(--card-bg);box-shadow:var(--card-shadow);color:var(--text-primary);overflow:hidden;transition:background .2s}.tile.active{background:#f6d36b;color:#111}.tile__icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgb(215 215 215 / 35%)}.tile.active .tile__icon{background:rgb(255 255 255 / 40%)}.tile__icon img{width:24px;height:24px}.tile__info{width:100%;min-width:0;margin-top:auto}.tile__name,.tile__state{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tile__name{font-size:14px;font-weight:600;line-height:1.2}.tile__state{margin-top:3px;color:#666;font-size:11px;line-height:1.2}.controls{position:absolute;top:16px;right:12px;display:flex;gap:2px}.controls[hidden]{display:none}.controls button{width:24px;height:24px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;cursor:pointer}.controls button:hover{background:rgb(215 215 215 / 35%)}.controls img{width:20px;height:20px}
</style>
<script data-vue-panel-javascript>
const config=vuePanel.config;const entityId=String(config.entity||'');const card=document.getElementById('card');const name=document.getElementById('name');const state=document.getElementById('state');const icon=document.getElementById('icon');const controls=document.getElementById('controls');const labels={open:'Offen',closed:'Geschlossen',opening:'Öffnet',closing:'Schließt'};
for(const [id,value] of [['open-icon','mdi:arrow-up'],['stop-icon','mdi:stop'],['close-icon','mdi:arrow-down']])document.getElementById(id).src=await vuePanel.getIcon(value,{size:48,color:'#111111'});
async function render(entity){const isOpen=entity?.state==='open';card.classList.toggle('active',isOpen);name.textContent=String(config.name||entity?.attributes?.friendly_name||entityId||'Rollladen');const position=Number(entity?.attributes?.current_position);state.textContent=!entityId?'Keine Entity ausgewählt':!entity?'Entity nicht gefunden':`${labels[entity.state]||entity.state}${Number.isFinite(position)?` · ${position} %`:''}`;controls.hidden=!entity;icon.src=await vuePanel.getIcon(isOpen?'mdi:window-shutter-open':'mdi:window-shutter',{size:64,color:isOpen?'#111111':'#737373'});}
controls.addEventListener('click',async event=>{const button=event.target.closest('button');if(button&&entityId)await vuePanel.callService('cover',button.dataset.service,{}, {entity_id:entityId});});if(entityId){await render(await vuePanel.getEntity(entityId));vuePanel.subscribeEntity(entityId,render);}else await render(null);
</script>
