<script data-vue-panel-javascript>
  const config = vuePanel.config;
  const entityId = String(config.entity || '');
  const card = document.getElementById('card');
  const name = document.getElementById('name');
  const state = document.getElementById('state');
  const icon = document.getElementById('icon');
  const controls = document.getElementById('controls');
  const labels = {open: vuePanel.t('translation.states.open'), closed: vuePanel.t('translation.states.closed'), opening: vuePanel.t('translation.states.opening'), closing: vuePanel.t('translation.states.closing')};
  for (const [id, value] of [['open-icon', 'mdi:arrow-up'], ['stop-icon', 'mdi:stop'], ['close-icon', 'mdi:arrow-down']]) document.getElementById(id).src = await vuePanel.getIcon(value, {
    size: 48,
    color: '#111111'
  });

  async function render(entity) {
    const isOpen = entity?.state === 'open';
    card.classList.toggle('active', isOpen);
    name.textContent = String(config.name || entity?.attributes?.friendly_name || entityId || vuePanel.t('translation.defaultName'));
    const position = Number(entity?.attributes?.current_position);
    state.textContent = !entityId ? vuePanel.t('translation.noEntity') : !entity ? vuePanel.t('translation.entityNotFound') : `${labels[entity.state] || entity.state}${Number.isFinite(position) ? ` · ${position} %` : ''}`;
    controls.hidden = !entity;
    icon.src = await vuePanel.getIcon(isOpen ? 'mdi:window-shutter-open' : 'mdi:window-shutter', {
      size: 64,
      color: isOpen ? '#111111' : '#737373'
    });
  }

  controls.addEventListener('click', async event => {
    const button = event.target.closest('button');
    if (button && entityId) await vuePanel.callService('cover', button.dataset.service, {}, {entity_id: entityId});
  });
  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);
</script>
