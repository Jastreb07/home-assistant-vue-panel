<script data-vue-panel-javascript>
  const config = vuePanel.config;

  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const header = document.getElementById('header');
  const headerIcon = document.getElementById('header-icon');
  const title = document.getElementById('title');

  /*
   * Domains, die sich direkt über homeassistant.turn_on/turn_off
   * schalten lassen und deshalb einen Schalter bekommen.
   */
  const TOGGLE_DOMAINS = new Set([
    'automation',
    'fan',
    'humidifier',
    'input_boolean',
    'light',
    'remote',
    'siren',
    'switch'
  ]);

  /*
   * Standard-Icons je Domain, falls die Entity selbst
   * kein Icon liefert und keins konfiguriert wurde.
   */
  const DOMAIN_ICONS = {
    automation: 'mdi:robot',
    binary_sensor: 'mdi:radiobox-marked',
    climate: 'mdi:thermostat',
    cover: 'mdi:window-shutter',
    fan: 'mdi:fan',
    input_boolean: 'mdi:toggle-switch-outline',
    light: 'mdi:lightbulb',
    lock: 'mdi:lock',
    media_player: 'mdi:play-circle-outline',
    person: 'mdi:account',
    scene: 'mdi:palette',
    script: 'mdi:script-text-outline',
    sensor: 'mdi:gauge',
    switch: 'mdi:toggle-switch',
    vacuum: 'mdi:robot-vacuum',
    weather: 'mdi:weather-partly-cloudy'
  };

  const STATE_LABELS = {
    on: 'An',
    off: 'Aus',
    open: 'Offen',
    closed: 'Geschlossen',
    home: 'Zuhause',
    not_home: 'Abwesend',
    locked: 'Verriegelt',
    unlocked: 'Entriegelt',
    unavailable: 'Nicht verfügbar',
    unknown: 'Unbekannt',
    idle: 'Bereit',
    playing: 'Läuft',
    paused: 'Pausiert'
  };

  function domainOf(entityId) {
    return String(entityId || '').split('.')[0];
  }

  function stateText(entity) {
    if (!entity) return 'Nicht gefunden';
    const unit = entity.attributes?.unit_of_measurement;
    const label = STATE_LABELS[entity.state] || entity.state;
    return unit ? `${entity.state} ${unit}` : label;
  }

  /*
   * Konfigurierte Einträge gewinnen; ein Eintrag ohne Entity
   * wird übersprungen, damit leere Zeilen nicht stören.
   */
  const items = (Array.isArray(config.entities) ? config.entities : [])
    .map(item => ({
      entity: item && typeof item.entity === 'string' ? item.entity : '',
      name: item && typeof item.name === 'string' ? item.name : '',
      icon: item && typeof item.icon === 'string' ? item.icon : ''
    }))
    .filter(item => item.entity);

  /*
   * Überschrift
   */
  const headline = String(config.title || '');

  if (headline) {
    header.hidden = false;
    title.textContent = headline;

    if (config.titleIcon) {
      headerIcon.hidden = false;
      headerIcon.src = await vuePanel.getIcon(String(config.titleIcon), {
        size: 60,
        color: '#888888'
      });
    }
  }

  empty.hidden = items.length > 0;

  for (const item of items) {
    const entityId = item.entity;
    const domain = domainOf(entityId);
    const toggleable = config.showToggles !== false && TOGGLE_DOMAINS.has(domain);

    const row = document.createElement('div');

    row.className = 'row';

    /*
     * Icon
     */
    let iconElement = null;

    if (config.showIcons !== false) {
      iconElement = document.createElement('img');
      iconElement.className = 'row__icon';
      iconElement.alt = '';
      row.append(iconElement);
    }

    /*
     * Beschriftung
     */
    const label = document.createElement('div');

    label.className = 'row__label';

    const name = document.createElement('span');

    name.className = 'row__name';

    label.append(name);

    if (config.showSecondary === true) {
      const secondary = document.createElement('span');

      secondary.className = 'row__secondary';
      secondary.textContent = entityId;

      label.append(secondary);
    }

    row.append(label);

    /*
     * Status bzw. Schalter
     */
    const state = document.createElement('span');

    state.className = 'row__state';

    if (config.showStates !== false && !toggleable) row.append(state);

    let toggle = null;

    if (toggleable) {
      toggle = document.createElement('button');
      toggle.className = 'row__toggle';
      toggle.type = 'button';
      toggle.append(document.createElement('span'));
      row.append(toggle);
    }

    list.append(row);

    const render = entity => {
      const isOn = entity?.state === 'on';
      const unavailable = !entity || entity.state === 'unavailable';

      name.textContent = item.name || entity?.attributes?.friendly_name || entityId;
      state.textContent = stateText(entity);

      if (toggle) {
        toggle.classList.toggle('on', isOn);
        toggle.disabled = unavailable;
        toggle.setAttribute('aria-pressed', String(isOn));
        toggle.setAttribute('aria-label', name.textContent);
      }

      if (iconElement) {
        const icon = item.icon
          || entity?.attributes?.icon
          || DOMAIN_ICONS[domain]
          || 'mdi:card-bulleted-outline';

        vuePanel
          .getIcon(String(icon), {size: 72, color: isOn ? '#f6d36b' : '#888888'})
          .then(source => {
            iconElement.src = source;
          });
      }
    };

    if (toggle) {
      toggle.addEventListener('click', async event => {
        event.stopPropagation();

        const entity = await vuePanel.getEntity(entityId);

        await vuePanel.callService(
          'homeassistant',
          entity?.state === 'on' ? 'turn_off' : 'turn_on',
          {},
          {entity_id: entityId}
        );
      });
    }

    render(await vuePanel.getEntity(entityId));

    vuePanel.subscribeEntity(entityId, render);
  }
</script>
