<script data-vue-panel-javascript>
  const config = vuePanel.config;
  /* Lauftext nur, wenn der Text wirklich nicht in die Card passt */
  function applyTextScroll(element, settings) {
    if (!element) return;
    const overflow = element.scrollWidth - element.clientWidth;
    const scrolling = (settings || config).textScroll !== false && overflow > 1;
    element.classList.toggle('is-scrolling', scrolling);
    if (scrolling) element.style.setProperty('--vp-scroll-shift', `-${overflow}px`);
    else element.style.removeProperty('--vp-scroll-shift');
  }

  /* Status und optionales Attribut gemäß den Card-Einstellungen */
  function stateLine(entity, text, settings) {
    const values = settings || config;
    const parts = [];
    if (values.showState !== false) parts.push(text);
    if (values.showAttribute === true) {
      const attribute = String(values.attribute || '');
      const value = attribute ? entity?.attributes?.[attribute] : undefined;
      if (value !== undefined && value !== null && value !== '') parts.push(String(value));
    }
    return parts.filter(Boolean).join(' · ');
  }

  /* Ein einfacher Umschalter für jede Domain */
  async function toggleEntity(id) {
    if (!id) return;
    await vuePanel.callService('homeassistant', 'toggle', {}, {entity_id: id});
  }

  /*
   * Tipp-Aktionen: Tippen, Doppeltippen und Halten. "default" behält die
   * eingebaute Aktion der Card und öffnet beim Halten ohne eigene Aktion die
   * automatische Detailansicht; "more-info" öffnet die Detailansicht (Ziel ist
   * optional eine bestimmte Dialog-Card), "ha-more-info" das native
   * Home-Assistant-Popup und "popup" ein eigenes Vue-Panel-Popup. "assist"
   * braucht einen Home-Assistant-Dialog, den das Panel nicht öffnen kann.
   */
  function bindGestures(element, settings, handlers) {
    /* Das Panel speichert je Geste eine Aktion samt Ziel */
    const slotOf = gesture => (settings.actions || {})[gesture] || {};
    const actionOf = gesture => String(slotOf(gesture).action || 'default');

    const run = async gesture => {
      const action = actionOf(gesture);
      const target = String(slotOf(gesture).target || '');

      if (action === 'none' || action === 'assist') return;
      if (action === 'more-info') {
        return vuePanel.showDetail(target ? {card: target, entity: handlers.entityId} : {entity: handlers.entityId});
      }
      if (action === 'ha-more-info') {
        return handlers.entityId ? vuePanel.showNativeDetail(handlers.entityId) : undefined;
      }
      if (action === 'popup') return target ? vuePanel.openPopup(target) : undefined;
      if (action === 'default') {
        const handled = handlers.default ? handlers.default(gesture) : undefined;
        if (handled !== undefined) return handled;
        /* Ohne eigene Card-Aktion öffnet Halten die automatische Detailansicht */
        if (gesture === 'hold' && handlers.entityId) return vuePanel.showDetail({entity: handlers.entityId});
        return undefined;
      }
      if (action === 'toggle') return handlers.toggle ? handlers.toggle() : undefined;
      if (action === 'navigate') return target ? vuePanel.navigate(target) : undefined;
      if (action === 'url') {
        if (target) window.open(target, '_blank', 'noopener');
        return;
      }
      if (action === 'perform-action') {
        const [domain, service] = target.split('.');
        if (!domain || !service) return;
        await vuePanel.callService(domain, service, {}, handlers.entityId ? {entity_id: handlers.entityId} : {});
      }
    };

    const ignored = event => Boolean(handlers.ignore) && Boolean(event.target.closest(handlers.ignore));
    let holdTimer = null;
    let held = false;
    let taps = 0;

    element.addEventListener('pointerdown', event => {
      if (ignored(event)) return;
      held = false;
      holdTimer = setTimeout(() => {
        holdTimer = null;
        held = true;
        run('hold');
      }, 500);
    });

    for (const name of ['pointerup', 'pointercancel', 'pointerleave']) {
      element.addEventListener(name, () => {
        if (holdTimer) clearTimeout(holdTimer);
        holdTimer = null;
      });
    }

    element.addEventListener('click', event => {
      if (ignored(event)) return;
      if (held) {
        held = false;
        return;
      }
      const doubled = actionOf('double_tap');
      /* Ohne Doppeltipp-Aktion reagiert der einfache Tipp sofort */
      if (doubled === 'default' || doubled === 'none') {
        run('tap');
        return;
      }
      taps += 1;
      if (taps > 1) return;
      setTimeout(() => {
        const wasDoubled = taps > 1;
        taps = 0;
        run(wasDoubled ? 'double_tap' : 'tap');
      }, 250);
    });
  }


  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  empty.textContent = vuePanel.t('translation.empty');
  const header = document.getElementById('header');
  const headerIcon = document.getElementById('header-icon');
  const title = document.getElementById('title');

  /*
   * Domains, die sich direkt über homeassistant.turn_on/turn_off
   * schalten lassen und deshalb einen Schalter bekommen.
   */
  const TOGGLE_DOMAINS = new Set([
    'automation',
    'fan',
    'humidifier',
    'input_boolean',
    'light',
    'remote',
    'siren',
    'switch'
  ]);

  /*
   * Standard-Icons je Domain, falls die Entity selbst
   * kein Icon liefert und keins konfiguriert wurde.
   */
  const DOMAIN_ICONS = {
    automation: 'mdi:robot',
    binary_sensor: 'mdi:radiobox-marked',
    climate: 'mdi:thermostat',
    cover: 'mdi:window-shutter',
    fan: 'mdi:fan',
    input_boolean: 'mdi:toggle-switch-outline',
    light: 'mdi:lightbulb',
    lock: 'mdi:lock',
    media_player: 'mdi:play-circle-outline',
    person: 'mdi:account',
    scene: 'mdi:palette',
    script: 'mdi:script-text-outline',
    sensor: 'mdi:gauge',
    switch: 'mdi:toggle-switch',
    vacuum: 'mdi:robot-vacuum',
    weather: 'mdi:weather-partly-cloudy'
  };

  const STATE_LABELS = {
    on: vuePanel.t('translation.states.on'),
    off: vuePanel.t('translation.states.off'),
    open: vuePanel.t('translation.states.open'),
    closed: vuePanel.t('translation.states.closed'),
    home: vuePanel.t('translation.states.home'),
    not_home: vuePanel.t('translation.states.notHome'),
    locked: vuePanel.t('translation.states.locked'),
    unlocked: vuePanel.t('translation.states.unlocked'),
    unavailable: vuePanel.t('translation.states.unavailable'),
    unknown: vuePanel.t('translation.states.unknown'),
    idle: vuePanel.t('translation.states.idle'),
    playing: vuePanel.t('translation.states.playing'),
    paused: vuePanel.t('translation.states.paused')
  };

  function domainOf(entityId) {
    return String(entityId || '').split('.')[0];
  }

  function stateText(entity) {
    if (!entity) return vuePanel.t('translation.notFound');
    const unit = entity.attributes?.unit_of_measurement;
    const label = STATE_LABELS[entity.state] || entity.state;
    return unit ? `${entity.state} ${unit}` : label;
  }

  /*
   * Konfigurierte Einträge gewinnen; ein Eintrag ohne Entity
   * wird übersprungen, damit leere Zeilen nicht stören.
   */
  const items = (Array.isArray(config.entities) ? config.entities : [])
    .map(item => ({
      ...(item && typeof item === 'object' ? item : {}),
      entity: item && typeof item.entity === 'string' ? item.entity : '',
      name: item && typeof item.name === 'string' ? item.name : '',
      icon: item && typeof item.icon === 'string' ? item.icon : ''
    }))
    .filter(item => item.entity);

  /*
   * Die Einstellungen einer Zeile gewinnen; ohne eigene Angabe gilt die
   * Einstellung der ganzen Card.
   */
  function setting(item, key, cardKey) {
    if (item[key] !== undefined) return item[key] !== false;
    return config[cardKey] !== false;
  }

  /*
   * Überschrift
   */
  const headline = String(config.title || '');

  if (headline) {
    header.hidden = false;
    title.textContent = headline;

    if (config.titleIcon) {
      headerIcon.hidden = false;
      headerIcon.src = await vuePanel.getIcon(String(config.titleIcon), {
        size: 60,
        color: '#888888'
      });
    }
  }

  empty.hidden = items.length > 0;

  for (const item of items) {
    const entityId = item.entity;
    const domain = domainOf(entityId);
    const toggleable = config.showToggles !== false && TOGGLE_DOMAINS.has(domain);

    const showIcon = setting(item, 'showIcon', 'showIcons');
    const showName = setting(item, 'showName', 'showName');
    const showState = setting(item, 'showState', 'showStates');

    const row = document.createElement('div');

    row.className = 'row';

    /*
     * Icon
     */
    let iconElement = null;

    if (showIcon) {
      iconElement = document.createElement('img');
      iconElement.className = 'row__icon';
      iconElement.alt = '';
      row.append(iconElement);
    }

    /*
     * Beschriftung
     */
    const label = document.createElement('div');

    label.className = 'row__label';

    const name = document.createElement('span');

    name.className = 'row__name';

    name.hidden = !showName;

    label.append(name);

    if (config.showSecondary === true) {
      const secondary = document.createElement('span');

      secondary.className = 'row__secondary';
      secondary.textContent = entityId;

      label.append(secondary);
    }

    row.append(label);

    /*
     * Status bzw. Schalter
     */
    const state = document.createElement('span');

    state.className = 'row__state';

    if ((showState || item.showAttribute === true) && !toggleable) row.append(state);

    let toggle = null;

    if (toggleable) {
      toggle = document.createElement('button');
      toggle.className = 'row__toggle';
      toggle.type = 'button';
      toggle.append(document.createElement('span'));
      row.append(toggle);
    }

    list.append(row);

    bindGestures(row, item, {
      entityId,
      ignore: '.row__toggle',
      toggle: () => toggleEntity(entityId),
      default: gesture => (gesture === 'tap' && !toggleable ? toggleEntity(entityId) : undefined)
    });

    const render = entity => {
      const isOn = entity?.state === 'on';
      const unavailable = !entity || entity.state === 'unavailable';

      name.textContent = item.name || entity?.attributes?.friendly_name || entityId;
      state.textContent = stateLine(entity, stateText(entity), {
        showState,
        showAttribute: item.showAttribute === true,
        attribute: item.attribute
      });

      applyTextScroll(name, item);
      applyTextScroll(state, item);

      if (toggle) {
        toggle.classList.toggle('on', isOn);
        toggle.disabled = unavailable;
        toggle.setAttribute('aria-pressed', String(isOn));
        toggle.setAttribute('aria-label', name.textContent);
      }

      if (iconElement) {
        const icon = item.icon
          || entity?.attributes?.icon
          || DOMAIN_ICONS[domain]
          || 'mdi:card-bulleted-outline';

        vuePanel
          .getIcon(String(icon), {size: 72, color: isOn ? '#f6d36b' : '#888888'})
          .then(source => {
            iconElement.src = source;
          });
      }
    };

    if (toggle) {
      toggle.addEventListener('click', async event => {
        event.stopPropagation();

        const entity = await vuePanel.getEntity(entityId);

        await vuePanel.callService(
          'homeassistant',
          entity?.state === 'on' ? 'turn_off' : 'turn_on',
          {},
          {entity_id: entityId}
        );
      });
    }

    render(await vuePanel.getEntity(entityId));

    vuePanel.subscribeEntity(entityId, render);
  }
</script>
