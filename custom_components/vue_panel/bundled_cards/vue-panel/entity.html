      },

        "type": "boolean",
        "required": false,
        "default": true
      }
    ]
  };
</script>

<template data-vue-panel-html>
  <button class="tile entity-card" id="card" type="button">
    <span class="tile__icon"><img id="icon" alt=""></span>
    <span class="tile__info">

</template>

<script data-vue-panel-javascript>
  const config = vuePanel.config;
  const entityId = String(config.entity || '');
  const domain = entityId.split('.')[0];

  const card = document.getElementById('card');
  const icon = document.getElementById('icon');
  const name = document.getElementById('name');
  const state = document.getElementById('state');

  /*
   * Domains, die sich direkt über homeassistant.turn_on/turn_off
   * schalten lassen. Alles andere bleibt reine Anzeige.
   */
  const TOGGLE_DOMAINS = new Set([
    'automation',
    'fan',
    'humidifier',
    'input_boolean',
    'light',
    'remote',
    'siren',
    'switch'
  ]);

  /*
   * Standard-Icons je Domain, falls weder ein Icon konfiguriert
   * wurde noch die Entity selbst eines mitbringt.
   */
  const DOMAIN_ICONS = {
    automation: 'mdi:robot',
    binary_sensor: 'mdi:radiobox-marked',
    button: 'mdi:gesture-tap-button',
    climate: 'mdi:thermostat',
    cover: 'mdi:window-shutter',
    device_tracker: 'mdi:account',
    fan: 'mdi:fan',
    humidifier: 'mdi:air-humidifier',
    input_boolean: 'mdi:toggle-switch-outline',
    input_number: 'mdi:ray-vertex',
    light: 'mdi:lightbulb',
    lock: 'mdi:lock',
    media_player: 'mdi:play-circle-outline',
    number: 'mdi:ray-vertex',
    person: 'mdi:account',
    remote: 'mdi:remote',
    scene: 'mdi:palette',
    script: 'mdi:script-text-outline',
    sensor: 'mdi:gauge',
    siren: 'mdi:bullhorn',
    sun: 'mdi:white-balance-sunny',
    switch: 'mdi:toggle-switch',
    update: 'mdi:package-up',
    vacuum: 'mdi:robot-vacuum',
    weather: 'mdi:weather-partly-cloudy',
    zone: 'mdi:map-marker-radius'
  };

  const STATE_LABELS = {
    on: 'An',
    off: 'Aus',
    open: 'Offen',
    opening: 'Öffnet',
    closed: 'Geschlossen',
    closing: 'Schließt',
    home: 'Zuhause',
    not_home: 'Abwesend',
    locked: 'Verriegelt',
    unlocked: 'Entriegelt',
    unavailable: 'Nicht verfügbar',
    unknown: 'Unbekannt',
    idle: 'Bereit',
    playing: 'Läuft',
    paused: 'Pausiert',
    standby: 'Standby',
    above_horizon: 'Über dem Horizont',
    below_horizon: 'Unter dem Horizont'
  };

  const toggleable = config.toggle !== false && TOGGLE_DOMAINS.has(domain);

  card.classList.toggle('readonly', !toggleable);

  function stateText(entity) {
    if (!entityId) return 'Keine Entity ausgewählt';
    if (!entity) return 'Entity nicht gefunden';

    const unit = entity.attributes?.unit_of_measurement;

    if (unit) return `${entity.state} ${unit}`;

    return STATE_LABELS[entity.state] || entity.state;
  }

  async function render(entity) {
    /*
     * "Aktiv" ist alles, was weder aus, unbekannt
     * noch nicht verfügbar ist.
     */
    const isActive =
      config.highlightActive !== false &&
      Boolean(entity) &&
      !['off', 'unavailable', 'unknown', 'closed', 'not_home', 'idle'].includes(entity.state);

    card.classList.toggle('active', isActive);

    name.textContent = String(
      config.name || entity?.attributes?.friendly_name || entityId || 'Entität'
    );

    state.textContent = stateText(entity);

    const iconName =
      config.icon ||
      entity?.attributes?.icon ||
      DOMAIN_ICONS[domain] ||
      'mdi:card-bulleted-outline';

    icon.src = await vuePanel.getIcon(String(iconName), {
      size: 72,
      color: isActive ? '#111111' : '#737373'
    });
  }

  card.addEventListener('click', async () => {
    if (!toggleable || !entityId) return;

    const entity = await vuePanel.getEntity(entityId);

    await vuePanel.callService(
      'homeassistant',
      entity?.state === 'on' ? 'turn_off' : 'turn_on',
      {},
      {entity_id: entityId}
    );
  });

  if (entityId) {
    await render(await vuePanel.getEntity(entityId));

    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);
</script>
