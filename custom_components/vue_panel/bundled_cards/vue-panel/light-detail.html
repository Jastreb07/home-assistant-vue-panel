<script data-vue-panel-javascript>
  const config = vuePanel.config;
  const entityId = String(config.entity || vuePanel.context.entity || '');

  const card = document.getElementById('card');
  const dial = document.getElementById('dial');
  const arc = document.getElementById('arc-progress');
  const handle = document.getElementById('arc-handle');
  const readout = document.getElementById('status-text');
  const caption = document.getElementById('subtitle-text');
  const colorPreview = document.getElementById('color-preview');
  const toggle = document.getElementById('toggle');
  const powerIcon = document.getElementById('power-icon');
  const controls = document.getElementById('controls');
  const modeButtons = Array.from(controls.querySelectorAll('[data-mode]'));
  const modeIcons = Array.from(controls.querySelectorAll('[data-icon]'));
  const brightnessTrigger = document.getElementById('brightness-trigger');
  const kelvinTrigger = document.getElementById('kelvin-trigger');
  const brightnessPresets = document.getElementById('brightness-presets');
  const kelvinPresets = document.getElementById('kelvin-presets');
  const effectTrigger = document.getElementById('effect-trigger');
  const effectsPopup = document.getElementById('effects-popup');
  const hint = document.getElementById('hint');

  const SVG_RADIUS = 107;
  const HANDLE_RADIUS = 166;
  const HANDLE_CENTER = 180;
  const CIRCUMFERENCE = 2 * Math.PI * SVG_RADIUS;
  const PRESETS = [5, 25, 50, 75, 100];
  const HOLD_DELAY = 520;

  /*
   * Home Assistant exposes a light's capabilities through
   * supported_color_modes. Only controls backed by the entity are shown.
   */
  const COLOR_MODES = ['hs', 'xy', 'rgb', 'rgbw', 'rgbww'];
  const DIMMABLE_MODES = ['brightness', 'color_temp', 'white'].concat(COLOR_MODES);

  let entity = null;
  let activeMode = '';
  let dialMode = '';
  let dragValue = null;
  let dragging = false;
  let commitTimer = null;
  let dragAccumulatedAngle = 0;
  let dragLastRawAngle = 0;
  let holdTimer = null;
  let holdTriggered = false;

  arc.style.strokeDasharray = String(CIRCUMFERENCE);

  async function loadIcons() {
    powerIcon.src = await vuePanel.getIcon('mdi:power', {size: 48, color: '#5c5c5c'});
    await Promise.all(modeIcons.map(async image => {
      image.src = await vuePanel.getIcon(image.dataset.icon, {size: 72, color: '#666666'});
    }));
  }

  function attributes() {
    return (entity && entity.attributes) || {};
  }

  function features() {
    const raw = attributes().supported_color_modes;
    const modes = Array.isArray(raw) ? raw.map(String) : [];
    const list = attributes().effect_list;
    return {
      /* Older integrations may expose values without reporting color modes. */
      brightness: modes.some(mode => DIMMABLE_MODES.includes(mode))
        || (!modes.length && Number.isFinite(Number(attributes().brightness))),
      colorTemp: modes.includes('color_temp')
        || (!modes.length && Number.isFinite(Number(attributes().color_temp_kelvin))),
      color: modes.some(mode => COLOR_MODES.includes(mode))
        || (!modes.length && Array.isArray(attributes().hs_color)),
      effects: Array.isArray(list) && list.length > 0
    };
  }

  function availableModes() {
    const can = features();
    return ['brightness', 'colorTemp', 'color', 'effects'].filter(mode => can[mode]);
  }

  function kelvinRange() {
    return {
      min: Math.round(Number(attributes().min_color_temp_kelvin) || 2000),
      max: Math.round(Number(attributes().max_color_temp_kelvin) || 6500)
    };
  }

  function hueCss(value, light) {
    return 'hsl(' + Math.round(value) + ' 100% ' + (light || 50) + '%)';
  }

  /* Return the active control's value as a 0..1 fraction. */
  function fractionOf(mode) {
    if (dragValue !== null && mode === dialMode) return dragValue;
    if (mode === 'brightness') {
      const level = Number(attributes().brightness);
      return Number.isFinite(level) ? Math.min(1, Math.max(0, level / 255)) : 0;
    }
    if (mode === 'colorTemp') {
      const range = kelvinRange();
      const kelvin = Number(attributes().color_temp_kelvin);
      if (!Number.isFinite(kelvin) || range.max <= range.min) return 0.5;
      return Math.min(1, Math.max(0, (kelvin - range.min) / (range.max - range.min)));
    }
    if (mode === 'color') {
      const hs = attributes().hs_color;
      return Array.isArray(hs) ? (Number(hs[0]) || 0) / 360 : 0;
    }
    return 0;
  }

  function readoutFor(mode, fraction) {
    if (!entity || entity.state !== 'on') return vuePanel.t('translation.states.off');
    if (mode === 'brightness') return Math.max(1, Math.round(fraction * 100)) + '%';
    if (mode === 'colorTemp') {
      const range = kelvinRange();
      return Math.round(range.min + fraction * (range.max - range.min)) + 'K';
    }
    if (mode === 'color') return Math.round(fraction * 360) + '°';
    return vuePanel.t('translation.states.on');
  }

  function kelvinColor(fraction) {
    const warm = [235, 145, 45];
    const cool = [95, 145, 235];
    const red = Math.round(warm[0] + (cool[0] - warm[0]) * fraction);
    const green = Math.round(warm[1] + (cool[1] - warm[1]) * fraction);
    const blue = Math.round(warm[2] + (cool[2] - warm[2]) * fraction);
    return 'rgb(' + red + ', ' + green + ', ' + blue + ')';
  }

  function isDialInteractive() {
    return Boolean(entity)
      && entity.state === 'on'
      && Boolean(dialMode)
      && dialMode !== 'static';
  }

  function paintDial() {
    const fraction = fractionOf(dialMode);
    const isOn = Boolean(entity) && entity.state === 'on';
    const isStatic = dialMode === 'static';
    const shown = isStatic ? (isOn ? 1 : 0) : Math.max(0, Math.min(1, fraction));
    const isColor = dialMode === 'color';
    const color = isColor
      ? hueCss(shown * 360)
      : dialMode === 'colorTemp' ? kelvinColor(shown) : '#b8b8b8';

    dial.classList.toggle('is-enabled', isDialInteractive());
    dial.classList.toggle('is-static-on', isStatic && isOn);
    dial.classList.toggle('color-mode', isColor);
    dial.style.setProperty('--selected-color', color);
    arc.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - shown));
    arc.style.stroke = color;

    const angle = shown * 2 * Math.PI - Math.PI / 2;
    handle.style.left = (HANDLE_CENTER + HANDLE_RADIUS * Math.cos(angle)).toFixed(1) + 'px';
    handle.style.top = (HANDLE_CENTER + HANDLE_RADIUS * Math.sin(angle)).toFixed(1) + 'px';
    handle.style.background = color;

    readout.textContent = readoutFor(dialMode, fraction);
    caption.textContent = isStatic
      ? vuePanel.t('translation.toggle')
      : (dialMode ? vuePanel.t('translation.modes.' + dialMode) : '');
    readout.classList.toggle('small', isOn && (dialMode === 'colorTemp' || isColor));
    colorPreview.classList.toggle('visible', isOn && isColor);
    colorPreview.style.background = color;

    dial.setAttribute('aria-label', caption.textContent);
    if (isStatic) {
      dial.setAttribute('aria-valuemin', '0');
      dial.setAttribute('aria-valuemax', '1');
      dial.setAttribute('aria-valuenow', isOn ? '1' : '0');
    } else {
      dial.setAttribute('aria-valuemin', dialMode === 'colorTemp' ? String(kelvinRange().min) : '0');
      dial.setAttribute('aria-valuemax', dialMode === 'colorTemp' ? String(kelvinRange().max) : (isColor ? '360' : '100'));
      dial.setAttribute('aria-valuenow', readout.textContent.replace(/\D/g, ''));
    }
  }

  function renderModes(modes) {
    for (const button of modeButtons) {
      const mode = button.dataset.mode;
      const supported = modes.includes(mode);
      button.hidden = false;
      button.disabled = !supported;
      button.setAttribute('aria-disabled', String(!supported));
      button.classList.toggle('is-active', supported && mode === activeMode);
      const label = button.querySelector('[data-label]');
      if (label) {
        label.textContent = mode === 'colorTemp' ? 'Kelvin' : vuePanel.t('translation.modes.' + mode);
      }
    }
  }

  function renderEffects() {
    const list = (attributes().effect_list || []).map(String);
    const active = String(attributes().effect || '');
    if (effectsPopup.dataset.list !== list.join('|')) {
      effectsPopup.dataset.list = list.join('|');
      effectsPopup.textContent = '';
      for (const item of list) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'effect-option';
        button.dataset.effect = item;
        button.textContent = item;
        button.addEventListener('click', event => {
          event.stopPropagation();
          if (!entityId) return;
          vuePanel.callService('light', 'turn_on', {effect: item}, {entity_id: entityId});
          setEffectsPopup(false);
        });
        effectsPopup.appendChild(button);
      }
    }
    for (const button of effectsPopup.children) {
      button.classList.toggle('active', button.dataset.effect === active);
    }
  }

  function selectMode(mode) {
    if (mode === 'effects') return;
    activeMode = mode;
    dragValue = null;
    closePopups();
    update();
  }

  function rawPointerAngle(event) {
    const box = dial.getBoundingClientRect();
    const dx = event.clientX - (box.left + box.width / 2);
    const dy = event.clientY - (box.top + box.height / 2);
    let angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;
    if (angle < 0) angle += 360;
    return angle;
  }

  function shortestAngleDelta(from, to) {
    let delta = to - from;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    return delta;
  }

  async function commit(fraction) {
    if (!entityId) return;
    if (dialMode === 'brightness') {
      await vuePanel.callService(
        'light', 'turn_on', {brightness_pct: Math.max(1, Math.round(fraction * 100))}, {entity_id: entityId}
      );
      return;
    }
    if (dialMode === 'colorTemp') {
      const range = kelvinRange();
      await vuePanel.callService(
        'light', 'turn_on',
        {color_temp_kelvin: Math.round(range.min + fraction * (range.max - range.min))},
        {entity_id: entityId}
      );
      return;
    }
    if (dialMode === 'color') {
      const hs = attributes().hs_color;
      const saturation = Array.isArray(hs) ? Number(hs[1]) || 100 : 100;
      await vuePanel.callService(
        'light', 'turn_on', {hs_color: [Math.round(fraction * 360), saturation]}, {entity_id: entityId}
      );
    }
  }

  dial.addEventListener('pointerdown', event => {
    if (!isDialInteractive()) return;
    dragging = true;
    dial.classList.add('is-dragging');
    dial.setPointerCapture(event.pointerId);
    dragAccumulatedAngle = fractionOf(dialMode) * 360;
    dragLastRawAngle = rawPointerAngle(event);
  });

  dial.addEventListener('pointermove', event => {
    if (!dragging) return;
    const raw = rawPointerAngle(event);
    dragAccumulatedAngle = Math.max(
      0,
      Math.min(360, dragAccumulatedAngle + shortestAngleDelta(dragLastRawAngle, raw))
    );
    dragLastRawAngle = raw;
    dragValue = dragAccumulatedAngle / 360;
    paintDial();
    if (commitTimer === null) {
      commitTimer = setTimeout(() => {
        commitTimer = null;
        if (dragValue !== null) commit(dragValue).catch(() => {});
      }, 180);
    }
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    dial.classList.remove('is-dragging');
    const value = dragValue;
    dragValue = null;
    if (value !== null) commit(value).catch(() => {});
  }

  dial.addEventListener('pointerup', endDrag);
  dial.addEventListener('pointercancel', endDrag);

  dial.addEventListener('wheel', event => {
    if (!isDialInteractive()) return;
    event.preventDefault();
    const step = dialMode === 'colorTemp' ? 50 / (kelvinRange().max - kelvinRange().min) : .01;
    dragValue = Math.max(0, Math.min(1, fractionOf(dialMode) + (event.deltaY < 0 ? step : -step)));
    const value = dragValue;
    paintDial();
    dragValue = null;
    commit(value).catch(() => {});
  }, {passive: false});

  for (const button of modeButtons) {
    if (button.dataset.mode !== 'effects') {
      button.addEventListener('click', () => {
        if (!holdTriggered) selectMode(button.dataset.mode);
      });
    }
  }

  function closePresetPopups() {
    brightnessPresets.classList.remove('visible');
    kelvinPresets.classList.remove('visible');
    brightnessTrigger.closest('.control').classList.remove('popup-open');
    kelvinTrigger.closest('.control').classList.remove('popup-open');
  }

  function setEffectsPopup(open) {
    effectsPopup.classList.toggle('visible', open);
    effectTrigger.classList.toggle('popup-open', open);
    effectTrigger.setAttribute('aria-expanded', String(open));
  }

  function closePopups() {
    closePresetPopups();
    setEffectsPopup(false);
  }

  function createPresetButtons(container, mode) {
    for (const percent of PRESETS) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'preset-option';
      button.dataset.value = String(percent);
      button.textContent = percent + '%';
      button.addEventListener('click', event => {
        event.stopPropagation();
        selectMode(mode);
        const fraction = percent / 100;
        dragValue = fraction;
        paintDial();
        dragValue = null;
        commit(fraction).catch(() => {});
        closePresetPopups();
      });
      container.appendChild(button);
    }
  }

  function setupLongHold(trigger, container, mode) {
    trigger.addEventListener('pointerdown', event => {
      if (!entity || entity.state !== 'on' || event.button !== 0) return;
      holdTriggered = false;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        holdTriggered = true;
        closePopups();
        selectMode(mode);
        container.classList.add('visible');
        trigger.closest('.control').classList.add('popup-open');
      }, HOLD_DELAY);
    });
    const cancel = () => {
      clearTimeout(holdTimer);
      holdTimer = null;
    };
    trigger.addEventListener('pointerup', cancel);
    trigger.addEventListener('pointercancel', cancel);
    trigger.addEventListener('pointerleave', cancel);
    trigger.closest('.control').addEventListener('click', event => {
      if (!holdTriggered) return;
      event.preventDefault();
      event.stopPropagation();
      holdTriggered = false;
    });
  }

  createPresetButtons(brightnessPresets, 'brightness');
  createPresetButtons(kelvinPresets, 'colorTemp');
  setupLongHold(brightnessTrigger, brightnessPresets, 'brightness');
  setupLongHold(kelvinTrigger, kelvinPresets, 'colorTemp');

  effectTrigger.addEventListener('click', event => {
    event.stopPropagation();
    if (!entity || entity.state !== 'on') return;
    closePresetPopups();
    setEffectsPopup(!effectsPopup.classList.contains('visible'));
  });

  document.addEventListener('click', event => {
    if (!effectsPopup.contains(event.target) && !effectTrigger.contains(event.target)) {
      setEffectsPopup(false);
    }
    if (!brightnessPresets.contains(event.target) && !brightnessTrigger.contains(event.target)
      && !kelvinPresets.contains(event.target) && !kelvinTrigger.contains(event.target)) {
      closePresetPopups();
    }
  });

  toggle.addEventListener('click', () => {
    if (!entityId) return;
    closePopups();
    const service = entity && entity.state === 'on' ? 'turn_off' : 'turn_on';
    vuePanel.callService('light', service, {}, {entity_id: entityId});
  });

  function updatePresetHighlights() {
    const brightness = Math.round(fractionOf('brightness') * 100);
    for (const button of brightnessPresets.children) {
      button.classList.toggle('active', Number(button.dataset.value) === brightness);
    }
    const temperature = Math.round(fractionOf('colorTemp') * 100);
    for (const button of kelvinPresets.children) {
      button.classList.toggle('active', Number(button.dataset.value) === temperature);
    }
  }

  async function update() {
    const isOn = Boolean(entity) && entity.state === 'on';
    card.classList.toggle('is-on', isOn);
    toggle.setAttribute('aria-checked', isOn ? 'true' : 'false');

    if (!entityId || !entity) {
      hint.hidden = false;
      hint.textContent = vuePanel.t(entityId ? 'translation.entityNotFound' : 'translation.noEntity');
      dial.hidden = true;
      controls.hidden = true;
      dialMode = '';
      return;
    }

    const modes = availableModes();
    const dialModes = modes.filter(mode => mode !== 'effects');
    if (!dialModes.includes(activeMode)) activeMode = dialModes[0] || '';
    renderModes(modes);
    if (modes.includes('effects')) renderEffects();

    hint.hidden = true;
    controls.hidden = false;
    dialMode = dialModes.length > 0 ? activeMode : 'static';
    dial.hidden = false;
    if (!isOn) closePopups();
    updatePresetHighlights();
    paintDial();
  }

  async function render(next) {
    entity = next;
    await update();
  }

  window.addEventListener('resize', () => { if (!dial.hidden) paintDial(); });
  /* Repaint after the dialog has completed its initial layout. */
  setTimeout(() => { if (!dial.hidden) paintDial(); }, 0);

  await loadIcons();

  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);
</script>
