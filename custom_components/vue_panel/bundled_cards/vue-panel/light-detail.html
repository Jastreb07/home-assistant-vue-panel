   * bleiben; ohne Dialog deckt er die Card ab.
   */
  .scrim {
    position: fixed;
    z-index: 40;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, .10);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .hint {
    margin: 18px 20px 0;
    color: rgba(0, 0, 0, .58);
    font-size: 12px;
    text-align: center;
  }

  [hidden] { display: none !important; }

  @media (max-width: 390px) {
    .target-main { font-size: 40px; line-height: 40px; }
    .target.is-word .target-main { font-size: 28px; }
    .target-fraction { font-size: 24px; line-height: 18px; }
    .light-ui { --selects-width: 180px; }
    .controls { gap: 8px 14px; }
  }
</style>

<script data-vue-panel-javascript>
  const config = vuePanel.config;
  const entityId = String(config.entity || vuePanel.context.entity || '');

  const VIEW_WIDTH = 360;
  const VIEW_HEIGHT = 300;
  const CENTER_X = 180;
  const CENTER_Y = 160;
  const ARC_RADIUS = 140;
  const ARC_START = 135;
  const ARC_SPAN = 270;
  const DRAG_THRESHOLD = 4;
  const MIN_SEGMENTS = 3;
  const PRESETS = [5, 25, 50, 75, 100];
  const HOLD_DELAY = 520;
  const SVG_NS = 'http://www.w3.org/2000/svg';
  /* `stroke` muss der Strichbreite von `.slice` entsprechen, `gap` ist der sichtbare Abstand */
  const RADIAL = {size: 320, center: 160, hub: 60, inner: 80, outer: 146, stroke: 9, gap: 7};

  /*
   * Home Assistant beschreibt die Fähigkeiten eines Lichts über
   * `supported_color_modes`; angezeigt wird nur, was die Entity hergibt.
   */
  const COLOR_MODES = ['hs', 'xy', 'rgb', 'rgbw', 'rgbww'];
  const DIMMABLE_MODES = ['brightness', 'color_temp', 'white'].concat(COLOR_MODES);

  const card = document.getElementById('card');
  const dial = document.getElementById('dial');
  const arcTrack = document.getElementById('arc-track');
  const arcValue = document.getElementById('arc-value');
  const arcHit = document.getElementById('arc-hit');
  const handle = document.getElementById('arc-handle');
  const stateIcon = document.getElementById('state-icon');
  const warningIcon = document.getElementById('warning-icon');
  const effectIcon = document.getElementById('effect-icon');
  const valueTarget = document.getElementById('value-target');
  const colorPreview = document.getElementById('color-preview');
  const valueMain = document.getElementById('value-main');
  const valueUnit = document.getElementById('value-unit');
  const valueFraction = document.getElementById('value-fraction');
  const brightnessMetric = document.getElementById('brightness-metric');
  const brightnessValue = document.getElementById('brightness-value');
  const kelvinMetric = document.getElementById('kelvin-metric');
  const kelvinValue = document.getElementById('kelvin-value');
  const selects = document.getElementById('selects');
  const powerSelect = document.getElementById('power-select');
  const powerTrigger = document.getElementById('power-trigger');
  const powerLabel = document.getElementById('power-label');
  const effectSelect = {
    root: document.getElementById('effect-select'),
    trigger: document.getElementById('effect-trigger'),
    label: document.getElementById('effect-label'),
    caret: document.getElementById('effect-caret'),
    menu: document.getElementById('effect-menu'),
    svg: document.getElementById('effect-radial'),
    caption: vuePanel.t('translation.captions.effect')
  };
  const scrim = document.getElementById('scrim');
  const controls = document.getElementById('controls');
  const modeButtons = Array.from(controls.querySelectorAll('[data-mode]'));
  const modeIcons = Array.from(controls.querySelectorAll('[data-icon]'));
  const brightnessTrigger = document.getElementById('brightness-trigger');
  const kelvinTrigger = document.getElementById('kelvin-trigger');
  const brightnessPresets = document.getElementById('brightness-presets');
  const kelvinPresets = document.getElementById('kelvin-presets');
  const hint = document.getElementById('hint');

  let entity = null;
  let activeMode = '';
  let dialMode = '';
  let dragValue = null;
  let dragging = false;
  let dragPointerId = null;
  let dragOrigin = null;
  let commitTimer = null;
  let holdTimer = null;
  let holdTriggered = false;
  const iconCache = new Map();
  const arcLength = arcTrack.getTotalLength();

  function attributes() {
    return (entity && entity.attributes) || {};
  }

  function isOn() {
    return Boolean(entity) && entity.state === 'on';
  }

  function iconSource(name, color = '#666666') {
    const key = `${name}-${color}`;
    if (!iconCache.has(key)) iconCache.set(key, vuePanel.getIcon(name, {size: 72, color}));
    return iconCache.get(key);
  }

  function features() {
    const raw = attributes().supported_color_modes;
    const modes = Array.isArray(raw) ? raw.map(String) : [];
    const list = attributes().effect_list;
    return {
      /* Ältere Integrationen melden Werte, ohne Farbmodi zu deklarieren */
      brightness: modes.some(mode => DIMMABLE_MODES.includes(mode))
        || (!modes.length && Number.isFinite(Number(attributes().brightness))),
      colorTemp: modes.includes('color_temp')
        || (!modes.length && Number.isFinite(Number(attributes().color_temp_kelvin))),
      color: modes.some(mode => COLOR_MODES.includes(mode))
        || (!modes.length && Array.isArray(attributes().hs_color)),
      effects: Array.isArray(list) && list.length > 0
    };
  }

  function availableModes() {
    const can = features();
    return ['brightness', 'colorTemp', 'color'].filter(mode => can[mode]);
  }

  function kelvinRange() {
    return {
      min: Math.round(Number(attributes().min_color_temp_kelvin) || 2000),
      max: Math.round(Number(attributes().max_color_temp_kelvin) || 6500)
    };
  }

  function hueCss(value, light) {
    return `hsl(${Math.round(value)} 100% ${light || 50}%)`;
  }

  function kelvinColor(fraction) {
    const warm = [235, 145, 45];
    const cool = [95, 145, 235];
    const mix = index => Math.round(warm[index] + (cool[index] - warm[index]) * fraction);
    return `rgb(${mix(0)}, ${mix(1)}, ${mix(2)})`;
  }

  /* Der aktive Regler als Anteil zwischen 0 und 1 */
  function fractionOf(mode) {
    if (dragValue !== null && mode === dialMode) return dragValue;
    if (mode === 'brightness') {
      const level = Number(attributes().brightness);
      return Number.isFinite(level) ? Math.min(1, Math.max(0, level / 255)) : 0;
    }
    if (mode === 'colorTemp') {
      const range = kelvinRange();
      const kelvin = Number(attributes().color_temp_kelvin);
      if (!Number.isFinite(kelvin) || range.max <= range.min) return 0.5;
      return Math.min(1, Math.max(0, (kelvin - range.min) / (range.max - range.min)));
    }
    if (mode === 'color') {
      const hs = attributes().hs_color;
      return Array.isArray(hs) ? (Number(hs[0]) || 0) / 360 : 0;
    }
    return 0;
  }

  /* Großer Wert: Zahl links, Einheit klein daneben — wie in der Thermostat-Card */
  function readout(mode, fraction) {
    if (!isOn()) return {main: vuePanel.t('translation.states.off'), unit: '', word: true};
    if (mode === 'brightness') return {main: String(Math.max(1, Math.round(fraction * 100))), unit: '%'};
    if (mode === 'colorTemp') {
      const range = kelvinRange();
      return {main: String(Math.round(range.min + fraction * (range.max - range.min))), unit: 'K'};
    }
    if (mode === 'color') return {main: String(Math.round(fraction * 360)), unit: '°'};
    return {main: vuePanel.t('translation.states.on'), unit: '', word: true};
  }

  /* Die tatsächliche Lichtfarbe — Farbton vom Regler, Sättigung von der Entity */
  function currentColorCss(fraction) {
    const hs = attributes().hs_color;
    const saturation = Array.isArray(hs) && Number.isFinite(Number(hs[1])) ? Number(hs[1]) : 100;
    return `hsl(${Math.round(fraction * 360)} ${Math.round(saturation)}% 50%)`;
  }

  function modeColor(mode, fraction) {
    if (mode === 'color') return hueCss(fraction * 360);
    if (mode === 'colorTemp') return kelvinColor(fraction);
    return '#f3c988';
  }

  function isDialInteractive() {
    return isOn() && Boolean(dialMode);
  }

  function setSegment(path, from, to) {
    const start = Math.max(0, Math.min(1, from));
    const end = Math.max(start, Math.min(1, to));
    const length = (end - start) * arcLength;
    path.hidden = length < 0.5;
    path.style.strokeDasharray = `${length} ${arcLength + 1}`;
    path.style.strokeDashoffset = String(-start * arcLength);
  }

  function placeOnArc(element, value) {
    const angle = (ARC_START + Math.max(0, Math.min(1, value)) * ARC_SPAN) * Math.PI / 180;
    const x = CENTER_X + ARC_RADIUS * Math.cos(angle);
    const y = CENTER_Y + ARC_RADIUS * Math.sin(angle);
    element.style.left = `${x / VIEW_WIDTH * 100}%`;
    element.style.top = `${y / VIEW_HEIGHT * 100}%`;
  }

  function paintDial() {
    const fraction = Math.max(0, Math.min(1, fractionOf(dialMode)));
    const color = isOn() ? modeColor(dialMode, fraction) : 'rgba(0, 0, 0, .18)';
    const shown = dialMode ? fraction : (isOn() ? 1 : 0);

    dial.classList.toggle('is-enabled', isDialInteractive());
    dial.classList.toggle('color-mode', dialMode === 'color' && isOn());
    setSegment(arcValue, 0, shown);
    arcValue.style.stroke = color;
    placeOnArc(handle, shown);
    handle.style.background = color;

    /* Im Farbmodus ersetzt die Farbfläche den Zahlenwert */
    const showColor = dialMode === 'color' && isOn();
    colorPreview.hidden = !showColor;
    valueTarget.hidden = showColor;
    if (showColor) colorPreview.style.background = currentColorCss(fraction);

    const text = readout(dialMode, fraction);
    valueMain.textContent = text.main;
    valueUnit.textContent = text.unit;
    valueFraction.textContent = '';
    valueTarget.classList.toggle('is-word', Boolean(text.word));

    dial.setAttribute('aria-label', dialMode ? vuePanel.t(`translation.modes.${dialMode}`) : vuePanel.t('translation.states.on'));
    dial.setAttribute('aria-valuemin', dialMode === 'colorTemp' ? String(kelvinRange().min) : '0');
    dial.setAttribute(
      'aria-valuemax',
      dialMode === 'colorTemp' ? String(kelvinRange().max) : dialMode === 'color' ? '360' : '100'
    );
    dial.setAttribute('aria-valuenow', text.main.replace(/\D/g, '') || '0');
  }

  async function commit(fraction) {
    if (!entityId) return;
    if (dialMode === 'brightness') {
      await vuePanel.callService(
        'light', 'turn_on', {brightness_pct: Math.max(1, Math.round(fraction * 100))}, {entity_id: entityId}
      );
      return;
    }
    if (dialMode === 'colorTemp') {
      const range = kelvinRange();
      await vuePanel.callService(
        'light', 'turn_on',
        {color_temp_kelvin: Math.round(range.min + fraction * (range.max - range.min))},
        {entity_id: entityId}
      );
      return;
    }
    if (dialMode === 'color') {
      const hs = attributes().hs_color;
      const saturation = Array.isArray(hs) ? Number(hs[1]) || 100 : 100;
      await vuePanel.callService(
        'light', 'turn_on', {hs_color: [Math.round(fraction * 360), saturation]}, {entity_id: entityId}
      );
    }
  }

  function queueCommit() {
    if (commitTimer !== null) return;
    commitTimer = setTimeout(() => {
      commitTimer = null;
      if (dragValue !== null) commit(dragValue).catch(() => {});
    }, 180);
  }

  function pointerFraction(event) {
    const box = dial.getBoundingClientRect();
    const x = (event.clientX - box.left) / box.width * VIEW_WIDTH;
    const y = (event.clientY - box.top) / box.height * VIEW_HEIGHT;
    let angle = Math.atan2(y - CENTER_Y, x - CENTER_X) * 180 / Math.PI;
    if (angle < 0) angle += 360;
    const delta = (angle - ARC_START + 360) % 360;
    if (delta <= ARC_SPAN) return delta / ARC_SPAN;
    /* Unterhalb der Lücke gilt das jeweils nähere Ende des Bogens */
    return delta < ARC_SPAN + (360 - ARC_SPAN) / 2 ? 1 : 0;
  }

  /* Alle Zeigergesten hängen am Trefferband des Bogens, nicht an der Dial-Fläche */
  arcHit.addEventListener('pointerdown', event => {
    if (!isDialInteractive() || event.button !== 0) return;
    dragging = true;
    dragPointerId = event.pointerId;
    dragOrigin = {x: event.clientX, y: event.clientY};
    dial.classList.add('is-pressed');
    arcHit.setPointerCapture(event.pointerId);
    /* Ein Tipp springt animiert auf die getippte Stelle */
    dragValue = pointerFraction(event);
    paintDial();
    queueCommit();
  });

  arcHit.addEventListener('pointermove', event => {
    if (!dragging || event.pointerId !== dragPointerId) return;
    /* Erst ein echter Zug schaltet die Übergänge ab, damit er dem Finger folgt */
    if (dragOrigin && Math.hypot(event.clientX - dragOrigin.x, event.clientY - dragOrigin.y) > DRAG_THRESHOLD) {
      dragOrigin = null;
      dial.classList.add('is-dragging');
    }
    dragValue = pointerFraction(event);
    paintDial();
    queueCommit();
  });

  function endDrag(event) {
    if (!dragging || event.pointerId !== dragPointerId) return;
    dragging = false;
    dragPointerId = null;
    dragOrigin = null;
    dial.classList.remove('is-pressed', 'is-dragging');
    if (commitTimer !== null) {
      clearTimeout(commitTimer);
      commitTimer = null;
    }
    const value = dragValue;
    dragValue = null;
    if (value !== null) commit(value).catch(() => {});
  }

  arcHit.addEventListener('pointerup', endDrag);
  arcHit.addEventListener('pointercancel', endDrag);
  arcHit.addEventListener('wheel', event => {
    if (!isDialInteractive()) return;
    event.preventDefault();
    const step = dialMode === 'colorTemp' ? 50 / (kelvinRange().max - kelvinRange().min) : .01;
    dragValue = Math.max(0, Math.min(1, fractionOf(dialMode) + (event.deltaY < 0 ? step : -step)));
    const value = dragValue;
    paintDial();
    dragValue = null;
    commit(value).catch(() => {});
  }, {passive: false});

  dial.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowDown', 'ArrowRight', 'ArrowUp'].includes(event.key) || !isDialInteractive()) return;
    event.preventDefault();
    const step = dialMode === 'colorTemp' ? 50 / (kelvinRange().max - kelvinRange().min) : .01;
    dragValue = Math.max(0, Math.min(1, fractionOf(dialMode) + (['ArrowRight', 'ArrowUp'].includes(event.key) ? step : -step)));
    const value = dragValue;
    paintDial();
    dragValue = null;
    commit(value).catch(() => {});
  });

  /* ---- Radiales Effektmenü ------------------------------------------------ */

  function svgNode(name, attributesMap = {}) {
    const node = document.createElementNS(SVG_NS, name);
    for (const [key, value] of Object.entries(attributesMap)) node.setAttribute(key, String(value));
    return node;
  }

  function polar(radius, degrees) {
    const angle = (degrees - 90) * Math.PI / 180;
    return [RADIAL.center + radius * Math.cos(angle), RADIAL.center + radius * Math.sin(angle)];
  }

  /*
   * Ein Ringsegment von `from` bis `to` Grad. Der Einzug wird je Radius aus
   * einer festen Bogenlänge gerechnet — dadurch bleibt die Lücke zum Nachbarn
   * innen wie außen und bei jeder Segmentzahl gleich breit.
   */
  function wedgePath(from, to) {
    const inset = (RADIAL.gap + RADIAL.stroke) / 2;
    const limit = Math.max(0, (to - from) / 2 - 1);
    const outerOffset = Math.min(inset / RADIAL.outer * 180 / Math.PI, limit);
    const innerOffset = Math.min(inset / RADIAL.inner * 180 / Math.PI, limit);
    const [x1, y1] = polar(RADIAL.outer, from + outerOffset);
    const [x2, y2] = polar(RADIAL.outer, to - outerOffset);
    const [x3, y3] = polar(RADIAL.inner, to - innerOffset);
    const [x4, y4] = polar(RADIAL.inner, from + innerOffset);
    const large = to - from > 180 ? 1 : 0;
    return `M${x1} ${y1} A${RADIAL.outer} ${RADIAL.outer} 0 ${large} 1 ${x2} ${y2}`
      + ` L${x3} ${y3} A${RADIAL.inner} ${RADIAL.inner} 0 ${large} 0 ${x4} ${y4} Z`;
  }

  /* Lange Beschriftungen brechen auf zwei Zeilen um */
  function wrapLabel(text, maxChars) {
    const words = String(text).replace(/\//g, '/ ').split(/\s+/).filter(Boolean);
    const lines = [];
    let line = '';
    for (const word of words) {
      const candidate = line ? `${line} ${word}` : word;
      if (candidate.length > maxChars && line) {
        lines.push(line);
        line = word;
      } else line = candidate;
    }
    if (line) lines.push(line);
    return lines.slice(0, 2);
  }

  function appendLines(parent, lines, x, middle, lineHeight) {
    const top = middle - (lines.length - 1) * lineHeight / 2;
    lines.forEach((line, index) => {
      const span = svgNode('tspan', {x, y: (top + index * lineHeight).toFixed(1)});
      span.textContent = line.replace(/\/ $/, '/').trim();
      parent.appendChild(span);
    });
  }

  function setHub(select, text) {
    select.hubText.textContent = '';
    appendLines(select.hubText, wrapLabel(text || '—', 13), RADIAL.center, RADIAL.center + 6, 17);
  }

  /* Baut das Tortenmenü neu auf */
  function buildRadial(select) {
    const options = select.options || [];
    const svg = select.svg;
    svg.textContent = '';
    if (!options.length) return;

    /* Der Ring bleibt ein Ring: zu kurze Listen füllen Platzhalter auf */
    const segments = options.slice();
    while (segments.length < MIN_SEGMENTS) segments.push({placeholder: true, label: ''});

    const step = 360 / segments.length;
    segments.forEach((option, index) => {
      const middle = index * step;
      const current = !option.placeholder && option.value === select.current;
      const group = svgNode('g', {
        class: 'wedge' + (current ? ' is-current' : '') + (option.placeholder ? ' is-placeholder' : ''),
        role: 'option',
        'aria-selected': String(current),
        'aria-disabled': String(Boolean(option.placeholder))
      });
      group.appendChild(svgNode('path', {class: 'slice', d: wedgePath(middle - step / 2, middle + step / 2)}));

      const [labelX, labelY] = polar((RADIAL.inner + RADIAL.outer) / 2, middle);
      const label = svgNode('text');
      appendLines(label, option.placeholder ? ['–'] : wrapLabel(option.label, 11), labelX.toFixed(1), labelY + 5, 16);
      group.appendChild(label);
      svg.appendChild(group);
      if (option.placeholder) return;

      group.addEventListener('pointerenter', () => setHub(select, option.label));
      group.addEventListener('pointerleave', () => setHub(select, select.hubDefault));
      group.addEventListener('click', event => {
        event.stopPropagation();
        closeMenus();
        select.onPick(option.value);
      });
    });

    const hub = svgNode('g', {class: 'hub'});
    hub.appendChild(svgNode('circle', {class: 'hub-plate', cx: RADIAL.center, cy: RADIAL.center, r: RADIAL.hub}));
    const caption = svgNode('text', {class: 'hub-caption', x: RADIAL.center, y: RADIAL.center - 26});
    caption.textContent = select.caption;
    hub.appendChild(caption);
    select.hubText = svgNode('text', {class: 'hub-text'});
    hub.appendChild(select.hubText);
    /* Ein Klick auf die Nabe schließt das Menü wieder */
    hub.addEventListener('click', event => {
      event.stopPropagation();
      closeMenus();
    });
    svg.appendChild(hub);
    setHub(select, select.hubDefault);
  }

  /*
   * Lauftext nur, wenn die Beschriftung wirklich nicht in die Pille passt: die
   * Hülle klemmt und schneidet ab, der Text darin wandert.
   */
  function applyTextScroll(text) {
    const box = text.parentElement;
    if (!box) return;
    text.classList.remove('is-scrolling');
    const overflow = text.scrollWidth - box.clientWidth;
    const scrolling = overflow > 1;
    text.classList.toggle('is-scrolling', scrolling);
    if (scrolling) text.style.setProperty('--vp-scroll-shift', `-${overflow}px`);
    else text.style.removeProperty('--vp-scroll-shift');
  }

  function renderMenu(select, options, current, onPick, fallback = '') {
    const selected = options.find(option => option.value === current);
    select.label.textContent = selected ? selected.label : (fallback || '—');
    select.trigger.title = select.label.textContent;
    applyTextScroll(select.label);
    select.root.hidden = options.length === 0;
    select.options = options;
    select.current = current;
    select.onPick = onPick;
    select.hubDefault = select.label.textContent;
    if (!select.menu.hidden) buildRadial(select);
  }

  /* Das Menü liegt mittig auf dem Bogen und skaliert mit ihm */
  function layoutMenu(select) {
    const box = dial.getBoundingClientRect();
    select.menu.style.left = `${box.left + box.width / 2}px`;
    select.menu.style.top = `${box.top + box.height * (CENTER_Y / VIEW_HEIGHT)}px`;
    const size = Math.round(Math.min(box.width, box.height) * 1.02);
    select.svg.setAttribute('width', String(size));
    select.svg.setAttribute('height', String(size));
  }

  /* Der Weichzeichner bekommt die Maße des Dialog-Bodys, sonst die der Card */
  function positionScrim() {
    const host = card.closest('.vp-dialog-body') || card;
    const box = host.getBoundingClientRect();
    scrim.style.top = `${box.top}px`;
    scrim.style.left = `${box.left}px`;
    scrim.style.width = `${box.width}px`;
    scrim.style.height = `${box.height}px`;
  }

  function setMenuOpen(select, open) {
    select.root.classList.toggle('is-open', open);
    select.menu.hidden = !open;
    select.trigger.setAttribute('aria-expanded', String(open));
    if (open) {
      positionScrim();
      buildRadial(select);
      layoutMenu(select);
    }
    scrim.hidden = select.menu.hidden;
  }

  function closeMenus() {
    setMenuOpen(effectSelect, false);
    closePresetPopups();
  }

  effectSelect.trigger.addEventListener('click', event => {
    event.stopPropagation();
    if (!isOn()) return;
    setMenuOpen(effectSelect, effectSelect.menu.hidden);
  });

  document.addEventListener('click', event => {
    if (!event.target.closest('.select, .menu, .preset-popup, .control')) closeMenus();
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !scrim.hidden) closeMenus();
  });

  window.addEventListener('resize', () => {
    if (scrim.hidden) return;
    positionScrim();
    if (!effectSelect.menu.hidden) layoutMenu(effectSelect);
  });

  /* ---- Modusknöpfe und Schnellwerte --------------------------------------- */

  function selectMode(mode) {
    activeMode = mode;
    dragValue = null;
    update();
  }

  function closePresetPopups() {
    for (const [popup, trigger] of [[brightnessPresets, brightnessTrigger], [kelvinPresets, kelvinTrigger]]) {
      popup.classList.remove('visible');
      trigger.closest('.control').classList.remove('popup-open');
    }
  }

  function createPresetButtons(container, mode) {
    for (const percent of PRESETS) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'preset-option';
      button.dataset.value = String(percent);
      button.textContent = `${percent}%`;
      button.addEventListener('click', event => {
        event.stopPropagation();
        selectMode(mode);
        const fraction = percent / 100;
        dragValue = fraction;
        paintDial();
        dragValue = null;
        commit(fraction).catch(() => {});
        closePresetPopups();
      });
      container.appendChild(button);
    }
  }

  function setupLongHold(trigger, container, mode) {
    trigger.addEventListener('pointerdown', event => {
      if (!isOn() || event.button !== 0) return;
      holdTriggered = false;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        holdTriggered = true;
        closeMenus();
        selectMode(mode);
        container.classList.add('visible');
        trigger.closest('.control').classList.add('popup-open');
      }, HOLD_DELAY);
    });
    const cancel = () => {
      clearTimeout(holdTimer);
      holdTimer = null;
    };
    trigger.addEventListener('pointerup', cancel);
    trigger.addEventListener('pointercancel', cancel);
    trigger.addEventListener('pointerleave', cancel);
    trigger.closest('.control').addEventListener('click', event => {
      if (!holdTriggered) return;
      event.preventDefault();
      event.stopPropagation();
      holdTriggered = false;
    });
  }

  for (const button of modeButtons) {
    button.addEventListener('click', () => {
      if (!holdTriggered) selectMode(button.dataset.mode);
    });
  }

  createPresetButtons(brightnessPresets, 'brightness');
  createPresetButtons(kelvinPresets, 'colorTemp');
  setupLongHold(brightnessTrigger, brightnessPresets, 'brightness');
  setupLongHold(kelvinTrigger, kelvinPresets, 'colorTemp');

  powerTrigger.addEventListener('click', () => {
    if (!entityId) return;
    closeMenus();
    vuePanel.callService('light', isOn() ? 'turn_off' : 'turn_on', {}, {entity_id: entityId}).catch(() => {});
  });

  function updatePresetHighlights() {
    const brightness = Math.round(fractionOf('brightness') * 100);
    for (const button of brightnessPresets.children) {
      button.classList.toggle('active', Number(button.dataset.value) === brightness);
    }
    const temperature = Math.round(fractionOf('colorTemp') * 100);
    for (const button of kelvinPresets.children) {
      button.classList.toggle('active', Number(button.dataset.value) === temperature);
    }
  }

  function renderModeButtons(modes) {
    for (const button of modeButtons) {
      const mode = button.dataset.mode;
      const supported = modes.includes(mode);
      button.disabled = !supported;
      button.setAttribute('aria-disabled', String(!supported));
      button.classList.toggle('is-active', supported && mode === activeMode);
      const label = button.querySelector('[data-label]');
      if (label) {
        label.textContent = mode === 'colorTemp' ? 'Kelvin' : vuePanel.t(`translation.modes.${mode}`);
      }
    }
  }

  function renderMetrics() {
    const can = features();
    const on = isOn();
    const brightness = Number(attributes().brightness);
    const kelvin = Number(attributes().color_temp_kelvin);
    brightnessMetric.hidden = !on || !can.brightness || !Number.isFinite(brightness);
    brightnessValue.textContent = `${Math.max(1, Math.round(brightness / 255 * 100))} %`;
    kelvinMetric.hidden = !on || !can.colorTemp || !Number.isFinite(kelvin) || kelvin <= 0;
    kelvinValue.textContent = `${Math.round(kelvin)} K`;
  }

  function renderSelects() {
    const on = isOn();
    powerSelect.classList.toggle('is-on', on);
    powerTrigger.setAttribute('aria-checked', String(on));
    powerLabel.textContent = vuePanel.t(on ? 'translation.states.on' : 'translation.states.off');
    applyTextScroll(powerLabel);

    const list = (attributes().effect_list || []).map(String);
    renderMenu(
      effectSelect,
      list.map(effect => ({value: effect, label: effect})),
      String(attributes().effect || ''),
      effect => vuePanel.callService('light', 'turn_on', {effect}, {entity_id: entityId}).catch(() => {}),
      vuePanel.t('translation.effects.none')
    );
    selects.classList.toggle('is-single', effectSelect.root.hidden);
  }

  async function update() {
    const unavailable = Boolean(entity) && ['unavailable', 'unknown'].includes(entity.state);

    if (!entityId || !entity) {
      hint.hidden = false;
      hint.textContent = vuePanel.t(entityId ? 'translation.entityNotFound' : 'translation.noEntity');
      dial.hidden = true;
      controls.hidden = true;
      closeMenus();
      dialMode = '';
      return;
    }

    dial.hidden = false;
    const modes = availableModes();
    if (!modes.includes(activeMode)) activeMode = modes[0] || '';
    dialMode = modes.length ? activeMode : '';
    controls.hidden = modes.length === 0;
    hint.hidden = modes.length > 0;
    if (!modes.length) hint.textContent = vuePanel.t('translation.switchOnly');

    warningIcon.hidden = !unavailable;
    /* Die Glühbirne zeigt auf einen Blick, ob das Licht an oder aus ist */
    stateIcon.src = isOn() ? bulbOnIcon : bulbOffIcon;
    stateIcon.alt = vuePanel.t(isOn() ? 'translation.states.on' : 'translation.states.off');
    stateIcon.title = stateIcon.alt;
    const effect = String(attributes().effect || '');
    effectIcon.hidden = !isOn() || !effect || effect.toLowerCase() === 'none';

    renderModeButtons(modes);
    renderMetrics();
    renderSelects();
    updatePresetHighlights();
    if (!isOn()) closeMenus();
    paintDial();
  }

  async function render(next) {
    entity = next;
    if (!dragging) dragValue = null;
    await update();
  }

  const [brightnessIconSrc, kelvinIconSrc, warningIconSrc, effectIconSrc, caretIconSrc, bulbOnIcon, bulbOffIcon] =
    await Promise.all([
      iconSource('mdi:brightness-6', '#e0a03c'),
      iconSource('mdi:thermometer', '#76a9d6'),
      iconSource('mdi:alert', '#ff9800'),
      iconSource('mdi:auto-fix', '#0f7ec4'),
      iconSource('mdi:chevron-down', '#666666'),
      iconSource('mdi:lightbulb-on', '#e0a03c'),
      iconSource('mdi:lightbulb-off-outline', 'rgba(0, 0, 0, 0.32)')
    ]);
  document.getElementById('brightness-icon').src = brightnessIconSrc;
  document.getElementById('kelvin-icon').src = kelvinIconSrc;
  warningIcon.src = warningIconSrc;
  warningIcon.title = vuePanel.t('translation.unavailable');
  effectIcon.src = effectIconSrc;
  effectSelect.caret.src = caretIconSrc;
  await Promise.all(modeIcons.map(async image => {
    image.src = await iconSource(image.dataset.icon, '#666666');
  }));

  /* Nach dem ersten Layout des Dialogs neu zeichnen */
  setTimeout(() => { if (!dial.hidden) paintDial(); }, 0);

  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);
</script>
