<script data-vue-panel-javascript>
  const config = vuePanel.config;
  /* Popups reichen die Werte der auslösenden Card durch */
  const entityId = String(config.entity || vuePanel.context.entity || '');

  const card = document.getElementById('card');
  const dial = document.getElementById('dial');
  const arc = document.getElementById('arc');
  const handle = document.getElementById('handle');
  const readout = document.getElementById('readout');
  const caption = document.getElementById('caption');
  const toggle = document.getElementById('toggle');
  const powerIcon = document.getElementById('power-icon');
  const modesBox = document.getElementById('modes');
  const effectPanel = document.getElementById('effect-panel');
  const effectList = document.getElementById('effect-list');
  const saturationPanel = document.getElementById('saturation-panel');
  const saturation = document.getElementById('saturation');
  const title = document.getElementById('title');
  const hint = document.getElementById('hint');

  const CIRCUMFERENCE = 2 * Math.PI * 86;
  const RADIUS_RATIO = 86 / 200;

  /*
   * Home Assistant meldet die Fähigkeiten eines Lichts über
   * supported_color_modes. Nur die tatsächlich unterstützten Regler
   * erscheinen: "onoff" kann gar nichts, "brightness" nur dimmen,
   * "color_temp" die Farbtemperatur und hs/xy/rgb/rgbw/rgbww echte Farben.
   */
  const COLOR_MODES = ['hs', 'xy', 'rgb', 'rgbw', 'rgbww'];
  const DIMMABLE_MODES = ['brightness', 'color_temp', 'white'].concat(COLOR_MODES);

  const MODE_ICONS = {
    brightness: 'mdi:brightness-6',
    colorTemp: 'mdi:thermometer',
    color: 'mdi:palette',
    effects: 'mdi:auto-fix'
  };

  let entity = null;
  let activeMode = '';
  /* Der Ring regelt immer etwas Stufenloses — im Effekt-Modus die Helligkeit */
  let dialMode = '';
  /* Während des Ziehens gewinnt der lokale Wert gegen Zustands-Updates */
  let dragValue = null;
  let dragging = false;
  let commitTimer = null;

  function attributes() {
    return (entity && entity.attributes) || {};
  }

  function features() {
    const raw = attributes().supported_color_modes;
    const modes = Array.isArray(raw) ? raw.map(String) : [];
    const list = attributes().effect_list;
    return {
      /* Ältere Integrationen melden keine Modi, liefern aber Werte */
      brightness: modes.some(mode => DIMMABLE_MODES.includes(mode))
        || (!modes.length && Number.isFinite(Number(attributes().brightness))),
      colorTemp: modes.includes('color_temp')
        || (!modes.length && Number.isFinite(Number(attributes().color_temp_kelvin))),
      color: modes.some(mode => COLOR_MODES.includes(mode))
        || (!modes.length && Array.isArray(attributes().hs_color)),
      effects: Array.isArray(list) && list.length > 0
    };
  }

  function availableModes() {
    const can = features();
    return ['brightness', 'colorTemp', 'color', 'effects'].filter(mode => can[mode]);
  }

  function kelvinRange() {
    return {
      min: Math.round(Number(attributes().min_color_temp_kelvin) || 2000),
      max: Math.round(Number(attributes().max_color_temp_kelvin) || 6500)
    };
  }

  function hueCss(value, light) {
    return 'hsl(' + Math.round(value) + ' 100% ' + (light || 50) + '%)';
  }

  /* Aktueller Wert des aktiven Reglers als Anteil 0..1 */
  function fractionOf(mode) {
    if (dragValue !== null && mode === dialMode) return dragValue;
    if (mode === 'brightness') {
      const level = Number(attributes().brightness);
      return Number.isFinite(level) ? Math.min(1, Math.max(0, level / 255)) : 0;
    }
    if (mode === 'colorTemp') {
      const range = kelvinRange();
      const kelvin = Number(attributes().color_temp_kelvin);
      if (!Number.isFinite(kelvin) || range.max <= range.min) return 0.5;
      return Math.min(1, Math.max(0, (kelvin - range.min) / (range.max - range.min)));
    }
    if (mode === 'color') {
      const hs = attributes().hs_color;
      return Array.isArray(hs) ? (Number(hs[0]) || 0) / 360 : 0;
    }
    return 0;
  }

  function readoutFor(mode, fraction) {
    if (!entity || entity.state !== 'on') return vuePanel.t('translation.states.off');
    if (mode === 'brightness') return Math.max(1, Math.round(fraction * 100)) + ' %';
    if (mode === 'colorTemp') {
      const range = kelvinRange();
      return Math.round(range.min + fraction * (range.max - range.min)) + ' K';
    }
    if (mode === 'color') return Math.round(fraction * 360) + '°';
    return vuePanel.t('translation.states.on');
  }

  /* Leerer Wert heißt: das Theme färbt neutral (ausgeschaltetes Licht) */
  function accentFor(mode, fraction) {
    if (!entity || entity.state !== 'on') return '';
    if (mode === 'color') return hueCss(fraction * 360, 55);
    const rgb = attributes().rgb_color;
    if (Array.isArray(rgb) && rgb.length >= 3) {
      return 'rgb(' + Math.round(rgb[0]) + ' ' + Math.round(rgb[1]) + ' ' + Math.round(rgb[2]) + ')';
    }
    return '#f6d36b';
  }

  /* Icons müssen zum Theme passen, sonst verschwinden sie auf Weiß */
  function themeColor(name, fallback) {
    const styles = getComputedStyle(card);
    const value = String(styles.getPropertyValue(name) || '').trim();
    return value || String(styles.color || '').trim() || fallback;
  }

  function paintDial() {
    const fraction = fractionOf(dialMode);
    const isOn = Boolean(entity) && entity.state === 'on';
    const shown = isOn ? fraction : 0;

    arc.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - shown));
    arc.style.stroke = dialMode === 'colorTemp'
      ? 'url(#ld-temp)'
      : dialMode === 'color' ? 'url(#ld-hue)' : 'var(--ld-accent)';

    const angle = shown * 2 * Math.PI - Math.PI / 2;
    const radius = dial.clientWidth * RADIUS_RATIO;
    handle.style.setProperty('--ld-handle-x', (Math.cos(angle) * radius).toFixed(1) + 'px');
    handle.style.setProperty('--ld-handle-y', (Math.sin(angle) * radius).toFixed(1) + 'px');

    readout.textContent = readoutFor(dialMode, fraction);
    caption.textContent = dialMode ? vuePanel.t('translation.modes.' + dialMode) : '';
    const accent = accentFor(dialMode, fraction);
    if (accent) card.style.setProperty('--ld-accent', accent);
    else card.style.removeProperty('--ld-accent');
  }

  function renderModes(modes) {
    if (modesBox.dataset.modes === modes.join('|') + ':' + activeMode) return;
    modesBox.dataset.modes = modes.join('|') + ':' + activeMode;
    modesBox.textContent = '';
    for (const mode of modes) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'ld__mode' + (mode === activeMode ? ' is-active' : '');
      const circle = document.createElement('span');
      circle.className = 'ld__mode-icon';
      const image = document.createElement('img');
      image.alt = '';
      circle.appendChild(image);
      const label = document.createElement('span');
      label.className = 'ld__mode-label';
      label.textContent = vuePanel.t('translation.modes.' + mode);
      button.append(circle, label);
      button.addEventListener('click', () => selectMode(mode));
      modesBox.appendChild(button);
      const tone = mode === activeMode
        ? themeColor('--text-primary', '#111111')
        : themeColor('--text-secondary', '#888888');
      vuePanel.getIcon(MODE_ICONS[mode], {size: 72, color: tone})
        .then(source => { image.src = source; })
        .catch(() => {});
    }
  }

  function renderEffects() {
    const list = (attributes().effect_list || []).map(String);
    const active = String(attributes().effect || '');
    if (effectList.dataset.list !== list.join('|')) {
      effectList.dataset.list = list.join('|');
      effectList.textContent = '';
      for (const item of list) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'ld__effect';
        button.dataset.effect = item;
        button.textContent = item;
        button.addEventListener('click', () => {
          if (!entityId) return;
          vuePanel.callService('light', 'turn_on', {effect: item}, {entity_id: entityId});
        });
        effectList.appendChild(button);
      }
    }
    for (const button of effectList.children) {
      button.classList.toggle('is-active', button.dataset.effect === active);
    }
  }

  function selectMode(mode) {
    activeMode = mode;
    dragValue = null;
    update();
  }

  /* Zeigerposition auf dem Ring in einen Anteil 0..1 umrechnen */
  function fractionFromPointer(event) {
    const box = dial.getBoundingClientRect();
    const dx = event.clientX - (box.left + box.width / 2);
    const dy = event.clientY - (box.top + box.height / 2);
    const degrees = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
    return degrees / 360;
  }

  async function commit(fraction) {
    if (!entityId) return;
    if (dialMode === 'brightness') {
      await vuePanel.callService(
        'light', 'turn_on', {brightness_pct: Math.max(1, Math.round(fraction * 100))}, {entity_id: entityId}
      );
      return;
    }
    if (dialMode === 'colorTemp') {
      const range = kelvinRange();
      await vuePanel.callService(
        'light', 'turn_on',
        {color_temp_kelvin: Math.round(range.min + fraction * (range.max - range.min))},
        {entity_id: entityId}
      );
      return;
    }
    if (dialMode === 'color') {
      const hs = attributes().hs_color;
      const level = Number(saturation.value);
      const value = Number.isFinite(level) ? level : (Array.isArray(hs) ? Number(hs[1]) || 100 : 100);
      await vuePanel.callService(
        'light', 'turn_on', {hs_color: [Math.round(fraction * 360), value]}, {entity_id: entityId}
      );
    }
  }

  dial.addEventListener('pointerdown', event => {
    if (!entity || entity.state !== 'on' || !dialMode) return;
    dragging = true;
    card.classList.add('is-dragging');
    dial.setPointerCapture(event.pointerId);
    dragValue = fractionFromPointer(event);
    paintDial();
  });

  dial.addEventListener('pointermove', event => {
    if (!dragging) return;
    dragValue = fractionFromPointer(event);
    paintDial();
    /* Live nachziehen, aber die Verbindung nicht mit Aufrufen fluten */
    if (commitTimer === null) {
      commitTimer = setTimeout(() => {
        commitTimer = null;
        if (dragValue !== null) commit(dragValue).catch(() => {});
      }, 180);
    }
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('is-dragging');
    const value = dragValue;
    dragValue = null;
    if (value !== null) commit(value).catch(() => {});
  }

  dial.addEventListener('pointerup', endDrag);
  dial.addEventListener('pointercancel', endDrag);

  saturation.addEventListener('input', () => {
    saturation.dataset.dragging = 'true';
  });
  saturation.addEventListener('change', () => {
    saturation.dataset.dragging = '';
    if (!entityId) return;
    const hs = attributes().hs_color;
    const hue = Array.isArray(hs) ? Number(hs[0]) || 0 : Math.round(fractionOf('color') * 360);
    vuePanel.callService(
      'light', 'turn_on', {hs_color: [hue, Number(saturation.value)]}, {entity_id: entityId}
    );
  });

  toggle.addEventListener('click', () => {
    if (!entityId) return;
    vuePanel.callService('homeassistant', 'toggle', {}, {entity_id: entityId});
  });

  async function update() {
    const isOn = Boolean(entity) && entity.state === 'on';
    card.classList.toggle('is-on', isOn);
    toggle.setAttribute('aria-checked', isOn ? 'true' : 'false');
    /* Der Dialogkopf zeigt den Namen bereits — nur ein eigener Titel erscheint */
    const ownTitle = String(config.name || '');
    title.textContent = ownTitle;
    title.hidden = !ownTitle;

    if (!entityId || !entity) {
      hint.hidden = false;
      hint.textContent = vuePanel.t(entityId ? 'translation.entityNotFound' : 'translation.noEntity');
      dial.hidden = true;
      modesBox.hidden = true;
      dialMode = '';
      effectPanel.hidden = true;
      saturationPanel.hidden = true;
      return;
    }

    const modes = availableModes();
    if (!modes.includes(activeMode)) activeMode = modes[0] || '';
    renderModes(modes);

    /* Ein reines Schaltlicht bekommt statt leerer Regler einen Hinweis */
    hint.hidden = modes.length > 0;
    if (!hint.hidden) hint.textContent = vuePanel.t('translation.switchOnly');
    modesBox.hidden = modes.length < 2;

    /*
     * Der Ring bleibt sichtbar — samt Schalter und Anzeige. In der
     * Effekt-Auswahl regelt er weiter die Helligkeit, die Liste kommt darunter.
     */
    dialMode = activeMode === 'effects'
      ? (modes.includes('brightness') ? 'brightness' : '')
      : activeMode;
    dial.hidden = false;
    const showEffects = activeMode === 'effects';
    effectPanel.hidden = !showEffects;
    if (showEffects) renderEffects();

    saturationPanel.hidden = !(isOn && activeMode === 'color');
    if (!saturationPanel.hidden && saturation.dataset.dragging !== 'true') {
      const hs = attributes().hs_color;
      const value = Array.isArray(hs) ? Math.round(Number(hs[1]) || 0) : 100;
      saturation.value = String(value);
    }
    saturation.style.setProperty('--ld-hue-color', hueCss(fractionOf('color') * 360));

    paintDial();

    powerIcon.src = await vuePanel.getIcon('mdi:power', {size: 48, color: '#1f1f1f'});
  }

  async function render(next) {
    entity = next;
    await update();
  }

  window.addEventListener('resize', () => { if (!dial.hidden) paintDial(); });
  /* Der Dialog wird animiert eingeblendet — danach stimmt erst die Ringgröße */
  setTimeout(() => { if (!dial.hidden) paintDial(); }, 0);

  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);
</script>
