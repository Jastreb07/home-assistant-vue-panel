<script data-vue-panel-javascript>
  const config = vuePanel.config;
  const entityId = String(config.entity || '');
  const card = document.getElementById('card');
  const icon = document.getElementById('icon');
  const name = document.getElementById('name');
  const state = document.getElementById('state');

  async function render(entity) {
    const isOn = entity?.state === 'on';
    const brightness = Number(entity?.attributes?.brightness);
    card.classList.toggle('active', isOn);
    name.textContent = String(config.name || entity?.attributes?.friendly_name || entityId || vuePanel.t('translation.defaultName'));
    state.textContent = !entityId ? vuePanel.t('translation.noEntity') : !entity ? vuePanel.t('translation.entityNotFound') :
      `${isOn ? vuePanel.t('translation.states.on') : vuePanel.t('translation.states.off')}${isOn && config.showBrightness !== false && Number.isFinite(brightness) ? ` · ${Math.round(brightness / 255 * 100)} %` : ''}`;
    icon.src = await vuePanel.getIcon(String(config.icon || (isOn ? 'mdi:lightbulb' : 'mdi:lightbulb-outline')), {
      size: 72,
      color: isOn ? '#111111' : '#737373'
    });
  }

  card.addEventListener('click', async () => {
    if (!entityId) return;
    const entity = await vuePanel.getEntity(entityId);
    await vuePanel.callService('light', entity?.state === 'on' ? 'turn_off' : 'turn_on', {}, {entity_id: entityId});
  });

  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);
</script>
