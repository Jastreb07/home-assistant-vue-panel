<script data-vue-panel-javascript>
  const config = vuePanel.config;
  /* Lauftext nur, wenn der Text wirklich nicht in die Card passt */
  function applyTextScroll(element, settings) {
    if (!element) return;
    const overflow = element.scrollWidth - element.clientWidth;
    const scrolling = (settings || config).textScroll !== false && overflow > 1;
    element.classList.toggle('is-scrolling', scrolling);
    if (scrolling) element.style.setProperty('--vp-scroll-shift', `-${overflow}px`);
    else element.style.removeProperty('--vp-scroll-shift');
  }

  /* Status und optionales Attribut gemäß den Card-Einstellungen */
  function stateLine(entity, text, settings) {
    const values = settings || config;
    const parts = [];
    if (values.showState !== false) parts.push(text);
    if (values.showAttribute === true) {
      const attribute = String(values.attribute || '');
      const value = attribute ? entity?.attributes?.[attribute] : undefined;
      if (value !== undefined && value !== null && value !== '') parts.push(String(value));
    }
    return parts.filter(Boolean).join(' · ');
  }

  /* Ein einfacher Umschalter für jede Domain */
  async function toggleEntity(id) {
    if (!id) return;
    await vuePanel.callService('homeassistant', 'toggle', {}, {entity_id: id});
  }

  /*
   * Tipp-Aktionen: Tippen, Doppeltippen und Halten. "default" behält die
   * eingebaute Aktion der Card und öffnet beim Halten ohne eigene Aktion die
   * automatische Detailansicht; "more-info" öffnet die Detailansicht (Ziel ist
   * optional eine bestimmte Dialog-Card), "ha-more-info" das native
   * Home-Assistant-Popup und "popup" ein eigenes Vue-Panel-Popup. "assist"
   * braucht einen Home-Assistant-Dialog, den das Panel nicht öffnen kann.
   */
  function bindGestures(element, settings, handlers) {
    /* Das Panel speichert je Geste eine Aktion samt Ziel */
    const slotOf = gesture => (settings.actions || {})[gesture] || {};
    const actionOf = gesture => String(slotOf(gesture).action || 'default');

    const run = async gesture => {
      const action = actionOf(gesture);
      const target = String(slotOf(gesture).target || '');

      if (action === 'none' || action === 'assist') return;
      if (action === 'more-info') {
        return vuePanel.showDetail(target ? {card: target, entity: handlers.entityId} : {entity: handlers.entityId});
      }
      if (action === 'ha-more-info') {
        return handlers.entityId ? vuePanel.showNativeDetail(handlers.entityId) : undefined;
      }
      if (action === 'popup') return target ? vuePanel.openPopup(target) : undefined;
      if (action === 'default') {
        const handled = handlers.default ? handlers.default(gesture) : undefined;
        if (handled !== undefined) return handled;
        /* Ohne eigene Card-Aktion öffnet Halten die automatische Detailansicht */
        if (gesture === 'hold' && handlers.entityId) return vuePanel.showDetail({entity: handlers.entityId});
        return undefined;
      }
      if (action === 'toggle') return handlers.toggle ? handlers.toggle() : undefined;
      if (action === 'navigate') return target ? vuePanel.navigate(target) : undefined;
      if (action === 'url') {
        if (target) window.open(target, '_blank', 'noopener');
        return;
      }
      if (action === 'perform-action') {
        const [domain, service] = target.split('.');
        if (!domain || !service) return;
        await vuePanel.callService(domain, service, {}, handlers.entityId ? {entity_id: handlers.entityId} : {});
      }
    };

    const ignored = event => Boolean(handlers.ignore) && Boolean(event.target.closest(handlers.ignore));
    /* While the brightness slider is being dragged no gesture may fire */
    const suppressed = () => Boolean(handlers.suppress) && handlers.suppress();
    let holdTimer = null;
    let held = false;
    let taps = 0;

    element.addEventListener('pointerdown', event => {
      if (ignored(event)) return;
      held = false;
      holdTimer = setTimeout(() => {
        holdTimer = null;
        if (suppressed()) return;
        held = true;
        run('hold');
      }, 500);
    });

    for (const name of ['pointerup', 'pointercancel', 'pointerleave']) {
      element.addEventListener(name, () => {
        if (holdTimer) clearTimeout(holdTimer);
        holdTimer = null;
      });
    }

    element.addEventListener('click', event => {
      if (ignored(event) || suppressed()) return;
      if (held) {
        held = false;
        return;
      }
      const doubled = actionOf('double_tap');
      /* Ohne Doppeltipp-Aktion reagiert der einfache Tipp sofort */
      if (doubled === 'default' || doubled === 'none') {
        run('tap');
        return;
      }
      taps += 1;
      if (taps > 1) return;
      setTimeout(() => {
        const wasDoubled = taps > 1;
        taps = 0;
        run(wasDoubled ? 'double_tap' : 'tap');
      }, 250);
    });
  }

  const entityId = String(config.entity || '');
  const card = document.getElementById('card');
  const icon = document.getElementById('icon');
  const name = document.getElementById('name');
  const state = document.getElementById('state');
  const fill = document.getElementById('fill');
  const ring = document.getElementById('ring');
  const ringValue = document.getElementById('ring-value');
  const ringLabel = document.getElementById('ring-label');

  const RING_LENGTH = 2 * Math.PI * 16;
  ringValue.style.strokeDasharray = String(RING_LENGTH);

  const sliderEnabled = config.brightnessSlider === true;
  /* Percentage shown while dragging — the entity update lags behind the drag */
  let dragPercent = null;
  let lastEntity = null;
  /* Set when a custom/light background decides the text (and icon) colour */
  let activeTextColor = null;

  function brightnessPercent(entity) {
    const brightness = Number(entity?.attributes?.brightness);
    return Number.isFinite(brightness) ? Math.round(brightness / 255 * 100) : 0;
  }

  /*
   * Background while the light is on: the card's own default (CSS class),
   * a colour picked in the settings, or the light's current colour taken
   * from the entity. The text colour follows the background's brightness so
   * the label stays readable on both dark and light colours.
   */
  function lightColor(entity) {
    const attributes = entity?.attributes || {};
    const rgb = attributes.rgb_color;
    if (Array.isArray(rgb) && rgb.length >= 3) {
      return {r: Number(rgb[0]) || 0, g: Number(rgb[1]) || 0, b: Number(rgb[2]) || 0};
    }
    /* Colour temperature lights report no RGB — approximate it from kelvin */
    const kelvin = Number(attributes.color_temp_kelvin);
    if (Number.isFinite(kelvin) && kelvin > 0) return kelvinToRgb(kelvin);
    return null;
  }

  function kelvinToRgb(kelvin) {
    const temp = Math.min(40000, Math.max(1000, kelvin)) / 100;
    const clamp = value => Math.min(255, Math.max(0, Math.round(value)));
    const red = temp <= 66 ? 255 : 329.698727446 * Math.pow(temp - 60, -0.1332047592);
    const green = temp <= 66
      ? 99.4708025861 * Math.log(temp) - 161.1195681661
      : 288.1221695283 * Math.pow(temp - 60, -0.0755148492);
    const blue = temp >= 66
      ? 255
      : temp <= 19 ? 0 : 138.5177312231 * Math.log(temp - 10) - 305.0447927307;
    return {r: clamp(red), g: clamp(green), b: clamp(blue)};
  }

  /* Perceived brightness (ITU-R BT.601) decides black or white text */
  function readableText(rgb) {
    return (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000 > 150 ? '#111111' : '#ffffff';
  }

  function applyActiveBackground(entity, isOn) {
    const mode = String(config.activeBackground || 'default');
    card.style.removeProperty('background');
    card.style.removeProperty('color');
    activeTextColor = null;
    if (!isOn || mode === 'default') return;

    if (mode === 'custom') {
      const color = String(config.activeColor || '').trim();
      if (!color) return;
      card.style.setProperty('background', color, 'important');
      /* Only hex colours can be measured here — others keep the CSS default */
      const parsed = /^#([0-9a-f]{6}|[0-9a-f]{8})$/i.test(color)
        ? {
          r: parseInt(color.slice(1, 3), 16),
          g: parseInt(color.slice(3, 5), 16),
          b: parseInt(color.slice(5, 7), 16)
        }
        : null;
      if (parsed) {
        activeTextColor = readableText(parsed);
        card.style.setProperty('color', activeTextColor, 'important');
      }
      return;
    }

    if (mode === 'light') {
      const rgb = lightColor(entity);
      if (!rgb) return;
      card.style.setProperty('background', `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`, 'important');
      activeTextColor = readableText(rgb);
      card.style.setProperty('color', activeTextColor, 'important');
    }
  }

  /* Ring and slider fill both follow the drag immediately, then the entity */
  function paintLevel(entity) {
    const isOn = entity?.state === 'on';
    const percent = dragPercent !== null ? dragPercent : brightnessPercent(entity);
    const hasLevel = dragPercent !== null || (isOn && percent > 0);
    const showRing = config.showBrightnessRing === true && hasLevel;
    ring.hidden = !showRing;
    if (showRing) {
      ringValue.style.strokeDashoffset = String(RING_LENGTH * (1 - Math.min(100, percent) / 100));
      ringLabel.textContent = `${percent} %`;
    }
    fill.style.height = sliderEnabled && hasLevel ? `${Math.min(100, percent)}%` : '0';
  }

  async function render(entity) {
    lastEntity = entity;
    const isOn = entity?.state === 'on';
    const brightness = Number(entity?.attributes?.brightness);
    card.classList.toggle('active', isOn);
    applyActiveBackground(entity, isOn);
    paintLevel(entity);
    name.textContent = String(config.name || entity?.attributes?.friendly_name || entityId || vuePanel.t('translation.defaultName'));
    name.hidden = config.showName === false;
    icon.parentElement.hidden = config.showIcon === false;
    const text = !entityId ? vuePanel.t('translation.noEntity') : !entity ? vuePanel.t('translation.entityNotFound') :
      `${isOn ? vuePanel.t('translation.states.on') : vuePanel.t('translation.states.off')}${isOn && config.showBrightness !== false && Number.isFinite(brightness) ? ` · ${Math.round(brightness / 255 * 100)} %` : ''}`;
    state.textContent = entityId && entity ? stateLine(entity, text) : text;
    state.hidden = !state.textContent;
    applyTextScroll(name);
    applyTextScroll(state);
    icon.src = await vuePanel.getIcon(String(config.icon || (isOn ? 'mdi:lightbulb' : 'mdi:lightbulb-outline')), {
      size: 72,
      color: isOn ? (activeTextColor || '#111111') : '#737373'
    });
  }

  /*
   * Vertical brightness slider: dragging up/down over the card sets the
   * brightness directly. A drag only starts after a few pixels of movement so
   * a plain tap still toggles the light; while dragging every gesture is
   * suppressed. Service calls are throttled — the drag itself stays smooth
   * because ring and fill are painted from the local drag value.
   */
  let dragging = false;
  let dragPointerId = null;
  let dragStartY = 0;
  let dragStartPercent = 0;
  let commitTimer = null;
  /* Blocks the click that follows the drag's pointerup */
  let suppressUntil = 0;

  function percentFromDrag(event) {
    const height = card.clientHeight || 1;
    /* Dragging up brightens: the full card height covers the whole range */
    const delta = (dragStartY - event.clientY) / height * 100;
    return Math.max(1, Math.min(100, Math.round(dragStartPercent + delta)));
  }

  async function commitBrightness(percent) {
    if (!entityId) return;
    await vuePanel.callService('light', 'turn_on', {brightness_pct: percent}, {entity_id: entityId});
  }

  function queueCommit() {
    if (commitTimer !== null || dragPercent === null) return;
    commitTimer = setTimeout(() => {
      commitTimer = null;
      if (dragPercent !== null) commitBrightness(dragPercent).catch(() => {});
    }, 180);
  }

  if (sliderEnabled) {
    card.addEventListener('pointerdown', event => {
      if (!entityId || event.button !== 0) return;
      dragPointerId = event.pointerId;
      dragStartY = event.clientY;
      dragStartPercent = brightnessPercent(lastEntity) || (lastEntity?.state === 'on' ? 100 : 0);
    });

    card.addEventListener('pointermove', event => {
      if (dragPointerId !== event.pointerId) return;
      if (!dragging) {
        if (Math.abs(event.clientY - dragStartY) < 6) return;
        dragging = true;
        card.classList.add('is-sliding');
        card.setPointerCapture(event.pointerId);
      }
      dragPercent = percentFromDrag(event);
      paintLevel(lastEntity);
      queueCommit();
    });

    for (const eventName of ['pointerup', 'pointercancel']) {
      card.addEventListener(eventName, event => {
        if (dragPointerId !== event.pointerId) return;
        dragPointerId = null;
        if (!dragging) return;
        dragging = false;
        card.classList.remove('is-sliding');
        suppressUntil = Date.now() + 350;
        if (commitTimer !== null) {
          clearTimeout(commitTimer);
          commitTimer = null;
        }
        const percent = dragPercent;
        /* The entity update repaints from the real value and clears the drag */
        if (percent !== null) commitBrightness(percent).catch(() => {}).finally(() => {
          dragPercent = null;
          paintLevel(lastEntity);
        });
      });
    }
  }

  bindGestures(card, config, {
    entityId,
    toggle: () => toggleEntity(entityId),
    suppress: () => dragging || Date.now() < suppressUntil,
    default: gesture => (gesture === 'tap' ? toggleEntity(entityId) : undefined)
  });

  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);
</script>
