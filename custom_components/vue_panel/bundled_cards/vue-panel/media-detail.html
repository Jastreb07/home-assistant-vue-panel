<script data-vue-panel-javascript>
  const config = vuePanel.config;
  const entityId = String(config.entity || vuePanel.context.entity || '');
  const card = document.getElementById('card');
  const dialogBody = card.closest('.vp-dialog-body');
  const detailBody = card.closest('.detail-body');
  const runtime = card.closest('.card-runtime');
  if (dialogBody) dialogBody.style.padding = '0';
  if (detailBody) detailBody.style.padding = '0';
  if (runtime) runtime.style.maxWidth = 'none';
  const player = document.getElementById('player');
  const empty = document.getElementById('empty');
  const emptyText = document.getElementById('empty-text');
  const hero = document.getElementById('hero');
  const artwork = document.getElementById('artwork');
  const state = document.getElementById('state');
  const title = document.getElementById('title');
  const artist = document.getElementById('artist');
  const appBadge = document.getElementById('app-badge');
  const power = document.getElementById('power');
  const previous = document.getElementById('previous');
  const stop = document.getElementById('stop');
  const play = document.getElementById('play');
  const next = document.getElementById('next');
  const timelineWrap = document.getElementById('timeline-wrap');
  const timeline = document.getElementById('timeline');
  const positionLabel = document.getElementById('position');
  const durationLabel = document.getElementById('duration');
  const volumeWrap = document.getElementById('volume-wrap');
  const volume = document.getElementById('volume');
  const volumeValue = document.getElementById('volume-value');
  const mute = document.getElementById('mute');
  const sourceWrap = document.getElementById('source-wrap');
  const source = document.getElementById('source');

  const FEATURE = {
    pause: 1,
    seek: 2,
    volumeSet: 4,
    volumeMute: 8,
    previous: 16,
    next: 32,
    turnOn: 128,
    turnOff: 256,
    selectSource: 2048,
    stop: 4096,
    play: 16384
  };

  let currentEntity = null;
  let seeking = false;
  let volumeChanging = false;
  let iconVersion = 0;

  const supports = (entity, feature) =>
    (Number(entity?.attributes?.supported_features || 0) & feature) !== 0;

  function formatTime(value) {
    const seconds = Math.max(0, Math.round(Number(value) || 0));
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor(seconds % 3600 / 60);
    const remainder = String(seconds % 60).padStart(2, '0');
    return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${remainder}` : `${minutes}:${remainder}`;
  }

  function currentPosition(entity) {
    const base = Number(entity?.attributes?.media_position);
    if (!Number.isFinite(base)) return 0;
    if (entity.state !== 'playing') return base;
    const updated = Date.parse(String(entity.attributes?.media_position_updated_at || ''));
    return Number.isFinite(updated) ? base + Math.max(0, (Date.now() - updated) / 1000) : base;
  }

  function renderTimeline() {
    if (!currentEntity || seeking) return;
    const total = Number(currentEntity.attributes?.media_duration);
    const visible = Number.isFinite(total) && total > 0;
    timelineWrap.hidden = !visible;
    if (!visible) return;
    const position = Math.min(total, currentPosition(currentEntity));
    timeline.max = String(Math.round(total));
    timeline.value = String(Math.round(position));
    timeline.disabled = !supports(currentEntity, FEATURE.seek);
    positionLabel.textContent = formatTime(position);
    durationLabel.textContent = formatTime(total);
  }

  function artworkUrl(entity) {
    const picture = entity?.attributes?.entity_picture_local || entity?.attributes?.entity_picture;
    if (!picture) return '';
    try {
      return new URL(String(picture), window.location.origin).href;
    } catch {
      return '';
    }
  }

  async function setIcon(id, name, size, color) {
    document.getElementById(id).src = await vuePanel.getIcon(name, {size, color});
  }

  async function renderIcons(entity) {
    const version = ++iconVersion;
    const playing = entity?.state === 'playing';
    const muted = entity?.attributes?.is_volume_muted === true;
    const foreground = getComputedStyle(card).color;
    const icons = [
      setIcon('power-icon', 'mdi:power', 48, '#ffffff'),
      setIcon('previous-icon', 'mdi:skip-previous', 48, foreground),
      setIcon('stop-icon', 'mdi:stop', 48, foreground),
      setIcon('play-icon', playing ? 'mdi:pause' : 'mdi:play', 56, '#ffffff'),
      setIcon('next-icon', 'mdi:skip-next', 48, foreground),
      setIcon('volume-icon', muted ? 'mdi:volume-off' : 'mdi:volume-high', 48, foreground),
      setIcon('source-icon', 'mdi:video-input-component', 36, foreground)
    ];
    await Promise.all(icons);
    if (version !== iconVersion) return;
    play.setAttribute('aria-label', vuePanel.t(playing ? 'translation.pause' : 'translation.play'));
    power.setAttribute('aria-label', vuePanel.t('translation.power'));
    previous.setAttribute('aria-label', vuePanel.t('translation.previous'));
    next.setAttribute('aria-label', vuePanel.t('translation.next'));
    stop.setAttribute('aria-label', vuePanel.t('translation.stop'));
    mute.setAttribute('aria-label', vuePanel.t(muted ? 'translation.unmute' : 'translation.mute'));
  }

  function renderSource(entity) {
    const sources = Array.isArray(entity?.attributes?.source_list)
      ? entity.attributes.source_list.map(String)
      : [];
    sourceWrap.hidden = !supports(entity, FEATURE.selectSource) || sources.length === 0;
    if (sourceWrap.hidden) return;
    const selected = String(entity.attributes?.source || '');
    source.replaceChildren(...sources.map(value => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      option.selected = value === selected;
      return option;
    }));
  }

  async function render(entity) {
    currentEntity = entity;
    if (!entityId || !entity) {
      player.hidden = true;
      empty.hidden = false;
      emptyText.textContent = entityId
        ? vuePanel.t('translation.entityNotFound')
        : vuePanel.t('translation.noEntity');
      await setIcon('empty-icon', 'mdi:multimedia', 96, getComputedStyle(card).color);
      return;
    }

    empty.hidden = true;
    player.hidden = false;
    const attributes = entity.attributes || {};
    const picture = artworkUrl(entity);
    artwork.style.backgroundImage = picture ? `url(${JSON.stringify(picture)})` : '';
    hero.classList.toggle('has-artwork', Boolean(picture));

    const stateKey = `translation.states.${entity.state}`;
    state.textContent = vuePanel.t(stateKey) === stateKey ? entity.state : vuePanel.t(stateKey);
    title.textContent = String(attributes.media_title || attributes.friendly_name || vuePanel.t('translation.unknownTitle'));
    const subtitle = attributes.media_artist || attributes.media_album_name;
    artist.textContent = subtitle ? String(subtitle) : '';
    artist.hidden = !subtitle;
    const app = attributes.app_name || attributes.source;
    appBadge.textContent = app ? String(app) : '';
    appBadge.hidden = !app;

    const off = ['off', 'standby', 'unavailable'].includes(entity.state);
    power.hidden = off ? !supports(entity, FEATURE.turnOn) : !supports(entity, FEATURE.turnOff);
    previous.hidden = !supports(entity, FEATURE.previous);
    next.hidden = !supports(entity, FEATURE.next);
    stop.hidden = !supports(entity, FEATURE.stop);
    play.hidden = entity.state === 'playing'
      ? !supports(entity, FEATURE.pause)
      : !supports(entity, FEATURE.play);

    const level = Number(attributes.volume_level);
    volumeWrap.hidden = !supports(entity, FEATURE.volumeSet) || !Number.isFinite(level);
    if (!volumeWrap.hidden && !volumeChanging) {
      const percent = Math.round(level * 100);
      volume.value = String(percent);
      volumeValue.textContent = `${percent}%`;
    }
    mute.hidden = !supports(entity, FEATURE.volumeMute);
    renderSource(entity);
    renderTimeline();
    await renderIcons(entity);
  }

  power.addEventListener('click', () => {
    if (!currentEntity) return;
    const service = ['off', 'standby', 'unavailable'].includes(currentEntity.state) ? 'turn_on' : 'turn_off';
    return vuePanel.callService('media_player', service, {}, {entity_id: entityId});
  });

  previous.addEventListener('click', () =>
    vuePanel.callService('media_player', 'media_previous_track', {}, {entity_id: entityId}));
  next.addEventListener('click', () =>
    vuePanel.callService('media_player', 'media_next_track', {}, {entity_id: entityId}));
  stop.addEventListener('click', () =>
    vuePanel.callService('media_player', 'media_stop', {}, {entity_id: entityId}));
  play.addEventListener('click', () => {
    const service = currentEntity?.state === 'playing' ? 'media_pause' : 'media_play';
    return vuePanel.callService('media_player', service, {}, {entity_id: entityId});
  });
  mute.addEventListener('click', () =>
    vuePanel.callService('media_player', 'volume_mute', {
      is_volume_muted: currentEntity?.attributes?.is_volume_muted !== true
    }, {entity_id: entityId}));

  timeline.addEventListener('input', () => {
    seeking = true;
    positionLabel.textContent = formatTime(timeline.value);
  });
  timeline.addEventListener('change', async () => {
    await vuePanel.callService('media_player', 'media_seek', {
      seek_position: Number(timeline.value)
    }, {entity_id: entityId});
    seeking = false;
    renderTimeline();
  });

  volume.addEventListener('input', () => {
    volumeChanging = true;
    volumeValue.textContent = `${volume.value}%`;
  });
  volume.addEventListener('change', async () => {
    await vuePanel.callService('media_player', 'volume_set', {
      volume_level: Number(volume.value) / 100
    }, {entity_id: entityId});
    volumeChanging = false;
  });

  source.addEventListener('change', () =>
    vuePanel.callService('media_player', 'select_source', {
      source: source.value
    }, {entity_id: entityId}));

  document.querySelector('[data-label="source"]').textContent = vuePanel.t('translation.source');
  timeline.setAttribute('aria-label', vuePanel.t('translation.states.playing'));
  volume.setAttribute('aria-label', vuePanel.t('translation.volume'));
  setInterval(renderTimeline, 1000);
  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else {
    await render(null);
  }
</script>
