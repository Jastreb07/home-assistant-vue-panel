<script data-vue-panel-javascript>
  const config = vuePanel.config;
  const MEDIA_FEATURE_PAUSE = 1;
  const MEDIA_FEATURE_TURN_ON = 128;
  const MEDIA_FEATURE_TURN_OFF = 256;
  const MEDIA_FEATURE_PLAY = 16384;
  let currentEntity = null;

  function supportsFeature(entity, feature) {
    return (Number(entity?.attributes?.supported_features || 0) & feature) !== 0;
  }

  /* Power-toggle when supported, otherwise toggle playback without causing a service error. */
  async function toggleEntity(id) {
    if (!id || !currentEntity) return;
    const isOff = currentEntity.state === 'off';
    if (isOff && supportsFeature(currentEntity, MEDIA_FEATURE_TURN_ON)) {
      return vuePanel.callService('media_player', 'turn_on', {}, {entity_id: id});
    }
    if (!isOff && supportsFeature(currentEntity, MEDIA_FEATURE_TURN_OFF)) {
      return vuePanel.callService('media_player', 'turn_off', {}, {entity_id: id});
    }
    if (currentEntity.state === 'playing' && supportsFeature(currentEntity, MEDIA_FEATURE_PAUSE)) {
      return vuePanel.callService('media_player', 'media_pause', {}, {entity_id: id});
    }
    if (supportsFeature(currentEntity, MEDIA_FEATURE_PLAY)) {
      return vuePanel.callService('media_player', 'media_play', {}, {entity_id: id});
    }
  }

  /*
   * Tipp-Aktionen: Tippen, Doppeltippen und Halten. "default" behält die
   * eingebaute Aktion der Card und öffnet beim Halten ohne eigene Aktion die
   * automatische Detailansicht; "more-info" öffnet die Detailansicht (Ziel ist
   * optional eine bestimmte Dialog-Card), "ha-more-info" das native
   * Home-Assistant-Popup und "popup" ein eigenes Vue-Panel-Popup. "assist"
   * braucht einen Home-Assistant-Dialog, den das Panel nicht öffnen kann.
   */
  function bindGestures(element, settings, handlers) {
    /* Das Panel speichert je Geste eine Aktion samt Ziel */
    const slotOf = gesture => (settings.actions || {})[gesture] || {};
    const actionOf = gesture => String(slotOf(gesture).action || 'default');

    const run = async gesture => {
      const action = actionOf(gesture);
      const target = String(slotOf(gesture).target || '');

      if (action === 'none' || action === 'assist') return;
      if (action === 'more-info') {
        return vuePanel.showDetail(target ? {card: target, entity: handlers.entityId} : {entity: handlers.entityId});
      }
      if (action === 'ha-more-info') {
        return handlers.entityId ? vuePanel.showNativeDetail(handlers.entityId) : undefined;
      }
      if (action === 'popup') return target ? vuePanel.openPopup(target) : undefined;
      if (action === 'default') {
        const handled = handlers.default ? handlers.default(gesture) : undefined;
        if (handled !== undefined) return handled;
        /* Ohne eigene Card-Aktion öffnet Halten die automatische Detailansicht */
        if (gesture === 'hold' && handlers.entityId) return vuePanel.showDetail({entity: handlers.entityId});
        return undefined;
      }
      if (action === 'toggle') return handlers.toggle ? handlers.toggle() : undefined;
      if (action === 'navigate') return target ? vuePanel.navigate(target) : undefined;
      if (action === 'url') {
        if (target) window.open(target, '_blank', 'noopener');
        return;
      }
      if (action === 'perform-action') {
        const [domain, service] = target.split('.');
        if (!domain || !service) return;
        await vuePanel.callService(domain, service, {}, handlers.entityId ? {entity_id: handlers.entityId} : {});
      }
    };

    const ignored = event => Boolean(handlers.ignore) && Boolean(event.target.closest(handlers.ignore));
    let holdTimer = null;
    let held = false;
    let taps = 0;

    element.addEventListener('pointerdown', event => {
      if (ignored(event)) return;
      held = false;
      holdTimer = setTimeout(() => {
        holdTimer = null;
        held = true;
        run('hold');
      }, 500);
    });

    for (const name of ['pointerup', 'pointercancel', 'pointerleave']) {
      element.addEventListener(name, () => {
        if (holdTimer) clearTimeout(holdTimer);
        holdTimer = null;
      });
    }

    element.addEventListener('click', event => {
      if (ignored(event)) return;
      if (held) {
        held = false;
        return;
      }
      const doubled = actionOf('double_tap');
      /* Ohne Doppeltipp-Aktion reagiert der einfache Tipp sofort */
      if (doubled === 'default' || doubled === 'none') {
        run('tap');
        return;
      }
      taps += 1;
      if (taps > 1) return;
      setTimeout(() => {
        const wasDoubled = taps > 1;
        taps = 0;
        run(wasDoubled ? 'double_tap' : 'tap');
      }, 250);
    });
  }

  const entityId = String(config.entity || '');
  const card = document.getElementById('card');
  const tapAction = String(config.actions?.tap?.action || 'default');
  card.classList.toggle('tap-action', !['none', 'assist'].includes(tapAction));
  const name = document.getElementById('name');
  const state = document.getElementById('state');
  const icon = document.getElementById('icon');
  const artwork = document.getElementById('artwork');
  const controls = document.getElementById('controls');
  const volumeWrap = document.getElementById('volume-wrap');
  const volume = document.getElementById('volume');
  const volumeValue = document.getElementById('volume-value');
  const colorCache = new Map();
  const iconCache = new Map();
  let renderedArtwork = '';
  let renderVersion = 0;

  function relativeLuminance(red, green, blue) {
    const channels = [red, green, blue].map(value => {
      const channel = value / 255;
      return channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4;
    });
    return channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
  }

  function paletteFromPixels(pixels) {
    const buckets = new Map();
    for (let index = 0; index < pixels.length; index += 4) {
      const red = pixels[index];
      const green = pixels[index + 1];
      const blue = pixels[index + 2];
      if (pixels[index + 3] < 160) continue;

      const maximum = Math.max(red, green, blue);
      const minimum = Math.min(red, green, blue);
      const saturation = maximum === 0 ? 0 : (maximum - minimum) / maximum;
      const luminance = relativeLuminance(red, green, blue);
      const usable = luminance > 0.025 && luminance < 0.94;
      const key = `${usable ? 1 : 0}-${red >> 4}-${green >> 4}-${blue >> 4}`;
      const bucket = buckets.get(key) || {red: 0, green: 0, blue: 0, count: 0, score: 0, usable};
      bucket.red += red;
      bucket.green += green;
      bucket.blue += blue;
      bucket.count += 1;
      bucket.score += 1 + saturation * 0.35;
      buckets.set(key, bucket);
    }

    const candidates = [...buckets.values()];
    const usable = candidates.filter(candidate => candidate.usable);
    const dominant = (usable.length ? usable : candidates).sort((left, right) => right.score - left.score)[0];
    if (!dominant) throw new Error('Artwork does not contain visible pixels');

    const red = Math.round(dominant.red / dominant.count);
    const green = Math.round(dominant.green / dominant.count);
    const blue = Math.round(dominant.blue / dominant.count);
    const luminance = relativeLuminance(red, green, blue);
    const blackContrast = (luminance + 0.05) / 0.05;
    const whiteContrast = 1.05 / (luminance + 0.05);
    const lightForeground = whiteContrast >= blackContrast;
    return {
      background: `rgb(${red} ${green} ${blue})`,
      foreground: lightForeground ? '#ffffff' : '#111111',
      secondary: lightForeground ? 'rgb(255 255 255 / 76%)' : 'rgb(17 17 17 / 72%)',
      control: lightForeground ? 'rgb(255 255 255 / 22%)' : 'rgb(0 0 0 / 13%)'
    };
  }

  function extractArtworkColors(source) {
    if (colorCache.has(source)) return colorCache.get(source);
    const result = new Promise((resolve, reject) => {
      const image = new Image();
      image.crossOrigin = 'anonymous';
      image.decoding = 'async';
      image.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 32;
          canvas.height = 32;
          const context = canvas.getContext('2d', {willReadFrequently: true});
          if (!context) throw new Error('Canvas is unavailable');
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          resolve(paletteFromPixels(context.getImageData(0, 0, canvas.width, canvas.height).data));
        } catch (error) {
          reject(error);
        }
      };
      image.onerror = () => reject(new Error('Artwork could not be loaded'));
      image.src = source;
    });
    colorCache.set(source, result);
    if (colorCache.size > 16) colorCache.delete(colorCache.keys().next().value);
    return result;
  }

  function getIcon(iconName, size, color) {
    const key = `${iconName}-${size}-${color}`;
    if (!iconCache.has(key)) iconCache.set(key, vuePanel.getIcon(iconName, {size, color}));
    return iconCache.get(key);
  }

  async function renderIcons(playing, color, version) {
    const sources = await Promise.all([
      getIcon(playing ? 'mdi:speaker-play' : 'mdi:speaker', 64, color),
      getIcon('mdi:skip-previous', 48, color),
      getIcon(playing ? 'mdi:pause' : 'mdi:play', 48, color),
      getIcon('mdi:skip-next', 48, color),
      getIcon('mdi:volume-high', 48, color)
    ]);
    if (version !== renderVersion) return;
    for (const [id, source] of [['icon', sources[0]], ['previous', sources[1]], ['play', sources[2]], ['next', sources[3]], ['volume-icon', sources[4]]]) {
      document.getElementById(id).src = source;
    }
  }

  async function applyArtwork(source, version) {
    if (!source) {
      renderedArtwork = '';
      artwork.style.backgroundImage = '';
      card.classList.remove('has-artwork');
      for (const property of ['--media-background', '--media-foreground', '--media-secondary', '--media-control-background']) card.style.removeProperty(property);
      return null;
    }

    if (source !== renderedArtwork) {
      renderedArtwork = source;
      artwork.style.backgroundImage = `url(${JSON.stringify(source)})`;
    }
    card.classList.add('has-artwork');
    try {
      const palette = await extractArtworkColors(source);
      if (version !== renderVersion || source !== renderedArtwork) return null;
      card.style.setProperty('--media-background', palette.background);
      card.style.setProperty('--media-foreground', palette.foreground);
      card.style.setProperty('--media-secondary', palette.secondary);
      card.style.setProperty('--media-control-background', palette.control);
      return palette;
    } catch (error) {
      if (version !== renderVersion || source !== renderedArtwork) return null;
      card.style.setProperty('--media-background', 'var(--accent, #5f6368)');
      card.style.setProperty('--media-foreground', '#ffffff');
      card.style.setProperty('--media-secondary', 'rgb(255 255 255 / 76%)');
      card.style.setProperty('--media-control-background', 'rgb(255 255 255 / 22%)');
      return {foreground: '#ffffff'};
    }
  }

  async function render(entity) {
    currentEntity = entity;
    const version = ++renderVersion;
    const playing = entity?.state === 'playing';
    const idle = ['idle', 'off', 'standby'].includes(entity?.state) || !entity;
    const picture = config.dynamicBackground !== false && !idle && (entity?.attributes?.entity_picture_local || entity?.attributes?.entity_picture);
    const source = picture ? new URL(String(picture), window.location.origin).href : '';
    card.classList.toggle('active', playing);
    name.textContent = String(config.name || entity?.attributes?.friendly_name || entityId || vuePanel.t('translation.defaultName'));
    state.textContent = !entityId ? vuePanel.t('translation.noEntity') : !entity ? vuePanel.t('translation.entityNotFound') : idle ? vuePanel.t('translation.states.idle') : `${entity.attributes?.media_title || vuePanel.t('translation.unknownTitle')}${entity.attributes?.media_artist ? ` · ${entity.attributes.media_artist}` : ''}`;
    controls.hidden = idle;
    const level = Math.round(Number(entity?.attributes?.volume_level) * 100);
    volumeWrap.hidden = config.showVolume === false || !Number.isFinite(level);
    volume.value = String(level || 0);
    volumeValue.textContent = `${level || 0} %`;
    const palette = await applyArtwork(source, version);
    const foreground = palette?.foreground || (playing ? '#111111' : '#737373');
    await renderIcons(playing, foreground, version);
  }

  controls.addEventListener('click', async event => {
    const button = event.target.closest('button');
    if (button) await vuePanel.callService('media_player', button.dataset.service, {}, {entity_id: entityId});
  });
  volume.addEventListener('change', () => vuePanel.callService('media_player', 'volume_set', {volume_level: Number(volume.value) / 100}, {entity_id: entityId}));
  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);

  /* Tipp-Aktionen auf der Card; die eigenen Bedienelemente bleiben unberührt */
  bindGestures(card, config, {
    entityId,
    ignore: '#controls, #volume-wrap',
    default: gesture => gesture === 'tap' ? toggleEntity(entityId) : undefined,
    toggle: () => toggleEntity(entityId)
  });
</script>
