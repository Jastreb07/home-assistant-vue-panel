    "apiVersion": 1,
    "manufacturer": "vue-panel",
    "cardName": "media",
    "name": "Medien",
    "description": "Steuert einen Media Player",
    "icon": "mdi:speaker",
    "group": "Vue Panel",
    "areas": [
      "dashboard"
    ],
    "capabilities": [
      "entity:read",
      "entity:subscribe",
      "icon:render",
      "service:call"
    ],
    "defaultSize": {

      "rows": 1,

    },
    "defaultResponsive": {
      "mobile": true,
      "tablet": true,
      "desktop": true,
      "mobileMax": 767,
      "tabletMax": 1023
    },
    "fullRow": false,
    "variables": [
      {
        "key": "entity",
        "label": "Media-Player-Entity",
        "type": "entity",
        "required": true,
        "domain": "media_player",
        "default": ""
      },
      {
        "key": "name",
        "label": "Anzeigename",
        "group": "Darstellung",
        "type": "string",
        "required": false,
        "default": ""
      },
      {
        "key": "showVolume",
        "label": "Lautstärke anzeigen",

        "type": "boolean",
        "required": false,
        "default": true
      }
    ]
  };
</script>

<template data-vue-panel-html>
  <article class="tile media-card" id="card"><span class="tile__icon"><img id="icon" alt=""></span>
    <div class="controls" id="controls">
      <button data-service="media_previous_track"><img id="previous" alt=""></button>
      <button data-service="media_play_pause"><img id="play" alt=""></button>
      <button data-service="media_next_track"><img id="next" alt=""></button>
    </div>
    <div class="tile__info">
      <div class="tile__name" id="name"></div>
      <div class="tile__state" id="state"></div>
    </div>
    <label class="volume" id="volume-wrap"><img id="volume-icon" alt=""><input id="volume" type="range" min="0"
                                                                               max="100"><span id="volume-value"></span></label>
  </article>
</template>

<script data-vue-panel-javascript>
  const config = vuePanel.config;
  const entityId = String(config.entity || '');
  const card = document.getElementById('card');
  const name = document.getElementById('name');
  const state = document.getElementById('state');
  const icon = document.getElementById('icon');
  const controls = document.getElementById('controls');
  const volumeWrap = document.getElementById('volume-wrap');
  const volume = document.getElementById('volume');
  const volumeValue = document.getElementById('volume-value');
  for (const [id, value] of [['previous', 'mdi:skip-previous'], ['next', 'mdi:skip-next'], ['volume-icon', 'mdi:volume-high']]) document.getElementById(id).src = await vuePanel.getIcon(value, {
    size: 48,
    color: '#111111'
  });

  async function render(entity) {
    const playing = entity?.state === 'playing';
    const idle = ['idle', 'off', 'standby'].includes(entity?.state) || !entity;
    card.classList.toggle('active', playing);
    name.textContent = String(config.name || entity?.attributes?.friendly_name || entityId || 'Medien');
    state.textContent = !entityId ? 'Keine Entity ausgewählt' : !entity ? 'Entity nicht gefunden' : idle ? 'Inaktiv' : `${entity.attributes?.media_title || 'Unbekannter Titel'}${entity.attributes?.media_artist ? ` · ${entity.attributes.media_artist}` : ''}`;
    controls.hidden = idle;
    const level = Math.round(Number(entity?.attributes?.volume_level) * 100);
    volumeWrap.hidden = config.showVolume === false || !Number.isFinite(level);
    volume.value = String(level || 0);
    volumeValue.textContent = `${level || 0} %`;
    icon.src = await vuePanel.getIcon(playing ? 'mdi:speaker-play' : 'mdi:speaker', {
      size: 64,
      color: playing ? '#111111' : '#737373'
    });
    document.getElementById('play').src = await vuePanel.getIcon(playing ? 'mdi:pause' : 'mdi:play', {
      size: 48,
      color: '#111111'
    });
  }

  controls.addEventListener('click', async event => {
    const button = event.target.closest('button');
    if (button) await vuePanel.callService('media_player', button.dataset.service, {}, {entity_id: entityId});
  });
  volume.addEventListener('change', () => vuePanel.callService('media_player', 'volume_set', {volume_level: Number(volume.value) / 100}, {entity_id: entityId}));
  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);
</script>
