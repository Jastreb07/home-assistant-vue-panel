    .menu-card {

    }

    }


    /* =========================
       HORIZONTALES MENÜ
       ========================= */

        flex-direction: row;

        flex-wrap: nowrap;

        align-items: center;
        justify-content: flex-start;

        overflow: visible;
    }

    /* Horizontal: Buttonbreite nach Inhalt */
    .menu-card.horizontal .item {
        width: auto;

         */
        padding: 10px 14px;

    }


    /* =========================
       AUFKLAPPBARE GRUPPEN (horizontal)
       ========================= */

    /*
     * Ein Eintrag mit Kindern: Eltern-Button + Pfeil nebeneinander,
     * das Dropdown hängt sich absolut darunter.
     */
    /*
     * Der Eltern-Eintrag ist selbst der Auslöser des Dropdowns — es gibt
     * keinen eigenen Pfeil-Button daneben.
     */
    .item-group {
        position: relative;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
    }

    /*
     * Die Leiste selbst bleibt über dem Weichzeichner: scharf gezeichnet und
     * vor allem weiter anklickbar. Ohne das läge der Weichzeichner über dem
     * Eltern-Eintrag und würde jeden Klick darauf abfangen.
     *
     * Die Werte bleiben bewusst klein: Card und Bearbeiten-Overlay teilen sich
     * einen Stacking-Kontext, und dessen Overlay liegt bei z-index 4. Alles
     * darüber würde im Bearbeitungsmodus den Stift verdecken.
     */
    .menu-card.horizontal > .item,
    .menu-card.horizontal > .item-group,
    .menu-card.vertical > .item,
    .menu-card.vertical > .item-group {
        position: relative;
        z-index: 2;
    }

    /*
     * Fest am Viewport statt am Eltern-Element: die Leisten schneiden ihren
     * Inhalt ab (`overflow` an der Karten-Spur und an der Card selbst), ein
     * absolut positioniertes Dropdown wäre darin gefangen. `fixed` entkommt
     * jedem `overflow` der Vorfahren; die genaue Position setzt das Skript.
     */
    .submenu {
        position: fixed;
        /* Innerhalb der Gruppe — muss nur über deren Eltern-Eintrag liegen */
        z-index: 1;
        padding: 6px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        width: max-content;
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 16px);
        overflow-y: auto;
        border-radius: 18px;
        background: var(--card-bg);
        box-shadow: var(--card-shadow);
    }

    /*
     * Weichzeichner über dem ganzen Panel. Liegt als eigene, viewport-feste

    .submenu-backdrop {

        width: 100%;
        justify-content: flex-start;
        gap: 10px;
        padding: 4px;
        border-radius: 14px;

    .submenu.compact {
        padding: 2px;

        animation: vp-menu-dialog .18s ease-out;

    .submenu.as-dialog .item {

<script data-vue-panel-javascript>
  const menu = document.getElementById('menu');

  let active = await vuePanel.currentView();

  /*
   * Nur horizontal betrifft es: welche Gruppe (per Schlüssel des
   * Eltern-Eintrags) gerade aufgeklappt ist. Bleibt über ein Re-Render
   * hinweg bestehen, damit Navigieren innerhalb einer Gruppe sie nicht
   * schließt.
   */
  let openGroupKey = null;

  /*
   * Das gerade offene Dropdown, um es bei Scrollen/Größenänderung neu
   * auszurichten — es hängt am Viewport, nicht am Eltern-Element.
   */
  let openSubmenu = null;

  /*
   * Navigieren und Schließen stoßen beide ein Rendern an. Da der Aufbau
   * `await`s enthält (Icons), laufen sie sonst ineinander. Nur der jüngste
   * Lauf darf den Baum tauschen.
   */
  let renderToken = 0;

  /*
   * Anzahl der Einträge direkt nach `index`, die tiefer verschachtelt sind
   * als der Eintrag selbst — also sein Block aus Kindern (und deren
   * Kindern). Gleiche Idee wie beim WordPress-artigen Listen-Editor.
   */
  function childBlockLength(entries, index) {
    const depth = entries[index].depth;
    let length = 0;

    while (index + 1 + length < entries.length && entries[index + 1 + length].depth > depth) {
      length++;
    }

    return length;
  }

  function keyOf(entry, index) {
    if (entry.action === 'back') return `back:${index}`;
    if (entry.view) return `view:${entry.view.id}`;
    if (entry.url) return `url:${index}`;
    return `heading:${index}`;
  }

  const SUBMENU_GAP = 6;
  const SUBMENU_EDGE = 8;

  /* Versatz zwischen zwei nacheinander einblendenden Einträgen */
  const STAGGER_STEP = 40;

  /*
   * Eigener Verlauf für "Zurück". Bewusst nicht `history.back()`: die Route
   * wird per postMessage an Home Assistant gespiegelt, ein Schritt in der
   * iframe-Historie brächte beide Seiten auseinander. Stattdessen wird die
   * zuvor besuchte Ansicht ganz normal angesteuert.
   */
  const MAX_HISTORY = 50;
  const viewHistory = [];
  let navigatingBack = false;

  function rememberVisit(previous, next) {
    if (navigatingBack) {
      navigatingBack = false;
      return;
    }

    if (!previous?.path || !next?.path || previous.path === next.path) return;

    viewHistory.push(previous.path);
    if (viewHistory.length > MAX_HISTORY) viewHistory.shift();
  }

  async function navigateBack() {
    const path = viewHistory.pop();

    if (!path) return;

    const target = (await vuePanel.listViews()).find(view => view?.path === path);

    if (!target) return;

    navigatingBack = true;
    vuePanel.navigate(target.id);
  }

  /*
   * Setzt das viewport-feste Dropdown an seinen Eltern-Eintrag. Läuft es
   * seitlich aus dem Bild, wird es an den Rand geschoben statt abgeschnitten.
   */
  function positionSubmenu(group, submenu, direction) {
    const bounds = group.getBoundingClientRect();
    const viewportWidth = window.innerWidth || 0;
    const viewportHeight = window.innerHeight || 0;

    /*
     * Vertikales Menü: das Untermenü klappt zur Seite auf, nicht nach unten.
     * Es richtet sich an der Oberkante seines Eltern-Eintrags aus und wird
     * nach oben geschoben, wenn es sonst unten aus dem Bild liefe.
     */
    if (direction === 'right' || direction === 'left') {
      /* Die Breite des schmalen Eltern-Eintrags wäre hier kein gutes Maß */
      submenu.style.minWidth = '';
      submenu.style.bottom = 'auto';

      const height = submenu.offsetHeight;
      const maxTop = viewportHeight - height - SUBMENU_EDGE;

      submenu.style.top = `${Math.max(SUBMENU_EDGE, Math.min(bounds.top, maxTop))}px`;

      const width = submenu.offsetWidth;
      const maxLeft = viewportWidth - width - SUBMENU_EDGE;

      const left =
        direction === 'right'
          ? bounds.right + SUBMENU_GAP
          : bounds.left - SUBMENU_GAP - width;

      submenu.style.left = `${Math.max(SUBMENU_EDGE, Math.min(left, maxLeft))}px`;

      return;
    }

    submenu.style.minWidth = `${bounds.width}px`;

    if (direction === 'up') {
      submenu.style.top = 'auto';
      submenu.style.bottom = `${Math.max(SUBMENU_EDGE, viewportHeight - bounds.top + SUBMENU_GAP)}px`;
    } else {
      submenu.style.bottom = 'auto';
      submenu.style.top = `${bounds.bottom + SUBMENU_GAP}px`;
    }

    /* Erst nach dem Setzen der Breite messen, sonst ist offsetWidth veraltet */
    const width = submenu.offsetWidth;
    const maxLeft = viewportWidth - width - SUBMENU_EDGE;

    submenu.style.left = `${Math.max(SUBMENU_EDGE, Math.min(bounds.left, maxLeft))}px`;
  }

  function repositionOpenSubmenu() {
    /* Der Dialog sitzt fest zentriert — dafür gibt es nichts nachzuführen */
    if (!openSubmenu || openSubmenu.direction === 'dialog') return;
    positionSubmenu(openSubmenu.group, openSubmenu.submenu, openSubmenu.direction);
  }

  /*
   * Wohin ein Untermenü aufklappt. Horizontal nach unten oder oben, vertikal
   * zur Seite. Richtet sich immer nach dem verfügbaren Platz: eine Card in
   * der unteren Bildschirmhälfte (typisch für die Bottom-Leiste) klappt nach
   * oben, eine Sidebar am rechten Rand nach links.
   */
  function resolveDirection(config, horizontal) {
    const bounds = menu.getBoundingClientRect();

    if (!horizontal) {
      const setting = String(config.submenuSide || 'auto');

      if (setting === 'right' || setting === 'left') return setting;

      const viewportWidth = window.innerWidth || 0;

      if (!viewportWidth || !bounds.width) return 'right';

      return bounds.left + bounds.width / 2 > viewportWidth / 2 ? 'left' : 'right';
    }

    const viewportHeight = window.innerHeight || 0;

    if (!viewportHeight || !bounds.height) return 'down';

    return bounds.top + bounds.height / 2 > viewportHeight / 2 ? 'up' : 'down';
  }

  /*
   * `asTrigger` markiert den Eltern-Eintrag einer Gruppe: Er bleibt klickbar,
   * bekommt aber keine eigene Navigation — sein Klick öffnet das Dropdown.
   */
  async function buildItem(entry, opts) {
    const {
      showText,
      showIcon,
      iconPosition = 'after',
      size = 'medium',
      asTrigger = false
    } = opts;

    const view = entry.view;

    /*
     * Ziel eines Eintrags: entweder eine Ansicht oder ein eigener Link.
     * Ohne beides bleibt der Eintrag eine reine Überschrift.
     */
    const url = entry.url;
    const isBack = entry.action === 'back';
    const hasTarget = Boolean(view) || Boolean(url) || isBack;

    /* Ein Gruppen-Auslöser ist auch ohne eigenes Ziel bedienbar */
    const interactive = hasTarget || asTrigger;

    /*
     * Überschriften ohne darstellbaren Inhalt würden nur
     * eine leere Fläche erzeugen und entfallen deshalb.
     */
    if (!interactive && !showText && !(showIcon && entry.icon)) return null;

    /*
     * Ein Eintrag ohne Ziel ist eine reine Überschrift
     * und darf deshalb nicht klickbar sein.
     */
    const element = document.createElement(interactive ? 'button' : 'div');

    if (interactive) element.type = 'button';

    element.className = 'item';
    element.classList.add(`size-${size}`);
    element.dataset.depth = String(entry.depth);

    /*
     * Aktiv ist die View mit exakt passendem Pfad.
     * Liegt der aktive Pfad unterhalb dieser View,
     * ist sie der Parent der aktiven Unteransicht.
     */
    const isActive = Boolean(view) && active?.path === view.path;

    const isActiveParent =
      Boolean(view) &&
      !isActive &&
      Boolean(active?.path?.startsWith(`${view.path}/`));

    /*
     * Struktur: hat die View Kinder (parent)
     * bzw. liegt sie selbst unterhalb einer anderen View (child)?
     */
    const isParent =
      Boolean(view) &&
      entry.allViews.some(
        other =>
          other.path !== view.path &&
          other.path.startsWith(`${view.path}/`)
      );

    const isChild = Boolean(view) && view.path.includes('/');

    element.classList.toggle('heading', !interactive);
    element.classList.toggle('active', isActive);
    element.classList.toggle('active-parent', isActiveParent);
    element.classList.toggle('parent', isParent);
    element.classList.toggle('child', isChild);
    element.classList.toggle('icon-only', !showText);

    /*
     * Ein Zurück-Eintrag beschriftet sich selbst, wenn nichts angegeben ist.
     */
    const label = entry.label || (isBack ? vuePanel.t('translation.back') : '');

    /*
     * Ohne Text erklärt ein Tooltip den Eintrag.
     */
    if (!showText && label) element.title = label;

    /*
     * Titel
     */
    if (showText) {
      const labelElement = document.createElement('span');

      labelElement.textContent = label;

      element.append(labelElement);
    }

    /*
     * Icon. Ohne Text braucht jeder Eintrag ein Icon,
     * sonst bliebe die Schaltfläche leer.
     */
    const fallbackIcon = isBack ? 'mdi:arrow-left' : (showText ? '' : 'mdi:circle-outline');
    const iconName = entry.icon || fallbackIcon;

    if (showIcon && iconName) {
      const icon = document.createElement('img');

      icon.alt = '';

      icon.src = await vuePanel.getIcon(iconName, {
        size: 56,
        color:
          getComputedStyle(document.documentElement)
            .getPropertyValue('--text-primary')
            .trim() || '#ffffff'
      });

      element.classList.add(iconPosition === 'before' ? 'icon-before' : 'icon-after');
      element.append(icon);
    }

    /*
     * Navigation. Eine Ansicht gewinnt gegen einen eigenen Link, damit ein
     * versehentlich gefülltes URL-Feld die Navigation nicht überschreibt.
     */
    if (asTrigger) {
      /* Den Klick verdrahtet die Gruppe selbst */
    } else if (isBack) {
      element.addEventListener('click', () => {
        navigateBack();
        closeOpenGroup();
      });
    } else if (view) {
      element.addEventListener('click', () => {
        vuePanel.navigate(view.id);
        closeOpenGroup();
      });
    } else if (url) {
      element.addEventListener('click', () => {
        window.open(url, '_blank', 'noopener');
        closeOpenGroup();
      });
    }

    return element;
  }

  /* Ein Untermenü geht ausschließlich per Klick auf den Eltern-Eintrag auf */
  function closeOpenGroup() {
    if (openGroupKey === null) return;
    openGroupKey = null;
    render();
  }

  function toggleGroup(key) {
    openGroupKey = openGroupKey === key ? null : key;
    render();
  }

  /*
   * Kinder werden als Dropdown an ihrem Eltern-Eintrag geführt statt flach
   * in der Liste. Horizontal bleibt so eine Zeile lesbar, vertikal die
   * Sidebar kurz — egal wie viele Unteransichten es gibt.
   */
  async function buildGroup(node, options) {
    const hasChildren = node.children.length > 0;

    /*
     * Hat der Eintrag Kinder, ist er selbst der Auslöser des Dropdowns und
     * navigiert deshalb nicht mehr — sonst bliebe sein Untermenü unerreichbar.
     */
    const parentElement = await buildItem(node.entry, {
      showText: options.showText,
      showIcon: options.showIcon,
      iconPosition: options.iconPosition,
      size: options.itemSize,
      asTrigger: hasChildren
    });

    if (!parentElement) return null;

    if (!hasChildren) return { element: parentElement };

    const key = node.key;
    const isOpen = openGroupKey === key;

    const group = document.createElement('div');

    group.className = 'item-group';
    group.classList.toggle('open', isOpen);

    /*
     * Der Eltern-Eintrag selbst klappt die Gruppe auf und zu.
     *
     * Im vertikalen Menü navigiert er zusätzlich zu seiner eigenen Ansicht,
     * sofern er eine hat und die Gruppe gerade aufgeht — sonst wäre eine
     * Ansicht mit Unteransichten überhaupt nicht mehr erreichbar. Beim
     * Zuklappen bleibt es bei der reinen Geste.
     */
    parentElement.setAttribute('aria-expanded', String(isOpen));
    parentElement.addEventListener('click', () => {
      if (options.triggerNavigates && node.entry.view && !isOpen) {
        vuePanel.navigate(node.entry.view.id);
      }

      toggleGroup(key);
    });

    /*
     * "Dialog" ersetzt das Flyout durch ein zentriertes Fenster — dafür
     * braucht es weder eine Richtung noch die daran hängende Positionierung.
     */
    const isDialog = options.submenuStyle === 'dialog';

    const submenu = document.createElement('div');

    submenu.className = 'submenu';

    if (isDialog) {
      submenu.classList.add('as-dialog');
    } else {
      submenu.classList.add(options.direction);
      if (options.submenuStyle === 'compact') submenu.classList.add('compact');
    }

    submenu.hidden = !isOpen;

    /* Im Dialog erinnert eine Kopfzeile daran, aus welchem Eintrag er stammt */
    if (isDialog && node.entry.label) {
      const header = document.createElement('div');

      header.className = 'submenu-header';
      header.textContent = node.entry.label;

      submenu.append(header);
    }

    /*
     * Im Dialog stehen die Buttons in einem eigenen scrollbaren Feld,
     * getrennt von der Kopfzeile — sonst würde die beim Scrollen mit
     * verschwinden. Flyout und Kompakt scrollen weiterhin als Ganzes.
     */
    const itemsContainer = isDialog ? document.createElement('div') : submenu;

    if (isDialog) {
      itemsContainer.className = 'submenu-body';
      submenu.append(itemsContainer);
    }

    /*
     * Untermenüs haben ihre eigene Darstellung — unabhängig davon, ob die
     * Hauptleiste gerade Icon, Text oder beides zeigt.
     */
    const childElements = [];

    for (const child of node.children) {
      const childElement = await buildItem(child, {
        showText: options.submenuText,
        showIcon: options.submenuIcon,
        iconPosition: options.submenuIconPosition,
        size: options.submenuItemSize
      });

      if (childElement) childElements.push(childElement);
    }

    /*
     * Die Einträge blenden nacheinander ein — beim Aufklappen nach oben
     * beginnend beim untersten, also dem Eltern-Eintrag am nächsten. Im
     * Dialog blendet nur das Fenster selbst ein, die Reihenfolge ist egal.
     */
    childElements.forEach((element, index) => {
      const step =
        !isDialog && options.direction === 'up' ? childElements.length - 1 - index : index;

      element.style.setProperty('--vp-item-delay', `${step * STAGGER_STEP}ms`);
      itemsContainer.append(element);
    });

    group.append(parentElement, submenu);

    /*
     * Der Weichzeichner liegt als eigene, viewport-feste Fläche unter dem
     * Dropdown und schließt es beim Anklicken.
     */
    let backdrop = null;

    if (isOpen) {
      backdrop = document.createElement('div');
      backdrop.className = 'submenu-backdrop';
      backdrop.addEventListener('click', closeOpenGroup);
    }

    /*
     * Ausgerichtet wird erst nach dem Einhängen — vorher lässt sich die
     * Breite nicht messen. Deshalb reicht die Gruppe die offene Position
     * nur nach oben durch.
     */
    return {
      element: group,
      backdrop,
      open: isOpen ? { group, submenu, direction: isDialog ? 'dialog' : options.direction } : null
    };
  }

  /*
   * Die am tiefsten liegende Ansicht, unter der `view` hängt. Über den Pfad,
   * weil Unteransichten sich genau so ausweisen ("wohnzimmer/licht").
   */
  function parentOf(view, views) {
    let best = null;

    for (const other of views) {
      if (other.path === view.path) continue;
      if (!view.path.startsWith(`${other.path}/`)) continue;
      if (!best || other.path.length > best.path.length) best = other;
    }

    return best;
  }

  /*
   * Ohne eigene Menüeinträge listet die Card alle Ansichten auf — und hängt
   * Unteransichten unter ihre Elternansicht. Das ersetzt den früheren
   * Schalter "Unteransichten anzeigen": sie sind jetzt immer erreichbar,
   * nur eben eingeklappt im Untermenü ihres Elterneintrags.
   *
   * Eine Unteransicht, deren Elternansicht gar nicht existiert, bleibt auf
   * oberster Ebene stehen, statt unerreichbar zu werden.
   */
  function buildAutoEntries(allViews) {
    const views = allViews.filter(view => typeof view?.path === 'string');
    const parents = new Map(views.map(view => [view.path, parentOf(view, views)]));

    const entries = [];

    const appendLevel = (parentPath, depth) => {
      for (const view of views) {
        const parent = parents.get(view.path);

        if ((parent ? parent.path : null) !== parentPath) continue;

        entries.push({
          label: view.title,
          icon: view.icon,
          view,
          url: '',
          action: 'navigate',
          depth: Math.min(depth, 2)
        });

        appendLevel(view.path, depth + 1);
      }
    };

    appendLevel(null, 0);

    return entries;
  }

  async function render() {
    const token = ++renderToken;

    /*
     * Config immer neu lesen.
     * Dadurch werden Änderungen an der Karten-Konfiguration
     * beim erneuten Rendern berücksichtigt.
     */
    const config = vuePanel.config;

    /*
     * Alte Ausrichtung entfernen und aktuelle setzen.
     * So können niemals gleichzeitig vertical und horizontal
     * auf dem Element vorhanden sein.
     */
    menu.classList.remove('vertical', 'horizontal');

    const horizontal = config.orientation === 'horizontal';

    menu.classList.add(horizontal ? 'horizontal' : 'vertical');

    /*
     * Darstellung: Icon und Text, nur Icon oder nur Text.
     * Ältere Instanzen speichern stattdessen noch die beiden
     * Schalter showTitles/showIcons; die gelten als Rückfallebene.
     */
    const display = String(config.display || '');

    const showText =
      display === 'icon'
        ? false
        : display === 'text' || display === 'icon_text'
          ? true
          : config.showTitles !== false;

    const showIcon =
      display === 'text'
        ? false
        : display === 'icon' || display === 'icon_text'
          ? true
          : config.showIcons !== false;

    /*
     * Untermenüs dürfen eine eigene Darstellung haben. Ohne Angabe
     * zeigen sie Icon und Text — wie im Screenshot-Layout.
     */
    const submenuDisplay = String(config.submenuDisplay || 'icon_text');
    const submenuText = submenuDisplay !== 'icon';
    const submenuIcon = submenuDisplay !== 'text';

    const iconPosition = String(config.iconPosition || 'after');
    const submenuIconPosition = String(config.submenuIconPosition || 'before');
    const itemSize = String(config.itemSize || 'medium');
    const submenuItemSize = String(config.submenuItemSize || 'medium');
    const submenuStyle = String(config.submenuStyle || 'flyout');

    /*
     * Views ebenfalls neu laden, damit neu angelegte oder umbenannte
     * Ansichten beim erneuten Rendern sofort auftauchen.
     */
    const allViews = await vuePanel.listViews();

    /* Ein neuerer Lauf hat übernommen — diesen hier verwerfen */
    if (token !== renderToken) return;

    /*
     * Eigene Menüeinträge gewinnen. Ohne konfigurierte Einträge
     * listet die Card automatisch alle Ansichten auf.
     */
    const configured = Array.isArray(config.items) ? config.items : [];

    const entries = (configured.length
      ? configured.map(item => {
          const target =
            item && typeof item.view === 'string'
              ? allViews.find(view => view.id === item.view)
              : undefined;

          return {
            label:
              (item && typeof item.label === 'string' && item.label) ||
              target?.title ||
              '',
            icon:
              (item && typeof item.icon === 'string' && item.icon) ||
              target?.icon,
            view: target,
            url:
              (item && typeof item.url === 'string' && item.url.trim()) || '',
            action: item && item.action === 'back' ? 'back' : 'navigate',
            depth:
              item && Number(item.depth) > 0
                ? Math.min(Math.floor(Number(item.depth)), 2)
                : 0
          };
        })
      : buildAutoEntries(allViews)
    // `isParent` braucht die volle View-Liste — an jedem Eintrag mitgeben,
    // statt sie als globale Closure-Variable vorauszusetzen.
    ).map(entry => ({ ...entry, allViews }));

    /*
     * Aus der flachen, Tiefe-basierten Liste Gruppen bilden. Ein Eintrag auf
     * oberster Ebene sammelt die unmittelbar folgenden, tieferen Einträge als
     * seine Kinder (identisch zum "Block"-Konzept des Listen-Editors).
     */
    const nodes = [];

    for (let index = 0; index < entries.length; index++) {
      const entry = entries[index];

      if (entry.depth > 0) continue;

      const length = childBlockLength(entries, index);

      nodes.push({
        key: keyOf(entry, index),
        entry,
        children: entries.slice(index + 1, index + 1 + length)
      });
    }

    /*
     * Zeigt eine Gruppe, die es nicht mehr gibt, wird die Auswahl verworfen.
     * Automatisch aufklappen tut hier bewusst nichts: ein Untermenü geht nur
     * durch einen Klick auf den Eltern-Eintrag auf.
     */
    if (openGroupKey !== null && !nodes.some(node => node.key === openGroupKey)) {
      openGroupKey = null;
    }

    const direction = resolveDirection(config, horizontal);

    const children = [];
    let pendingOpen = null;

    for (const node of nodes) {
      const built = await buildGroup(node, {
        showText,
        showIcon,
        submenuText,
        submenuIcon,
        iconPosition,
        submenuIconPosition,
        itemSize,
        submenuItemSize,
        submenuStyle,
        direction,
        /*
         * Nur vertikal: der Eltern-Eintrag öffnet nicht nur, sondern
         * navigiert auch. Horizontal ist er bewusst reiner Auslöser.
         */
        triggerNavigates: !horizontal
      });

      /* Ein neuerer Lauf hat übernommen — diesen hier verwerfen */
      if (token !== renderToken) return;
      if (!built) continue;

      /* Der Weichzeichner zuerst, damit er im Baum unter der Gruppe liegt */
      if (built.backdrop) children.push(built.backdrop);
      children.push(built.element);
      if (built.open) pendingOpen = built.open;
    }

    /*
     * Erst hier den Baum tauschen: würde schon vor den `await`s geleert,
     * könnten zwei gleichzeitige Läufe (Navigation + Schließen) beide
     * anhängen und die Einträge verdoppeln.
     */
    menu.classList.toggle('opens-up', direction === 'up');
    openSubmenu = null;
    menu.replaceChildren(...children);

    if (pendingOpen) {
      openSubmenu = pendingOpen;

      /* Der Dialog sitzt fest zentriert per CSS — keine Positionierung nötig */
      if (pendingOpen.direction !== 'dialog') {
        positionSubmenu(pendingOpen.group, pendingOpen.submenu, pendingOpen.direction);
      }
    }
  }

  await render();

  vuePanel.subscribeNavigation(view => {
    rememberVisit(active, view);
    active = view;
    render();
  });

  /*
   * Außerhalb der offenen Gruppe klicken oder Escape drücken schließt sie.
   *
   * Bewusst in der Capture-Phase: das Neuzeichnen läuft rein über Microtasks
   * und ist schon fertig, bevor ein Handler der Bubble-Phase drankommt. Der
   * angeklickte Knoten wäre dann längst ausgetauscht, `menu.contains()` würde
   * ihn für "außerhalb" halten und das gerade geöffnete Menü sofort wieder
   * schließen. In der Capture-Phase hängt er noch im Baum.
   */
  document.addEventListener('click', event => {
    if (openGroupKey === null) return;
    // Nur diese Card-Instanz betrachten — mehrere Menü-Cards mit eigenen
    // Dropdowns dürfen sich nicht gegenseitig offen halten.
    if (menu.contains(event.target)) return;
    closeOpenGroup();
  }, true);

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeOpenGroup();
  });

  /*
   * Das Dropdown hängt am Viewport: Scrollen oder Größenänderungen
   * verschieben seinen Eltern-Eintrag, also muss es nachgeführt werden.
   * `true` fängt auch das Scrollen innerhalb der Leiste ab.
   */
  window.addEventListener('resize', repositionOpenSubmenu);
  window.addEventListener('scroll', repositionOpenSubmenu, true);
</script>
