<script data-vue-panel-config>
  const vuePanelCard = {
    "format": "vue-panel-card",
    "formatVersion": 2,
    "apiVersion": 1,
    "manufacturer": "vue-panel",
    "cardName": "menu",
    "name": "Navigation",
    "description": "Dynamische Navigation durch die Dashboard-Ansichten",
    "icon": "mdi:format-list-bulleted",
    "group": "Vue Panel",
    "areas": ["dashboard", "sidebar", "header", "bottom"],
    "capabilities": ["navigation:read", "navigation:write", "icon:render"],
    "defaultSize": {"cols": 1, "rows": 1, "width": 280, "height": 120},
    "defaultResponsive": {"mobile": true, "tablet": true, "desktop": true, "mobileMax": 767, "tabletMax": 1023},
    "fullRow": false,
    "variables": [{
      "key": "orientation",
      "label": "Ausrichtung",
      "type": "select",
      "required": false,
      "options": ["vertical", "horizontal"],
      "optionLabels": {"vertical": "Vertikal", "horizontal": "Horizontal"},
      "default": "vertical"
    }, {
      "key": "showTitles",
      "label": "Titel anzeigen",
      "type": "boolean",
      "required": false,
      "default": true
    }, {
      "key": "showIcons",
      "label": "Icons anzeigen",
      "type": "boolean",
      "required": false,
      "default": true
    }, {
      "key": "showSubviews",
      "label": "Unteransichten anzeigen",
      "type": "boolean",
      "required": false,
      "default": false
    }]
  };
</script>

<template data-vue-panel-html>
  <nav class="menu-card" id="menu"></nav>
</template>

<style data-vue-panel-css>
    .menu-card {
        width: 100%;
        height: 100%;
        display: flex;
        gap: 8px;
        min-width: 0;
        overflow: auto
    }

    .menu-card.vertical {
        flex-direction: column
    }

    .menu-card.horizontal {
        flex-flow: row wrap;
        align-content: flex-start
    }

    .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        border: 0;
        border-radius: 28px;
        background: transparent;
        color: var(--text-primary);
        font: 600 16px/1.2 inherit;
        text-align: left;
        cursor: pointer
    }

    .vertical .item {
        width: 100%
    }

    .item.icon-only {
        justify-content: center;
        padding: 14px
    }

    .item:hover {
        background: var(--nav-item-hover)
    }

    .item.active {
        background: var(--nav-item-active)
    }

    .item.active-parent {
        box-shadow: inset 3px 0 var(--accent)
    }

    .item span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis
    }

    .item img {
        width: 22px;
        height: 22px;
        flex: none
    }
</style>

<script data-vue-panel-javascript>
  const config = vuePanel.config;
  const menu = document.getElementById('menu');
  const views = (await vuePanel.listViews()).filter(view => config.showSubviews === true || !view.subview);
  let active = await vuePanel.currentView();
  menu.classList.add(config.orientation === 'horizontal' ? 'horizontal' : 'vertical');

  async function render() {
    menu.replaceChildren();
    for (const view of views) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'item';
      const isActive = active?.path === view.path;
      const isParent = !isActive && active?.path?.startsWith(`${view.path}/`);
      button.classList.toggle('active', isActive);
      button.classList.toggle('active-parent', Boolean(isParent));
      button.classList.toggle('icon-only', config.showTitles === false);
      if (config.showTitles !== false) {
        const label = document.createElement('span');
        label.textContent = view.title;
        button.append(label);
      }
      if (config.showIcons !== false && view.icon) {
        const icon = document.createElement('img');
        icon.alt = '';
        icon.src = await vuePanel.getIcon(view.icon, {
          size: 56,
          color: getComputedStyle(document.documentElement).getPropertyValue('--text-primary') || '#ffffff'
        });
        button.append(icon);
      }
      button.addEventListener('click', () => vuePanel.navigate(view.id));
      menu.append(button);
    }
  }

  await render();
  vuePanel.subscribeNavigation(view => {
    active = view;
    render();
  });
</script>
