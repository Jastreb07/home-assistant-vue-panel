<style data-vue-panel-css>

<script data-vue-panel-javascript>
  const menu = document.getElementById('menu');

  let active = await vuePanel.currentView();

  async function render() {
    /*
     * Config immer neu lesen.
     * Dadurch werden Änderungen an der Karten-Konfiguration
     * beim erneuten Rendern berücksichtigt.
     */
    const config = vuePanel.config;

    /*
     * Alte Ausrichtung entfernen und aktuelle setzen.
     * So können niemals gleichzeitig vertical und horizontal
     * auf dem Element vorhanden sein.
     */
    menu.classList.remove('vertical', 'horizontal');

    menu.classList.add(
      config.orientation === 'horizontal'
        ? 'horizontal'
        : 'vertical'
    );

    /*
     * Darstellung: Icon und Text, nur Icon oder nur Text.
     * Ältere Instanzen speichern stattdessen noch die beiden
     * Schalter showTitles/showIcons; die gelten als Rückfallebene.
     */
    const display = String(config.display || '');

    const showText =
      display === 'icon'
        ? false
        : display === 'text' || display === 'icon_text'
          ? true
          : config.showTitles !== false;

    const showIcon =
      display === 'text'
        ? false
        : display === 'icon' || display === 'icon_text'
          ? true
          : config.showIcons !== false;

    /*
     * Views ebenfalls neu laden, damit auch showSubviews
     * bei einer Konfigurationsänderung korrekt berücksichtigt wird.
     */
    const allViews = await vuePanel.listViews();

    /*
     * Eigene Menüeinträge gewinnen. Ohne konfigurierte Einträge
     * listet die Card automatisch alle Ansichten auf.
     */
    const configured = Array.isArray(config.items) ? config.items : [];

    const entries = configured.length
      ? configured.map(item => {
          const target =
            item && typeof item.view === 'string'
              ? allViews.find(view => view.id === item.view)
              : undefined;

          return {
            label:
              (item && typeof item.label === 'string' && item.label) ||
              target?.title ||
              '',
            icon:
              (item && typeof item.icon === 'string' && item.icon) ||
              target?.icon,
            view: target,
            depth:
              item && Number(item.depth) > 0
                ? Math.min(Math.floor(Number(item.depth)), 2)
                : 0
          };
        })
      : allViews
          .filter(view => config.showSubviews === true || !view.subview)
          .map(view => ({
            label: view.title,
            icon: view.icon,
            view,
            depth: 0
          }));

    menu.replaceChildren();

    for (const entry of entries) {
      const view = entry.view;

      /*
       * Überschriften ohne darstellbaren Inhalt würden nur
       * eine leere Fläche erzeugen und entfallen deshalb.
       */
      if (!view && !showText && !(showIcon && entry.icon)) continue;

      /*
       * Ein Eintrag ohne Ziel ist eine reine Überschrift
       * und darf deshalb nicht klickbar sein.
       */
      const element = document.createElement(view ? 'button' : 'div');

      if (view) element.type = 'button';

      element.className = 'item';
      element.dataset.depth = String(entry.depth);

      /*
       * Aktiv ist die View mit exakt passendem Pfad.
       * Liegt der aktive Pfad unterhalb dieser View,
       * ist sie der Parent der aktiven Unteransicht.
       */
      const isActive = Boolean(view) && active?.path === view.path;

      const isActiveParent =
        Boolean(view) &&
        !isActive &&
        Boolean(active?.path?.startsWith(`${view.path}/`));

      /*
       * Struktur: hat die View Kinder (parent)
       * bzw. liegt sie selbst unterhalb einer anderen View (child)?
       */
      const isParent =
        Boolean(view) &&
        allViews.some(
          other =>
            other.path !== view.path &&
            other.path.startsWith(`${view.path}/`)
        );

      const isChild = Boolean(view) && view.path.includes('/');

      element.classList.toggle('heading', !view);
      element.classList.toggle('active', isActive);
      element.classList.toggle('active-parent', isActiveParent);
      element.classList.toggle('parent', isParent);
      element.classList.toggle('child', isChild);
      element.classList.toggle('icon-only', !showText);

      /*
       * Ohne Text erklärt ein Tooltip den Eintrag.
       */
      if (!showText && entry.label) element.title = entry.label;

      /*
       * Titel
       */
      if (showText) {
        const label = document.createElement('span');

        label.textContent = entry.label;

        element.append(label);
      }

      /*
       * Icon. Ohne Text braucht jeder Eintrag ein Icon,
       * sonst bliebe die Schaltfläche leer.
       */
      const iconName = entry.icon || (showText ? '' : 'mdi:circle-outline');

      if (showIcon && iconName) {
        const icon = document.createElement('img');

        icon.alt = '';

        icon.src = await vuePanel.getIcon(iconName, {
          size: 56,
          color:
            getComputedStyle(document.documentElement)
              .getPropertyValue('--text-primary')
              .trim() || '#ffffff'
        });

        element.append(icon);
      }

      /*
       * Navigation
       */
      if (view) {
        element.addEventListener('click', () => {
          vuePanel.navigate(view.id);
        });
      }

      menu.append(element);
    }
  }

  await render();

  vuePanel.subscribeNavigation(view => {
    active = view;
    render();
  });
</script>
