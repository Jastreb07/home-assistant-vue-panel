<script data-vue-panel-javascript>
  const config = vuePanel.config;
  /* Lauftext nur, wenn der Text wirklich nicht in die Card passt */
  function applyTextScroll(element, settings) {
    if (!element) return;
    const overflow = element.scrollWidth - element.clientWidth;
    const scrolling = (settings || config).textScroll !== false && overflow > 1;
    element.classList.toggle('is-scrolling', scrolling);
    if (scrolling) element.style.setProperty('--vp-scroll-shift', `-${overflow}px`);
    else element.style.removeProperty('--vp-scroll-shift');
  }

  /* Status und optionales Attribut gemäß den Card-Einstellungen */
  function stateLine(entity, text, settings) {
    const values = settings || config;
    const parts = [];
    if (values.showState !== false) parts.push(text);
    if (values.showAttribute === true) {
      const attribute = String(values.attribute || '');
      const value = attribute ? entity?.attributes?.[attribute] : undefined;
      if (value !== undefined && value !== null && value !== '') parts.push(String(value));
    }
    return parts.filter(Boolean).join(' · ');
  }

  /* Ein einfacher Umschalter für jede Domain */
  async function toggleEntity(id) {
    if (!id) return;
    await vuePanel.callService('homeassistant', 'toggle', {}, {entity_id: id});
  }

  /*
   * Tipp-Aktionen: Tippen, Doppeltippen und Halten. "default" behält die
   * eingebaute Aktion der Card und öffnet beim Halten ohne eigene Aktion die
   * automatische Detailansicht; "more-info" öffnet die Detailansicht (Ziel ist
   * optional eine bestimmte Dialog-Card), "ha-more-info" das native
   * Home-Assistant-Popup und "popup" ein eigenes Vue-Panel-Popup. "assist"
   * braucht einen Home-Assistant-Dialog, den das Panel nicht öffnen kann.
   */
  function bindGestures(element, settings, handlers) {
    /* Das Panel speichert je Geste eine Aktion samt Ziel */
    const slotOf = gesture => (settings.actions || {})[gesture] || {};
    const actionOf = gesture => String(slotOf(gesture).action || 'default');

    const run = async gesture => {
      const action = actionOf(gesture);
      const target = String(slotOf(gesture).target || '');

      if (action === 'none' || action === 'assist') return;
      if (action === 'more-info') {
        return vuePanel.showDetail(target ? {card: target, entity: handlers.entityId} : {entity: handlers.entityId});
      }
      if (action === 'ha-more-info') {
        return handlers.entityId ? vuePanel.showNativeDetail(handlers.entityId) : undefined;
      }
      if (action === 'popup') return target ? vuePanel.openPopup(target) : undefined;
      if (action === 'default') {
        const handled = handlers.default ? handlers.default(gesture) : undefined;
        if (handled !== undefined) return handled;
        /* Ohne eigene Card-Aktion öffnet Halten die automatische Detailansicht */
        if (gesture === 'hold' && handlers.entityId) return vuePanel.showDetail({entity: handlers.entityId});
        return undefined;
      }
      if (action === 'toggle') return handlers.toggle ? handlers.toggle() : undefined;
      if (action === 'navigate') return target ? vuePanel.navigate(target) : undefined;
      if (action === 'url') {
        if (target) window.open(target, '_blank', 'noopener');
        return;
      }
      if (action === 'perform-action') {
        const [domain, service] = target.split('.');
        if (!domain || !service) return;
        await vuePanel.callService(domain, service, {}, handlers.entityId ? {entity_id: handlers.entityId} : {});
      }
    };

    const ignored = event => Boolean(handlers.ignore) && Boolean(event.target.closest(handlers.ignore));
    let holdTimer = null;
    let held = false;
    let taps = 0;

    element.addEventListener('pointerdown', event => {
      if (ignored(event)) return;
      held = false;
      holdTimer = setTimeout(() => {
        holdTimer = null;
        held = true;
        run('hold');
      }, 500);
    });

    for (const name of ['pointerup', 'pointercancel', 'pointerleave']) {
      element.addEventListener(name, () => {
        if (holdTimer) clearTimeout(holdTimer);
        holdTimer = null;
      });
    }

    element.addEventListener('click', event => {
      if (ignored(event)) return;
      if (held) {
        held = false;
        return;
      }
      const doubled = actionOf('double_tap');
      /* Ohne Doppeltipp-Aktion reagiert der einfache Tipp sofort */
      if (doubled === 'default' || doubled === 'none') {
        run('tap');
        return;
      }
      taps += 1;
      if (taps > 1) return;
      setTimeout(() => {
        const wasDoubled = taps > 1;
        taps = 0;
        run(wasDoubled ? 'double_tap' : 'tap');
      }, 250);
    });
  }

  const card = document.getElementById('card');
  const lightButton = document.getElementById('light-button');
  lightButton.title = vuePanel.t('translation.toggleLight');
  const lightIcon = document.getElementById('light-icon');
  const temperature = document.getElementById('temperature');
  const nameElement = document.getElementById('name');

  nameElement.textContent = String(config.name || vuePanel.t('translation.defaultName'));
  nameElement.hidden = config.showName === false;
  document.getElementById('icon').parentElement.hidden = config.showIcon === false;
  applyTextScroll(nameElement);
  document.getElementById('icon').src = await vuePanel.getIcon(String(config.icon || 'mdi:door-open'), {
    size: 64,
    color: '#737373'
  });
  document.getElementById('chevron').src = await vuePanel.getIcon('mdi:chevron-right', {size: 40, color: '#666666'});
  document.getElementById('chevron').hidden = !config.targetView;

  async function renderLight(entity) {
    const active = entity?.state === 'on';
    lightButton.classList.toggle('active', active);
    lightIcon.src = await vuePanel.getIcon(active ? 'mdi:lightbulb' : 'mdi:lightbulb-outline', {
      size: 48,
      color: active ? '#111111' : '#737373'
    });
  }

  async function renderTemperature(entity) {
    const text = entity ? `${entity.state} ${entity.attributes?.unit_of_measurement || '°C'}` : '';

    temperature.textContent = entity ? stateLine(entity, text) : '';
    applyTextScroll(temperature);
  }

  /* Der Kachel-Klick öffnet die Zielansicht, die Lampe bleibt eigenständig */
  bindGestures(card, config, {
    entityId: config.lightGroup ? String(config.lightGroup) : '',
    ignore: '#light-button',
    toggle: () => toggleEntity(String(config.lightGroup || '')),
    default: gesture => {
      if (gesture !== 'tap' || !config.targetView) return;
      vuePanel.navigate(String(config.targetView));
    }
  });
  lightButton.addEventListener('click', async event => {
    event.stopPropagation();
    if (config.lightGroup) {
      const entity = await vuePanel.getEntity(String(config.lightGroup));
      await vuePanel.callService('light', entity?.state === 'on' ? 'turn_off' : 'turn_on', {}, {entity_id: String(config.lightGroup)});
    }
  });
  lightButton.hidden = !config.lightGroup;
  if (config.lightGroup) {
    await renderLight(await vuePanel.getEntity(String(config.lightGroup)));
    vuePanel.subscribeEntity(String(config.lightGroup), renderLight);
  }
  if (config.temperatureEntity) {
    await renderTemperature(await vuePanel.getEntity(String(config.temperatureEntity)));
    vuePanel.subscribeEntity(String(config.temperatureEntity), renderTemperature);
  }
</script>
