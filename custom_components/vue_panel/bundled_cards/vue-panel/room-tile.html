<script data-vue-panel-config>
  const vuePanelCard = {
    "format": "vue-panel-card",
    "formatVersion": 2,
    "apiVersion": 1,
    "manufacturer": "vue-panel",
    "cardName": "room-tile",
    "name": "Raum",
    "description": "Öffnet eine Ansicht und kann Temperatur und Raumlicht anzeigen",
    "icon": "mdi:door-open",
    "group": "Vue Panel",
    "areas": [
      "dashboard",
      "sidebar",
      "header",
      "bottom"
    ],
    "capabilities": [
      "entity:read",
      "entity:subscribe",
      "icon:render",
      "service:call",
      "navigation:write"
    ],
    "defaultSize": {
      "cols": 1,
      "rows": 1,
      "width": 140,
      "height": 120
    },
    "defaultResponsive": {
      "mobile": true,
      "tablet": true,
      "desktop": true,
      "mobileMax": 767,
      "tabletMax": 1023
    },
    "fullRow": false,
    "variables": [
      {
        "key": "name",
        "label": "Raumname",
        "group": "Darstellung",
        "type": "string",
        "required": true,
        "default": "Raum"
      },
      {
        "key": "icon",
        "label": "Icon",
        "group": "Darstellung",
        "type": "icon",
        "required": false,
        "default": "mdi:door-open"
      },
      {
        "key": "targetView",
        "label": "Zielansicht",
        "group": "Verhalten",
        "type": "view",
        "required": false,
        "default": ""
      },
      {
        "key": "temperatureEntity",
        "label": "Temperatur-Entity",
        "type": "entity",
        "required": false,
        "domain": "sensor",
        "default": ""
      },
      {
        "key": "lightGroup",
        "label": "Lichtgruppe",
        "type": "entity",
        "required": false,
        "domain": "light",
        "default": ""
      }
    ]
  };
</script>

<template data-vue-panel-html>
  <article class="tile room-tile" id="card">
    <div class="head"><span class="tile__icon"><img id="icon" alt=""></span>
      <button id="light-button" title="Licht schalten"><img id="light-icon" alt=""></button>
    </div>
    <div class="tile__info">
      <div class="tile__name" id="name"></div>
      <div class="meta"><span id="temperature"></span><img id="chevron" alt=""></div>
    </div>
  </article>
</template>

<style data-vue-panel-css>
    .tile {
        width: 100%;
        height: 100%;
        min-height: 120px;
        padding: 14px 16px;
        border-radius: var(--card-radius);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        background: var(--card-bg);
        box-shadow: var(--card-shadow);
        color: var(--text-primary);
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        transition: transform .1s
    }

    .tile:active {
        transform: scale(.98)
    }

    .head {
        width: 100%;
        display: flex;
        justify-content: space-between
    }

    .tile__icon {
        width: 38px;

        place-items: center;

    .head button {

        line-height: 1.2;

        text-overflow: ellipsis
    }

    .meta {
        min-height: 13px;
        margin-top: 3px;
        display: flex;
        justify-content: space-between;

        font-size: 11px
    }

    .meta img {
        width: 16px;
        height: 16px
    }
</style>

<script data-vue-panel-javascript>
  const config = vuePanel.config;
  const card = document.getElementById('card');
  const lightButton = document.getElementById('light-button');
  const lightIcon = document.getElementById('light-icon');
  const temperature = document.getElementById('temperature');
  document.getElementById('name').textContent = String(config.name || 'Raum');
  document.getElementById('icon').src = await vuePanel.getIcon(String(config.icon || 'mdi:door-open'), {
    size: 64,
    color: '#737373'
  });
  document.getElementById('chevron').src = await vuePanel.getIcon('mdi:chevron-right', {size: 40, color: '#666666'});
  document.getElementById('chevron').hidden = !config.targetView;

  async function renderLight(entity) {
    const active = entity?.state === 'on';
    lightButton.classList.toggle('active', active);
    lightIcon.src = await vuePanel.getIcon(active ? 'mdi:lightbulb' : 'mdi:lightbulb-outline', {
      size: 48,
      color: active ? '#111111' : '#737373'
    });
  }

  async function renderTemperature(entity) {
    temperature.textContent = entity ? `${entity.state} ${entity.attributes?.unit_of_measurement || '°C'}` : '';
  }

  card.addEventListener('click', () => {
    if (config.targetView) vuePanel.navigate(String(config.targetView));
  });
  lightButton.addEventListener('click', async event => {
    event.stopPropagation();
    if (config.lightGroup) {
      const entity = await vuePanel.getEntity(String(config.lightGroup));
      await vuePanel.callService('light', entity?.state === 'on' ? 'turn_off' : 'turn_on', {}, {entity_id: String(config.lightGroup)});
    }
  });
  lightButton.hidden = !config.lightGroup;
  if (config.lightGroup) {
    await renderLight(await vuePanel.getEntity(String(config.lightGroup)));
    vuePanel.subscribeEntity(String(config.lightGroup), renderLight);
  }
  if (config.temperatureEntity) {
    await renderTemperature(await vuePanel.getEntity(String(config.temperatureEntity)));
    vuePanel.subscribeEntity(String(config.temperatureEntity), renderTemperature);
  }
</script>
