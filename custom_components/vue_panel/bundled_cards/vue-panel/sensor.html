<script data-vue-panel-javascript>
  const config = vuePanel.config;
  /* Ein einfacher Umschalter für jede Domain */
  async function toggleEntity(id) {
    if (!id) return;
    await vuePanel.callService('homeassistant', 'toggle', {}, {entity_id: id});
  }

  /*
   * Tipp-Aktionen: Tippen, Doppeltippen und Halten. "default" behält die
   * eingebaute Aktion der Card und öffnet beim Halten ohne eigene Aktion die
   * automatische Detailansicht; "more-info" öffnet die Detailansicht (Ziel ist
   * optional eine bestimmte Dialog-Card), "ha-more-info" das native
   * Home-Assistant-Popup und "popup" ein eigenes Vue-Panel-Popup. "assist"
   * braucht einen Home-Assistant-Dialog, den das Panel nicht öffnen kann.
   */
  function bindGestures(element, settings, handlers) {
    /* Das Panel speichert je Geste eine Aktion samt Ziel */
    const slotOf = gesture => (settings.actions || {})[gesture] || {};
    const actionOf = gesture => String(slotOf(gesture).action || 'default');

    const run = async gesture => {
      const action = actionOf(gesture);
      const target = String(slotOf(gesture).target || '');

      if (action === 'none' || action === 'assist') return;
      if (action === 'more-info') {
        return vuePanel.showDetail(target ? {card: target, entity: handlers.entityId} : {entity: handlers.entityId});
      }
      if (action === 'ha-more-info') {
        return handlers.entityId ? vuePanel.showNativeDetail(handlers.entityId) : undefined;
      }
      if (action === 'popup') return target ? vuePanel.openPopup(target) : undefined;
      if (action === 'default') {
        const handled = handlers.default ? handlers.default(gesture) : undefined;
        if (handled !== undefined) return handled;
        /* Ohne eigene Card-Aktion öffnet Halten die automatische Detailansicht */
        if (gesture === 'hold' && handlers.entityId) return vuePanel.showDetail({entity: handlers.entityId});
        return undefined;
      }
      if (action === 'toggle') return handlers.toggle ? handlers.toggle() : undefined;
      if (action === 'navigate') return target ? vuePanel.navigate(target) : undefined;
      if (action === 'url') {
        if (target) window.open(target, '_blank', 'noopener');
        return;
      }
      if (action === 'perform-action') {
        const [domain, service] = target.split('.');
        if (!domain || !service) return;
        await vuePanel.callService(domain, service, {}, handlers.entityId ? {entity_id: handlers.entityId} : {});
      }
    };

    const ignored = event => Boolean(handlers.ignore) && Boolean(event.target.closest(handlers.ignore));
    let holdTimer = null;
    let held = false;
    let taps = 0;

    element.addEventListener('pointerdown', event => {
      if (ignored(event)) return;
      held = false;
      holdTimer = setTimeout(() => {
        holdTimer = null;
        held = true;
        run('hold');
      }, 500);
    });

    for (const name of ['pointerup', 'pointercancel', 'pointerleave']) {
      element.addEventListener(name, () => {
        if (holdTimer) clearTimeout(holdTimer);
        holdTimer = null;
      });
    }

    element.addEventListener('click', event => {
      if (ignored(event)) return;
      if (held) {
        held = false;
        return;
      }
      const doubled = actionOf('double_tap');
      /* Ohne Doppeltipp-Aktion reagiert der einfache Tipp sofort */
      if (doubled === 'default' || doubled === 'none') {
        run('tap');
        return;
      }
      taps += 1;
      if (taps > 1) return;
      setTimeout(() => {
        const wasDoubled = taps > 1;
        taps = 0;
        run(wasDoubled ? 'double_tap' : 'tap');
      }, 250);
    });
  }

  const entityId = String(config.entity || '');
  const icon = document.getElementById('icon');
  const name = document.getElementById('name');
  const state = document.getElementById('state');

  async function render(entity) {
    name.textContent = String(config.name || entity?.attributes?.friendly_name || entityId || vuePanel.t('translation.defaultName'));
    state.textContent = !entityId ? vuePanel.t('translation.noEntity') : !entity ? vuePanel.t('translation.entityNotFound') : `${entity.state}${entity.attributes?.unit_of_measurement ? ` ${entity.attributes.unit_of_measurement}` : ''}`;
    icon.src = await vuePanel.getIcon(String(config.icon || entity?.attributes?.icon || 'mdi:gauge'), {
      size: 72,
      color: '#737373'
    });
  }

  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);

  /* Tipp-Aktionen auf der Card; die eigenen Bedienelemente bleiben unberührt */
  bindGestures(document.getElementById('card'), config, {
    entityId,
    toggle: () => toggleEntity(entityId)
  });
</script>
