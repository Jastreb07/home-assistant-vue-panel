  const heatFraction = document.getElementById('heat-fraction');
  const coolFraction = document.getElementById('cool-fraction');
  const currentMetric = document.getElementById('current-metric');
  const currentTemperature = document.getElementById('current-temperature');
  const humidityMetric = document.getElementById('humidity-metric');
  const humidity = document.getElementById('humidity');
  const warningIcon = document.getElementById('warning-icon');
  const windowIcon = document.getElementById('window-icon');
  const actionIcon = document.getElementById('action-icon');
  const selects = document.getElementById('selects');
  const modeSelect = {
    root: document.getElementById('mode-select'),
    trigger: document.getElementById('mode-trigger'),
    label: document.getElementById('mode-label'),
    caret: document.getElementById('mode-caret'),
    menu: document.getElementById('mode-menu'),
    svg: document.getElementById('mode-radial'),
    caption: vuePanel.t('translation.captions.mode')
  };
  const presetSelect = {
    root: document.getElementById('preset-select'),
    trigger: document.getElementById('preset-trigger'),
    label: document.getElementById('preset-label'),
    caret: document.getElementById('preset-caret'),
    menu: document.getElementById('preset-menu'),
    svg: document.getElementById('preset-radial'),
    caption: vuePanel.t('translation.captions.preset')
  };
  const scrim = document.getElementById('scrim');
  const hint = document.getElementById('hint');

  let entity = null;
  let windowSensor = null;
  let selectedTarget = 'low';
  let dragging = false;
  let dragPointerId = null;
  let dragOrigin = null;
  let draft = null;
  let commitTimer = null;
  const iconCache = new Map();
  const arcLength = arcTrack.getTotalLength();

  function attributes() {
    return (entity && entity.attributes) || {};
  }

  function number(value) {
    if (value === null || value === undefined || value === '') return Number.NaN;
    return Number(value);
  }

  function supports(feature) {
    return (Number(attributes().supported_features || 0) & feature) !== 0;
  }

  function isOpenValue(value) {
    if (value === true || value === 1) return true;
    return ['on', 'open', 'opened', 'true', '1'].includes(String(value ?? '').toLowerCase());
  }

  function hasContent(value) {
    if (value === null || value === undefined || value === false || value === '' || value === '[]' || value === '{}') return false;
    if (Array.isArray(value)) return value.length > 0;
    if (typeof value === 'object') return Object.keys(value).length > 0;
    try {
      const parsed = JSON.parse(String(value));
      return Array.isArray(parsed) ? parsed.length > 0 : parsed && typeof parsed === 'object' ? Object.keys(parsed).length > 0 : Boolean(parsed);
    } catch (error) {
      return true;
    }
  }

  function temperatureRange() {
    const unit = String(attributes().temperature_unit || '°C');
    const fahrenheit = unit.includes('F');
    const min = number(attributes().min_temp);
    const max = number(attributes().max_temp);
    const step = number(attributes().target_temp_step ?? attributes().bt_target_temp_step);
    return {
      unit,
      min: Number.isFinite(min) ? min : (fahrenheit ? 44 : 7),
      max: Number.isFinite(max) ? max : (fahrenheit ? 95 : 35),
      step: Number.isFinite(step) && step > 0 ? step : (fahrenheit ? 1 : 0.5)
    };
  }

  /*
   * Native Home Assistant liefert entweder `temperature` oder das Paar
   * `target_temp_low`/`target_temp_high`. Better Thermostat meldet seine
   * Kühlschwelle zusätzlich als `bt_preset_cool_temperature`.
   */
  function targetValues() {
    const low = number(attributes().target_temp_low);
    const high = number(attributes().target_temp_high ?? attributes().bt_preset_cool_temperature);
    const value = number(attributes().temperature);
    const range = (supports(FEATURE_RANGE) || (Number.isFinite(low) && Number.isFinite(high)))
      && Number.isFinite(low) && Number.isFinite(high);
    const limits = temperatureRange();
    return {
      range,
      low: Number.isFinite(low) ? low : Number.isFinite(value) ? value : limits.min,
      high: Number.isFinite(high) ? high : limits.max,
      value: Number.isFinite(value) ? value : Number.isFinite(low) ? low : limits.min
    };
  }

  function canAdjustTemperature() {
    const values = targetValues();
    return supports(FEATURE_TARGET)
      || supports(FEATURE_RANGE)
      || Number.isFinite(number(attributes().temperature))
      || values.range;
  }

  function fraction(value) {
    const limits = temperatureRange();
    return Math.max(0, Math.min(1, (value - limits.min) / Math.max(limits.step, limits.max - limits.min)));
  }

  function decimals() {
    const text = String(temperatureRange().step);
    return text.includes('.') ? Math.min(2, text.split('.')[1].length) : 0;
  }

  function format(value, fixed = true) {
    if (!Number.isFinite(value)) return '—';
    const digits = fixed ? decimals() : 1;
    return new Intl.NumberFormat(vuePanel.language || undefined, {
      minimumFractionDigits: fixed ? digits : 0,
      maximumFractionDigits: digits
    }).format(value);
  }

  /* Die Zielwerte stehen groß als ganze Zahl, Einheit und Nachkommastellen klein daneben */
  function splitNumber(value) {
    if (!Number.isFinite(value)) return {main: '—', fraction: ''};
    const digits = decimals();
    const parts = new Intl.NumberFormat(vuePanel.language || undefined, {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    }).formatToParts(value);
    let main = '';
    let rest = '';
    for (const part of parts) {
      if (part.type === 'decimal' || part.type === 'fraction') rest += part.value;
      else main += part.value;
    }
    return {main, fraction: rest};
  }

  function setSegment(path, from, to) {
    const start = Math.max(0, Math.min(1, from));
    const end = Math.max(start, Math.min(1, to));
    const length = (end - start) * arcLength;
    path.hidden = length < 0.5;
    path.style.strokeDasharray = `${length} ${arcLength + 1}`;
    path.style.strokeDashoffset = String(-start * arcLength);
  }

  function placeOnArc(element, value) {
    const angle = (ARC_START + Math.max(0, Math.min(1, value)) * ARC_SPAN) * Math.PI / 180;
    const x = CENTER_X + ARC_RADIUS * Math.cos(angle);
    const y = CENTER_Y + ARC_RADIUS * Math.sin(angle);
    element.style.left = `${x / VIEW_WIDTH * 100}%`;
    element.style.top = `${y / VIEW_HEIGHT * 100}%`;
  }

  function shownTargets() {
    return draft || targetValues();
  }

  function paintDial() {
    const values = shownTargets();
    const lowFraction = fraction(values.range ? values.low : values.value);
    const highFraction = fraction(values.high);
    const singleCoolMode = !values.range && entity?.state === 'cool';
    const unit = temperatureRange().unit;
    const heatParts = splitNumber(values.range ? values.low : values.value);
    const coolParts = splitNumber(values.high);
    heatValue.textContent = heatParts.main;
    heatFraction.textContent = heatParts.fraction;
    heatUnit.textContent = unit;
    coolValue.textContent = coolParts.main;
    coolFraction.textContent = coolParts.fraction;
    coolUnit.textContent = unit;
    coolTarget.hidden = !values.range;
    coolHandle.hidden = !values.range;
    heatTarget.classList.toggle('selected', selectedTarget !== 'high');
    coolTarget.classList.toggle('selected', selectedTarget === 'high');
    heatHandle.classList.toggle('selected', selectedTarget !== 'high');
    coolHandle.classList.toggle('selected', selectedTarget === 'high');
    heatArc.classList.toggle('arc-cool', singleCoolMode);
    heatHandle.classList.toggle('cool-handle', singleCoolMode);

    if (values.range) {
      setSegment(heatArc, 0, lowFraction);
      setSegment(coolArc, highFraction, 1);
      placeOnArc(heatHandle, lowFraction);
      placeOnArc(coolHandle, highFraction);
    } else {
      setSegment(heatArc, 0, lowFraction);
      coolArc.hidden = true;
      placeOnArc(heatHandle, lowFraction);
    }

    const current = number(attributes().current_temperature);
    currentDot.hidden = !Number.isFinite(current);
    if (Number.isFinite(current)) placeOnArc(currentDot, fraction(current));

    const selectedValue = values.range && selectedTarget === 'high' ? values.high : values.range ? values.low : values.value;
    dial.setAttribute('aria-label', selectedTarget === 'high' ? vuePanel.t('translation.coolTarget') : vuePanel.t('translation.heatTarget'));
    dial.setAttribute('aria-valuemin', String(temperatureRange().min));
    dial.setAttribute('aria-valuemax', String(temperatureRange().max));
    dial.setAttribute('aria-valuenow', String(selectedValue));
  }

  function roundToStep(value) {
    const limits = temperatureRange();
    const rounded = limits.min + Math.round((value - limits.min) / limits.step) * limits.step;
    return Math.max(limits.min, Math.min(limits.max, Number(rounded.toFixed(4))));
  }

  function pointerFraction(event) {
    const box = dial.getBoundingClientRect();
    const x = (event.clientX - box.left) / box.width * VIEW_WIDTH;
    const y = (event.clientY - box.top) / box.height * VIEW_HEIGHT;
    let angle = Math.atan2(y - CENTER_Y, x - CENTER_X) * 180 / Math.PI;
    if (angle < 0) angle += 360;
    const delta = (angle - ARC_START + 360) % 360;
    if (delta <= ARC_SPAN) return delta / ARC_SPAN;
    /* Unterhalb der Lücke gilt das jeweils nähere Ende des Bogens */
    return delta < ARC_SPAN + (360 - ARC_SPAN) / 2 ? 1 : 0;
  }

  function updateDraft(fractionValue) {
    const limits = temperatureRange();
    const value = roundToStep(limits.min + fractionValue * (limits.max - limits.min));
    const values = {...shownTargets()};
    if (values.range) {
      if (selectedTarget === 'high') values.high = Math.max(values.low + limits.step, value);
      else values.low = Math.min(values.high - limits.step, value);
    } else values.value = value;
    draft = values;
    paintDial();
  }

  async function commitTargets() {
    if (!entityId || !draft) return;
    const values = {...draft};
    if (values.range) {
      await vuePanel.callService('climate', 'set_temperature', {
        target_temp_low: values.low,
        target_temp_high: values.high
      }, {entity_id: entityId});
    } else {
      await vuePanel.callService('climate', 'set_temperature', {temperature: values.value}, {entity_id: entityId});
    }
  }

  function queueCommit() {
    if (commitTimer !== null) return;
    commitTimer = setTimeout(() => {
      commitTimer = null;
      commitTargets().catch(() => {});
    }, 180);
  }

  /* Alle Zeigergesten hängen am Trefferband des Bogens, nicht an der Dial-Fläche */
  arcHit.addEventListener('pointerdown', event => {
    if (!entity || event.button !== 0 || !canAdjustTemperature()) return;
    const pointer = pointerFraction(event);
    const values = shownTargets();
    if (values.range) {
      selectedTarget = Math.abs(pointer - fraction(values.low)) <= Math.abs(pointer - fraction(values.high)) ? 'low' : 'high';
    } else selectedTarget = 'value';
    dragging = true;
    dragPointerId = event.pointerId;
    dragOrigin = {x: event.clientX, y: event.clientY};
    dial.classList.add('is-pressed');
    arcHit.setPointerCapture(event.pointerId);
    /* Ein Tipp springt animiert auf die getippte Stelle */
    updateDraft(pointer);
    queueCommit();
  });

  /*
   * `touch-action` wird auf SVG-Elementen nicht überall beachtet. Ohne dieses
   * `preventDefault` beginnt der Browser beim Wischen über den Bogen zu scrollen
   * und bricht den Zug mit `pointercancel` ab — auf Touchgeräten ließe sich der
   * Griff dann gar nicht bewegen.
   */
  arcHit.addEventListener('touchstart', event => {
    if (entity && canAdjustTemperature()) event.preventDefault();
  }, {passive: false});

  arcHit.addEventListener('pointermove', event => {
    if (!dragging || event.pointerId !== dragPointerId) return;
    /* Erst ein echter Zug schaltet die Übergänge ab, damit er dem Finger folgt */
    if (dragOrigin && Math.hypot(event.clientX - dragOrigin.x, event.clientY - dragOrigin.y) > DRAG_THRESHOLD) {
      dragOrigin = null;
      dial.classList.add('is-dragging');
    }
    updateDraft(pointerFraction(event));
    queueCommit();
  });

  function endDrag(event) {
    if (!dragging || event.pointerId !== dragPointerId) return;
    dragging = false;
    dragPointerId = null;
    dragOrigin = null;
    dial.classList.remove('is-pressed', 'is-dragging');
    if (commitTimer !== null) {
      clearTimeout(commitTimer);
      commitTimer = null;
    }
    commitTargets().catch(() => {}).finally(() => {
      draft = null;
      paintDial();
    });
  }

  arcHit.addEventListener('pointerup', endDrag);
  arcHit.addEventListener('pointercancel', endDrag);
  arcHit.addEventListener('wheel', event => {
    if (!entity || !canAdjustTemperature()) return;
    event.preventDefault();
    const values = shownTargets();
    const current = values.range && selectedTarget === 'high' ? values.high : values.range ? values.low : values.value;
    const limits = temperatureRange();
    updateDraft(fraction(roundToStep(current + (event.deltaY < 0 ? limits.step : -limits.step))));
    commitTargets().catch(() => {});
  }, {passive: false});

  dial.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowDown', 'ArrowRight', 'ArrowUp'].includes(event.key) || !entity || !canAdjustTemperature()) return;
    event.preventDefault();
    const values = shownTargets();
    const current = values.range && selectedTarget === 'high' ? values.high : values.range ? values.low : values.value;
    const direction = ['ArrowRight', 'ArrowUp'].includes(event.key) ? 1 : -1;
    updateDraft(fraction(roundToStep(current + direction * temperatureRange().step)));
    commitTargets().catch(() => {});
  });

  heatTarget.addEventListener('click', () => {
    selectedTarget = targetValues().range ? 'low' : 'value';
    paintDial();
    dial.focus();
  });
  coolTarget.addEventListener('click', () => {
    selectedTarget = 'high';
    paintDial();
    dial.focus();
  });

  function iconSource(name, color = '#666666') {
    const key = `${name}-${color}`;
    if (!iconCache.has(key)) iconCache.set(key, vuePanel.getIcon(name, {size: 72, color}));
    return iconCache.get(key);
  }

  function modeLabel(mode) {
    const key = `translation.modes.${mode}`;
    const translated = vuePanel.t(key);
    return translated === key ? mode : translated;
  }

  function presetLabel(preset) {
    const key = `translation.presets.${preset}`;
    const translated = vuePanel.t(key);
    return translated === key ? preset.replace(/_/g, ' ') : translated;
  }

  /*
   * Beide Dropdowns teilen sich dieselbe Mechanik: Auslöser-Pille mit dem
   * aktuellen Wert, darunter eine Liste, aus der ein Klick den Dienst aufruft.
   */
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const MIN_SEGMENTS = 3;
  /* `stroke` muss der Strichbreite von `.slice` entsprechen, `gap` ist der sichtbare Abstand */
  const RADIAL = {size: 320, center: 160, hub: 60, inner: 80, outer: 146, stroke: 9, gap: 7};

  function svgNode(name, attributes = {}) {
    const node = document.createElementNS(SVG_NS, name);
    for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, String(value));
    return node;
  }

  function polar(radius, degrees) {
    const angle = (degrees - 90) * Math.PI / 180;
    return [RADIAL.center + radius * Math.cos(angle), RADIAL.center + radius * Math.sin(angle)];
  }

  /*
   * Ein Ringsegment von `from` bis `to` Grad. Der Einzug wird je Radius aus
   * einer festen Bogenlänge gerechnet — dadurch bleibt die Lücke zum Nachbarn
   * innen wie außen und bei jeder Segmentzahl gleich breit. Der gleichfarbige
   * Rand, der die Ecken rundet, ist dabei schon eingerechnet.
   */
  function wedgePath(from, to) {
    const inset = (RADIAL.gap + RADIAL.stroke) / 2;
    const limit = Math.max(0, (to - from) / 2 - 1);
    const outerOffset = Math.min(inset / RADIAL.outer * 180 / Math.PI, limit);
    const innerOffset = Math.min(inset / RADIAL.inner * 180 / Math.PI, limit);
    const [x1, y1] = polar(RADIAL.outer, from + outerOffset);
    const [x2, y2] = polar(RADIAL.outer, to - outerOffset);
    const [x3, y3] = polar(RADIAL.inner, to - innerOffset);
    const [x4, y4] = polar(RADIAL.inner, from + innerOffset);
    const large = to - from > 180 ? 1 : 0;
    return `M${x1} ${y1} A${RADIAL.outer} ${RADIAL.outer} 0 ${large} 1 ${x2} ${y2}`
      + ` L${x3} ${y3} A${RADIAL.inner} ${RADIAL.inner} 0 ${large} 0 ${x4} ${y4} Z`;
  }

  /* Lange Beschriftungen brechen auf zwei Zeilen um; der Schrägstrich trennt mit */
  function wrapLabel(text, maxChars) {
    const words = String(text).replace(/\//g, '/ ').split(/\s+/).filter(Boolean);
    const lines = [];
    let line = '';
    for (const word of words) {
      const candidate = line ? `${line} ${word}` : word;
      if (candidate.length > maxChars && line) {
        lines.push(line);
        line = word;
      } else line = candidate;
    }
    if (line) lines.push(line);
    return lines.slice(0, 2);
  }

  function appendLines(parent, lines, x, middle, lineHeight) {
    const top = middle - (lines.length - 1) * lineHeight / 2;
    lines.forEach((line, index) => {
      const span = svgNode('tspan', {x, y: (top + index * lineHeight).toFixed(1)});
      span.textContent = line.replace(/\/ $/, '/').trim();
      parent.appendChild(span);
    });
  }

  function setHub(select, text) {
    select.hubText.textContent = '';
    appendLines(select.hubText, wrapLabel(text || '—', 13), RADIAL.center, RADIAL.center + 6, 17);
  }

  /* Baut das Tortenmenü einer Auswahl neu auf */
  function buildRadial(select) {
    const options = select.options || [];
    const svg = select.svg;
    svg.textContent = '';
    if (!options.length) return;

    /* Der Ring bleibt ein Ring: zu kurze Listen füllen Platzhalter auf */
    const segments = options.slice();
    while (segments.length < MIN_SEGMENTS) segments.push({placeholder: true, label: ''});

    const step = 360 / segments.length;
    segments.forEach((option, index) => {
      const middle = index * step;
      const from = middle - step / 2;
      const to = middle + step / 2;
      const current = !option.placeholder && option.value === select.current;
      const group = svgNode('g', {
        class: 'wedge' + (current ? ' is-current' : '') + (option.placeholder ? ' is-placeholder' : ''),
        role: 'option',
        'aria-selected': String(current),
        'aria-disabled': String(Boolean(option.placeholder))
      });
      group.appendChild(svgNode('path', {class: 'slice', d: wedgePath(from, to)}));

      const [labelX, labelY] = polar((RADIAL.inner + RADIAL.outer) / 2, middle);
      const label = svgNode('text');
      appendLines(label, option.placeholder ? ['–'] : wrapLabel(option.label, 11), labelX.toFixed(1), labelY + 5, 16);
      group.appendChild(label);
      svg.appendChild(group);
      if (option.placeholder) return;

      group.addEventListener('pointerenter', () => setHub(select, option.label));
      group.addEventListener('pointerleave', () => setHub(select, select.hubDefault));
      group.addEventListener('click', event => {
        event.stopPropagation();
        closeMenus();
        select.onPick(option.value);
      });
    });

    const hub = svgNode('g', {class: 'hub'});
    hub.appendChild(svgNode('circle', {class: 'hub-plate', cx: RADIAL.center, cy: RADIAL.center, r: RADIAL.hub}));
    const caption = svgNode('text', {class: 'hub-caption', x: RADIAL.center, y: RADIAL.center - 26});
    caption.textContent = select.caption;
    hub.appendChild(caption);
    select.hubText = svgNode('text', {class: 'hub-text'});
    hub.appendChild(select.hubText);
    /* Ein Klick auf die Nabe schließt das Menü wieder */
    hub.addEventListener('click', event => {
      event.stopPropagation();
      closeMenus();
    });
    svg.appendChild(hub);
    setHub(select, select.hubDefault);
  }

  async function renderMenu(select, options, current, onPick, fallback = '') {
    const {root, trigger, label} = select;
    const selected = options.find(option => option.value === current);
    /* Steht der aktuelle Wert nicht in der Liste — etwa der Zustand „Aus“ —,
       zeigt die Pille den übersetzten Ersatztext */
    label.textContent = selected ? selected.label : (fallback || (current ? current.replace(/_/g, ' ') : '—'));
    trigger.title = label.textContent;
    applyTextScroll(label);
    root.hidden = options.length === 0;
    select.options = options;
    select.current = current;
    select.onPick = onPick;
    select.hubDefault = label.textContent;
    if (!select.menu.hidden) buildRadial(select);
  }

  /* Das Menü liegt mittig auf dem Bogen und skaliert mit ihm */
  function layoutMenu(select) {
    const box = dial.getBoundingClientRect();
    select.menu.style.left = `${box.left + box.width / 2}px`;
    select.menu.style.top = `${box.top + box.height * (CENTER_Y / VIEW_HEIGHT)}px`;
    const size = Math.round(Math.min(box.width, box.height) * 1.02);
    select.svg.setAttribute('width', String(size));
    select.svg.setAttribute('height', String(size));
  }

  /*
   * Lauftext nur, wenn die Beschriftung wirklich nicht in die Pille passt: die
   * Hülle klemmt und schneidet ab, der Text darin wandert.
   */
  function applyTextScroll(text) {
    const box = text.parentElement;
    if (!box) return;
    text.classList.remove('is-scrolling');
    const overflow = text.scrollWidth - box.clientWidth;
    const scrolling = overflow > 1;
    text.classList.toggle('is-scrolling', scrolling);
    if (scrolling) text.style.setProperty('--vp-scroll-shift', `-${overflow}px`);
    else text.style.removeProperty('--vp-scroll-shift');
  }

  /* Der Weichzeichner bekommt die Maße des Dialog-Bodys, sonst die der Card */
  function positionScrim() {
    const host = card.closest('.vp-dialog-body') || card;
    const box = host.getBoundingClientRect();
    scrim.style.top = `${box.top}px`;
    scrim.style.left = `${box.left}px`;
    scrim.style.width = `${box.width}px`;
    scrim.style.height = `${box.height}px`;
  }

  function setMenuOpen(select, open) {
    select.root.classList.toggle('is-open', open);
    select.menu.hidden = !open;
    select.trigger.setAttribute('aria-expanded', String(open));
    /* Solange eine Liste offen ist, liegt der Weichzeichner über dem Dialoginhalt */
    if (open) {
      positionScrim();
      buildRadial(select);
      layoutMenu(select);
    }
    scrim.hidden = modeSelect.menu.hidden && presetSelect.menu.hidden;
  }

  function closeMenus() {
    setMenuOpen(modeSelect, false);
    setMenuOpen(presetSelect, false);
  }

  for (const select of [modeSelect, presetSelect]) {
    select.trigger.addEventListener('click', event => {
      event.stopPropagation();
      const open = select.menu.hidden;
      closeMenus();
      setMenuOpen(select, open);
    });
  }

  document.addEventListener('click', event => {
    if (!event.target.closest('.select, .menu')) closeMenus();
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !scrim.hidden) closeMenus();
  });

  window.addEventListener('resize', () => {
    if (scrim.hidden) return;
    positionScrim();
    for (const select of [modeSelect, presetSelect]) {
      if (!select.menu.hidden) layoutMenu(select);
    }
  });

  async function renderSelects() {
    /*
     * Das Ausschalten steckt im Betriebsart-Menü. Meldet eine Entity `off`
     * nicht unter `hvac_modes`, hängen wir den Eintrag an und schalten dann
     * über `climate.turn_off`.
     */
    const declared = Array.isArray(attributes().hvac_modes) ? attributes().hvac_modes.map(String) : [];
    const modes = declared.includes('off') || !supports(FEATURE_TURN_OFF) ? declared : [...declared, 'off'];
    await renderMenu(
      modeSelect,
      modes.map(mode => ({value: mode, label: modeLabel(mode)})),
      String(entity?.state || ''),
      mode => {
        if (mode === 'off' && !declared.includes('off')) {
          return vuePanel.callService('climate', 'turn_off', {}, {entity_id: entityId}).catch(() => {});
        }
        if (mode !== 'off' && entity?.state === 'off' && !declared.includes('off') && supports(FEATURE_TURN_ON)) {
          return vuePanel.callService('climate', 'turn_on', {}, {entity_id: entityId})
            .then(() => vuePanel.callService('climate', 'set_hvac_mode', {hvac_mode: mode}, {entity_id: entityId}))
            .catch(() => {});
        }
        return vuePanel.callService('climate', 'set_hvac_mode', {hvac_mode: mode}, {entity_id: entityId}).catch(() => {});
      },
      statusLabel(entity)
    );

    const presets = Array.isArray(attributes().preset_modes) ? attributes().preset_modes.map(String) : [];
    await renderMenu(
      presetSelect,
      presets.map(preset => ({value: preset, label: presetLabel(preset)})),
      String(attributes().preset_mode || ''),
      preset => vuePanel.callService('climate', 'set_preset_mode', {preset_mode: preset}, {entity_id: entityId}).catch(() => {})
    );

    /* Fehlt eine der beiden Listen, ist die verbliebene wieder rundum abgerundet */
    selects.classList.toggle('is-single', presetSelect.root.hidden || modeSelect.root.hidden);

    card.classList.toggle('is-on', Boolean(entity) && !['off', 'unavailable', 'unknown'].includes(entity.state));
  }

  /* Die Zustandszeile zeigt die eingestellte Betriebsart … */
  function statusLabel(value) {
    const mode = String(value?.state || '');
    const stateKey = `translation.states.${mode}`;
    const translatedState = vuePanel.t(stateKey);
    if (translatedState !== stateKey) return translatedState;
    return modeLabel(mode);
  }

  /* … das Icon in der Hinweiszeile dagegen, was das Gerät gerade tut */
  function actionIconFor(action) {
    return {
      heating: ['mdi:fire', '#f57c00'],
      preheating: ['mdi:fire-alert', '#fb8c00'],
      cooling: ['mdi:snowflake', '#039be5'],
      defrosting: ['mdi:snowflake-melt', '#4fc3f7'],
      drying: ['mdi:water-percent', '#26a69a'],
      fan: ['mdi:fan', '#26a69a'],
      idle: ['mdi:sleep', '#9e9e9e'],
      off: ['mdi:power', '#9e9e9e']
    }[action] || ['mdi:thermostat', '#9e9e9e'];
  }

  function actionLabel(value) {
    const action = String(value?.attributes?.hvac_action || '');
    if (!action) return '';
    const key = `translation.actions.${action}`;
    const translated = vuePanel.t(key);
    return translated === key ? action.replace(/_/g, ' ') : translated;
  }

  async function update() {
    if (!entityId || !entity) {
      hint.hidden = false;
      hint.textContent = vuePanel.t(entityId ? 'translation.entityNotFound' : 'translation.noEntity');
      dial.hidden = true;
      selects.hidden = true;
      closeMenus();
      return;
    }

    hint.hidden = true;
    dial.hidden = false;
    selects.hidden = false;
    dial.classList.toggle('is-enabled', canAdjustTemperature());
    dial.setAttribute('aria-disabled', String(!canAdjustTemperature()));

    const current = number(attributes().current_temperature);
    const currentHumidity = number(attributes().current_humidity ?? attributes().humidity);
    currentMetric.hidden = !Number.isFinite(current);
    currentTemperature.textContent = Number.isFinite(current) ? `${format(current, false)} ${temperatureRange().unit}` : '—';
    humidityMetric.hidden = !Number.isFinite(currentHumidity);
    humidity.textContent = Number.isFinite(currentHumidity) ? `${format(currentHumidity, false)} %` : '—';
    const currentAction = String(attributes().hvac_action || '');
    actionIcon.hidden = !currentAction;
    if (currentAction) {
      const [icon, color] = actionIconFor(currentAction);
      const label = actionLabel(entity);
      actionIcon.src = await iconSource(icon, color);
      actionIcon.alt = label;
      actionIcon.title = label;
    }

    /* Better Thermostat meldet Fenster und Störungen über eigene Attribute */
    const windowOpen = windowSensorId
      ? isOpenValue(windowSensor?.state)
      : isOpenValue(attributes().window_open) || isOpenValue(attributes().door_open);
    const degraded = attributes().degraded_mode === true
      || hasContent(attributes().unavailable_sensors)
      || hasContent(attributes().devices_errors);
    windowIcon.hidden = !windowOpen;
    warningIcon.hidden = !degraded;
    windowIcon.title = vuePanel.t('translation.windowOpen');
    warningIcon.title = vuePanel.t('translation.degraded');

    paintDial();
    await renderSelects();
  }

  async function render(next) {
    entity = next;
    if (!dragging) draft = null;
    await update();
  }

  const [temperatureIcon, humidityIcon, openedWindowIcon, degradedIcon] = await Promise.all([
    iconSource('mdi:thermometer', '#1599ed'),
    iconSource('mdi:water-percent', '#76a9d6'),
    iconSource('mdi:window-open-variant', '#1599ed'),
    iconSource('mdi:alert', '#ff9800')
  ]);
  modeSelect.caret.src = await iconSource('mdi:chevron-down', '#666666');
  presetSelect.caret.src = modeSelect.caret.src;

  document.getElementById('temperature-icon').src = temperatureIcon;
  document.getElementById('humidity-icon').src = humidityIcon;
  windowIcon.src = openedWindowIcon;
  warningIcon.src = degradedIcon;

  if (windowSensorId) windowSensor = await vuePanel.getEntity(windowSensorId);
  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);
  if (windowSensorId) {
    vuePanel.subscribeEntity(windowSensorId, next => {
      windowSensor = next;
      update();
    });
  }
</script>
