<script data-vue-panel-javascript>
  const config = vuePanel.config;
  /* Ein einfacher Umschalter für jede Domain */
  async function toggleEntity(id) {
    if (!id) return;
    await vuePanel.callService('homeassistant', 'toggle', {}, {entity_id: id});
  }

  /*
   * Tipp-Aktionen: Tippen, Doppeltippen und Halten. "default" behält die
   * eingebaute Aktion der Card und öffnet beim Halten ohne eigene Aktion die
   * automatische Detailansicht; "more-info" öffnet die Detailansicht (Ziel ist
   * optional eine bestimmte Dialog-Card), "ha-more-info" das native
   * Home-Assistant-Popup und "popup" ein eigenes Vue-Panel-Popup. "assist"
   * braucht einen Home-Assistant-Dialog, den das Panel nicht öffnen kann.
   */
  function bindGestures(element, settings, handlers) {
    /* Das Panel speichert je Geste eine Aktion samt Ziel */
    const slotOf = gesture => (settings.actions || {})[gesture] || {};
    const actionOf = gesture => String(slotOf(gesture).action || 'default');

    const run = async gesture => {
      const action = actionOf(gesture);
      const target = String(slotOf(gesture).target || '');

      if (action === 'none' || action === 'assist') return;
      if (action === 'more-info') {
        return vuePanel.showDetail(target ? {card: target, entity: handlers.entityId} : {entity: handlers.entityId});
      }
      if (action === 'ha-more-info') {
        return handlers.entityId ? vuePanel.showNativeDetail(handlers.entityId) : undefined;
      }
      if (action === 'popup') return target ? vuePanel.openPopup(target) : undefined;
      if (action === 'default') {
        const handled = handlers.default ? handlers.default(gesture) : undefined;
        if (handled !== undefined) return handled;
        /* Ohne eigene Card-Aktion öffnet Halten die automatische Detailansicht */
        if (gesture === 'hold' && handlers.entityId) return vuePanel.showDetail({entity: handlers.entityId});
        return undefined;
      }
      if (action === 'toggle') return handlers.toggle ? handlers.toggle() : undefined;
      if (action === 'navigate') return target ? vuePanel.navigate(target) : undefined;
      if (action === 'url') {
        if (target) window.open(target, '_blank', 'noopener');
        return;
      }
      if (action === 'perform-action') {
        const [domain, service] = target.split('.');
        if (!domain || !service) return;
        await vuePanel.callService(domain, service, {}, handlers.entityId ? {entity_id: handlers.entityId} : {});
      }
    };

    const ignored = event => Boolean(handlers.ignore) && Boolean(event.target.closest(handlers.ignore));
    let holdTimer = null;
    let held = false;
    let taps = 0;

    element.addEventListener('pointerdown', event => {
      if (ignored(event)) return;
      held = false;
      holdTimer = setTimeout(() => {
        holdTimer = null;
        held = true;
        run('hold');
      }, 500);
    });

    for (const name of ['pointerup', 'pointercancel', 'pointerleave']) {
      element.addEventListener(name, () => {
        if (holdTimer) clearTimeout(holdTimer);
        holdTimer = null;
      });
    }

    element.addEventListener('click', event => {
      if (ignored(event)) return;
      if (held) {
        held = false;
        return;
      }
      const doubled = actionOf('double_tap');
      /* Ohne Doppeltipp-Aktion reagiert der einfache Tipp sofort */
      if (doubled === 'default' || doubled === 'none') {
        run('tap');
        return;
      }
      taps += 1;
      if (taps > 1) return;
      setTimeout(() => {
        const wasDoubled = taps > 1;
        taps = 0;
        run(wasDoubled ? 'double_tap' : 'tap');
      }, 250);
    });
  }

  const entityId = String(config.entity || '');
  const windowSensorId = String(config.windowSensor || '');
  const card = document.getElementById('card');
  const name = document.getElementById('name');
  const state = document.getElementById('state');
  const icon = document.getElementById('icon');
  const iconWrap = document.getElementById('icon-wrap');
  const targets = document.getElementById('targets');
  const topPrimaryRow = document.getElementById('top-primary-row');
  const topPrimaryIcon = document.getElementById('top-primary-icon');
  const topPrimaryTemperature = document.getElementById('top-primary-temperature');
  const coolingTargetRow = document.getElementById('cooling-target-row');
  const coolingTargetIcon = document.getElementById('cooling-target-icon');
  const coolingTargetTemperature = document.getElementById('cooling-target-temperature');
  const metrics = document.getElementById('metrics');
  const mainTemperatureMetric = document.getElementById('main-temperature-metric');
  const mainTemperatureIcon = document.getElementById('temperature-icon');
  const mainTemperature = document.getElementById('main-temperature');
  const humidity = document.getElementById('humidity');
  const humidityMetric = document.getElementById('humidity-metric');
  const windowMetric = document.getElementById('window-metric');
  const info = document.getElementById('info');
  let thermostatEntity = null;
  let windowSensorEntity = null;
  const [thermostatIcon, thermometerIcon, heatIcon, activeHeatIcon, coolIcon, activeCoolIcon] = await Promise.all([
    vuePanel.getIcon('mdi:thermostat', {size: 64, color: '#737373'}),
    vuePanel.getIcon('mdi:thermometer', {size: 32, color: '#3f3f3f'}),
    vuePanel.getIcon('mdi:fire', {size: 32, color: '#737373'}),
    vuePanel.getIcon('mdi:fire', {size: 32, color: '#f57c00'}),
    vuePanel.getIcon('mdi:snowflake', {size: 32, color: '#737373'}),
    vuePanel.getIcon('mdi:snowflake', {size: 32, color: '#039be5'})
  ]);
  icon.src = thermostatIcon;
  mainTemperatureIcon.src = thermometerIcon;
  document.getElementById('humidity-icon').src = await vuePanel.getIcon('mdi:water-percent', {size: 32, color: '#3f3f3f'});
  document.getElementById('window-icon').src = await vuePanel.getIcon('mdi:window-open-variant', {size: 32, color: '#039be5'});
  windowMetric.title = vuePanel.t('translation.windowOpen');
  windowMetric.setAttribute('role', 'img');
  windowMetric.setAttribute('aria-label', vuePanel.t('translation.windowOpen'));

  function isOpenValue(value) {
    if (value === true || value === 1) return true;
    return ['on', 'open', 'opened', 'true', '1'].includes(String(value ?? '').toLowerCase());
  }

  async function render(value) {
    thermostatEntity = value;
    const hvacAction = String(value?.attributes?.hvac_action || '');
    const heating = hvacAction === 'heating';
    const cooling = hvacAction === 'cooling';
    name.textContent = String(config.name || value?.attributes?.friendly_name || entityId || vuePanel.t('translation.defaultName'));
    const numericAttribute = raw => raw === null || raw === undefined || raw === '' ? Number.NaN : Number(raw);
    const current = numericAttribute(value?.attributes?.current_temperature);
    const target = numericAttribute(value?.attributes?.temperature);
    const targetLow = numericAttribute(value?.attributes?.target_temp_low);
    const targetHigh = numericAttribute(value?.attributes?.target_temp_high);
    const presetCoolingTarget = numericAttribute(value?.attributes?.bt_preset_cool_temperature);
    const currentHumidity = numericAttribute(value?.attributes?.current_humidity ?? value?.attributes?.humidity);
    const temperatureUnit = String(value?.attributes?.temperature_unit || '°C');
    const configuredDecimals = Number(config.decimalPlaces);
    const decimalPlaces = Number.isFinite(configuredDecimals) ? Math.min(3, Math.max(0, Math.round(configuredDecimals))) : 1;
    const formatNumber = number => number.toFixed(decimalPlaces);
    const currentText = Number.isFinite(current) ? `${formatNumber(current)}${temperatureUnit}` : '–';
    const heatingTarget = Number.isFinite(targetLow) ? targetLow : target;
    const coolingTarget = Number.isFinite(targetHigh) ? targetHigh : presetCoolingTarget;
    const heatingText = Number.isFinite(heatingTarget) ? `${formatNumber(heatingTarget)}${temperatureUnit}` : '';
    const coolingText = Number.isFinite(coolingTarget) ? `${formatNumber(coolingTarget)}${temperatureUnit}` : '';
    const swapped = config.swapTemperatures === true;
    const showCurrent = config.showCurrentTemperature !== false;
    const showHeating = config.showTargetTemperature !== false;
    const showCooling = config.showCoolingTemperature !== false;
    const topPrimaryText = swapped ? currentText : heatingText;
    const mainText = swapped ? heatingText : currentText;
    const showTopPrimary = swapped ? showCurrent : showHeating;
    const showMain = swapped ? showHeating : showCurrent;
    topPrimaryTemperature.textContent = topPrimaryText;
    topPrimaryRow.hidden = !showTopPrimary || !topPrimaryText;
    topPrimaryRow.classList.toggle('is-heating', !swapped && heating);
    topPrimaryIcon.src = swapped ? thermometerIcon : heating ? activeHeatIcon : heatIcon;
    coolingTargetTemperature.textContent = coolingText;
    coolingTargetRow.hidden = !showCooling || !coolingText;
    coolingTargetRow.classList.toggle('is-cooling', cooling);
    coolingTargetIcon.src = cooling ? activeCoolIcon : coolIcon;
    targets.hidden = topPrimaryRow.hidden && coolingTargetRow.hidden;
    mainTemperature.textContent = mainText;
    mainTemperatureMetric.hidden = !showMain || !mainText;
    mainTemperatureMetric.classList.toggle('is-heating', swapped && heating);
    mainTemperatureIcon.src = swapped ? heating ? activeHeatIcon : heatIcon : thermometerIcon;
    humidityMetric.hidden = config.showHumidity === false || !Number.isFinite(currentHumidity);
    humidity.textContent = Number.isFinite(currentHumidity) ? `${formatNumber(currentHumidity)}%` : '';
    const windowOpen = windowSensorId
      ? isOpenValue(windowSensorEntity?.state)
      : isOpenValue(value?.attributes?.window_open);
    windowMetric.hidden = config.showWindowOpen === false || !windowOpen;
    iconWrap.hidden = config.showIcon === false;
    name.hidden = config.showName === false;
    state.hidden = config.showState === false;
    metrics.hidden = mainTemperatureMetric.hidden && humidityMetric.hidden && windowMetric.hidden;
    info.hidden = name.hidden && state.hidden;
    const stateLabels = {
      off: vuePanel.t('translation.states.off'),
      heating: vuePanel.t('translation.heating'),
      cooling: vuePanel.t('translation.states.cooling'),
      idle: vuePanel.t('translation.states.idle'),
      auto: vuePanel.t('translation.states.auto'),
      dry: vuePanel.t('translation.states.dry'),
      fan_only: vuePanel.t('translation.states.fanOnly'),
      heat_cool: vuePanel.t('translation.states.heatCool')
    };
    const status = hvacAction && hvacAction !== 'off' ? hvacAction : String(value?.state || '');
    state.textContent = !entityId
      ? vuePanel.t('translation.noEntity')
      : !value
        ? vuePanel.t('translation.entityNotFound')
        : stateLabels[status] || status;
  }
  if (windowSensorId) windowSensorEntity = await vuePanel.getEntity(windowSensorId);
  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);
  if (windowSensorId) {
    vuePanel.subscribeEntity(windowSensorId, value => {
      windowSensorEntity = value;
      render(thermostatEntity);
    });
  }

  /* Tap actions apply to the complete compact tile. */
  bindGestures(card, config, {
    entityId,
    toggle: () => toggleEntity(entityId)
  });
</script>
