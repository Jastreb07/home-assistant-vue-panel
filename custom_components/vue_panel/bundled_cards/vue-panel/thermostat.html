<template data-vue-panel-html>

<script data-vue-panel-javascript>
  const config = vuePanel.config;
  const entityId = String(config.entity || '');
  const card = document.getElementById('card');
  const name = document.getElementById('name');
  const state = document.getElementById('state');
  const icon = document.getElementById('icon');
  const target = document.getElementById('target');
  const targetValue = document.getElementById('target-value');
  let entity = null;
  document.getElementById('minus').src = await vuePanel.getIcon('mdi:minus', {size: 48, color: '#111111'});
  document.getElementById('plus').src = await vuePanel.getIcon('mdi:plus', {size: 48, color: '#111111'});

  async function render(value) {
    entity = value;
    const heating = value?.attributes?.hvac_action === 'heating';
    card.classList.toggle('active', heating);
    name.textContent = String(config.name || value?.attributes?.friendly_name || entityId || 'Thermostat');
    const current = Number(value?.attributes?.current_temperature);
    state.textContent = !entityId ? 'Keine Entity ausgewählt' : !value ? 'Entity nicht gefunden' : `${Number.isFinite(current) ? `${current} °` : '–'}${value.state === 'off' ? ' · Aus' : heating ? ' · Heizen' : ''}`;
    const desired = Number(value?.attributes?.temperature);
    target.hidden = !Number.isFinite(desired);
    targetValue.textContent = Number.isFinite(desired) ? `${desired} °` : '';
    icon.src = await vuePanel.getIcon(heating ? 'mdi:fire' : 'mdi:thermostat', {
      size: 64,
      color: heating ? '#111111' : '#737373'
    });
  }

  target.addEventListener('click', async event => {
    const button = event.target.closest('button');
    const desired = Number(entity?.attributes?.temperature);
    if (!button || !Number.isFinite(desired)) return;
    const step = Number(config.step) || .5;
    await vuePanel.callService('climate', 'set_temperature', {temperature: Math.round((desired + Number(button.dataset.direction) * step) * 10) / 10}, {entity_id: entityId});
  });
  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);
</script>
