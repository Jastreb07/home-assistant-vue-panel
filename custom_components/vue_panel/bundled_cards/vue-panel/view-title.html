<style data-vue-panel-css>
    .view-title-card {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        min-width: 0;
        min-height: 0;
        color: var(--text-primary);
    }

    .view-title-card__icon {
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
    }

    /*
     * `display: flex` above beats the browser rule for [hidden] — without
     * this the icon would stay visible once switched off.
     */
    .view-title-card__icon[hidden] {
        display: none;
    }

    /*
     * The DOM order is icon then text; `order` flips it so the icon can sit
     * on either side without rebuilding the markup.
     */
    .view-title-card.icon-after .view-title-card__icon {
        order: 1;
    }

    .view-title-card__text {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.2;
    }
</style>

<script data-vue-panel-javascript>
  const card = document.getElementById('card');
  const iconElement = document.getElementById('icon');
  const titleElement = document.getElementById('title');

  /*
   * Only the newest run may write: switching views re-renders while the
   * previous icon request is still pending, and the older answer must not
   * overwrite the newer title.
   */
  let renderToken = 0;

  async function render(view) {
    const token = ++renderToken;
    const config = vuePanel.config;

    const showIcon = config.showIcon !== false;
    const iconPosition = String(config.iconPosition || 'before');

    card.classList.toggle('icon-after', iconPosition === 'after');

    titleElement.textContent = view?.title || '';

    const iconName = showIcon ? view?.icon : '';

    if (!iconName) {
      iconElement.hidden = true;
      return;
    }

    const source = await vuePanel.getIcon(String(iconName), {
      size: 48,
      color:
        getComputedStyle(document.documentElement)
          .getPropertyValue('--text-primary')
          .trim() || '#ffffff'
    });

    /* A newer run took over — discard this one */
    if (token !== renderToken) return;

    iconElement.src = source;
    iconElement.hidden = false;
  }

  await render(await vuePanel.currentView());

  vuePanel.subscribeNavigation(view => {
    render(view);
  });
</script>
