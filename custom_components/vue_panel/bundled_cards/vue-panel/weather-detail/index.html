<script data-vue-panel-javascript>
  const config = vuePanel.config;
  const entityId = String(config.entity || '');

  const icon = document.getElementById('icon');
  const condition = document.getElementById('condition');
  const updated = document.getElementById('updated');
  const temperature = document.getElementById('temperature');
  const range = document.getElementById('range');
  const attributesList = document.getElementById('attributes');
  const forecastSection = document.getElementById('forecast-section');
  const forecastTitle = document.getElementById('forecast-title');
  const tabs = document.getElementById('tabs');
  const forecastGrid = document.getElementById('forecast');
  const forecastEmpty = document.getElementById('forecast-empty');
  const attribution = document.getElementById('attribution');

  /*
   * Animated Meteocons shipped in this card's own assets folder (MIT, see
   * assets/meteocons/LICENSE). They animate through native <animate>
   * elements, so a plain <img> plays them without any script — and being
   * local files they also work on a panel without internet access.
   */
  const animatedIcons = {
    'clear-night': 'clear-night',
    cloudy: 'cloudy',
    fog: 'fog',
    hail: 'hail',
    lightning: 'thunderstorms',
    'lightning-rainy': 'thunderstorms-rain',
    partlycloudy: 'partly-cloudy-day',
    pouring: 'extreme-rain',
    rainy: 'rain',
    snowy: 'snow',
    'snowy-rainy': 'sleet',
    sunny: 'clear-day',
    windy: 'wind',
    'windy-variant': 'wind',
    exceptional: 'not-available'
  };

  const labels = {
    'clear-night': vuePanel.t('translation.conditions.clearNight'),
    cloudy: vuePanel.t('translation.conditions.cloudy'),
    fog: vuePanel.t('translation.conditions.fog'),
    hail: vuePanel.t('translation.conditions.hail'),
    lightning: vuePanel.t('translation.conditions.lightning'),
    'lightning-rainy': vuePanel.t('translation.conditions.lightningRainy'),
    partlycloudy: vuePanel.t('translation.conditions.partlycloudy'),
    pouring: vuePanel.t('translation.conditions.pouring'),
    rainy: vuePanel.t('translation.conditions.rainy'),
    snowy: vuePanel.t('translation.conditions.snowy'),
    'snowy-rainy': vuePanel.t('translation.conditions.snowyRainy'),
    sunny: vuePanel.t('translation.conditions.sunny'),
    windy: vuePanel.t('translation.conditions.windy'),
    'windy-variant': vuePanel.t('translation.conditions.windy'),
    exceptional: vuePanel.t('translation.conditions.exceptional')
  };

  function iconUrl(state) {
    const file = animatedIcons[String(state || '')] || animatedIcons.exceptional;
    return vuePanel.asset('assets/meteocons/' + file + '.svg');
  }

  /*
   * A weather entity reports far more often than its condition changes, and
   * reassigning `src` restarts an animated SVG. Each <img> therefore keeps
   * the icon it shows and is only rewritten on a real change.
   */
  const iconKeys = new WeakMap();

  function setIcon(element, key, source) {
    if (iconKeys.get(element) === key) return;
    iconKeys.set(element, key);
    element.src = source;
  }

  function number(value) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : null;
  }

  /* Locale-aware numbers — "1.021,6 hPa" in German, "1,021.6 hPa" in English */
  function formatNumber(value, digits = 1) {
    return value.toLocaleString(vuePanel.language, {
      minimumFractionDigits: 0,
      maximumFractionDigits: digits
    });
  }

  function formatTemperature(value, unit, digits = 1) {
    const parsed = number(value);
    return parsed === null ? null : formatNumber(parsed, digits) + ' ' + unit;
  }

  /** "17 hours ago" — how long the entity has been reporting this state. */
  function relativeTime(stamp) {
    const time = stamp ? new Date(stamp).getTime() : Number.NaN;
    if (!Number.isFinite(time)) return '';
    const seconds = Math.round((Date.now() - time) / 1000);
    if (seconds < 60) return vuePanel.t('translation.justNow');

    const steps = [
      ['minute', 60],
      ['hour', 3600],
      ['day', 86400],
      ['week', 604800],
      ['month', 2592000],
      ['year', 31536000]
    ];
    let unit = 'minute';
    let size = 60;
    for (const [name, length] of steps) {
      if (seconds < length) break;
      unit = name;
      size = length;
    }
    const amount = Math.floor(seconds / size);
    /*
     * `Intl.RelativeTimeFormat` phrases the distance itself, but only the
     * bare amount is wanted here — the card's own string supplies the
     * "… ago" wording so both languages read naturally.
     */
    const parts = new Intl.RelativeTimeFormat(vuePanel.language, {numeric: 'always'})
      .formatToParts(-amount, unit);
    const text = parts
      .filter(part => part.type !== 'literal' || part.value.trim())
      .map(part => part.value)
      .join('')
      .replace(/^(vor|in)\s+/i, '')
      .replace(/\s+(ago|später)$/i, '')
      .trim();
    return vuePanel.t('translation.updatedAgo').replace('{value}', text);
  }

  /* Compass direction of a wind bearing, so the value reads as a direction */
  const COMPASS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

  function windDirection(bearing) {
    const parsed = number(bearing);
    if (parsed === null) return '';
    const index = Math.round((((parsed % 360) + 360) % 360) / 45) % COMPASS.length;
    return COMPASS[index];
  }

  /** One "icon — label — value" row; missing values are skipped entirely. */
  async function attributeRow(iconName, label, value) {
    if (!value) return [];
    const image = document.createElement('img');
    image.alt = '';
    image.src = await vuePanel.getIcon(iconName, {size: 44, color: '#8a94a6'});

    const caption = document.createElement('dt');
    caption.className = 'wd-attribute-label';
    caption.textContent = label;

    const text = document.createElement('dd');
    text.className = 'wd-attribute-value';
    text.textContent = value;

    return [image, caption, text];
  }

  async function renderAttributes(attributes) {
    const pressure = number(attributes.pressure);
    const humidity = number(attributes.humidity);
    const wind = number(attributes.wind_speed);
    const direction = windDirection(attributes.wind_bearing);

    const rows = [
      await attributeRow(
        'mdi:gauge',
        vuePanel.t('translation.details.pressure'),
        pressure === null ? '' : formatNumber(pressure, 1) + ' ' + (attributes.pressure_unit || 'hPa')
      ),
      await attributeRow(
        'mdi:water-percent',
        vuePanel.t('translation.details.humidity'),
        humidity === null ? '' : formatNumber(humidity, 0) + ' %'
      ),
      await attributeRow(
        'mdi:weather-windy',
        vuePanel.t('translation.details.wind'),
        wind === null
          ? ''
          : formatNumber(wind, 1) + ' ' + (attributes.wind_speed_unit || 'km/h')
            + (direction ? ' (' + direction + ')' : '')
      )
    ];

    attributesList.replaceChildren(...rows.flat());
  }

  /* Weekday for a daily entry, time of day for an hourly one */
  function entryDate(entry) {
    const stamp = entry && entry.datetime ? new Date(entry.datetime) : null;
    return stamp && !Number.isNaN(stamp.getTime()) ? stamp : null;
  }

  function weekday(stamp) {
    return stamp ? stamp.toLocaleDateString(vuePanel.language, {weekday: 'short'}) : '';
  }

  function forecastWhen(entry, hourly) {
    const stamp = entryDate(entry);
    if (!stamp) return '';
    return hourly
      ? stamp.toLocaleTimeString(vuePanel.language, {hour: '2-digit', minute: '2-digit'})
      : weekday(stamp);
  }

  function renderForecast(entries, unit, hourly) {
    let previousDay = '';
    const cells = entries.map(entry => {
      const cell = document.createElement('div');
      cell.className = 'wd-forecast-entry';

      /*
       * An hourly row runs past midnight, so the weekday is written above the
       * first entry of each day. The element stays in place for every other
       * entry — an empty label keeps all columns aligned.
       */
      if (hourly) {
        const stamp = entryDate(entry);
        const day = stamp ? stamp.toDateString() : '';
        const marker = document.createElement('span');
        marker.className = 'wd-forecast-day';
        marker.textContent = day && day !== previousDay ? weekday(stamp) : '';
        previousDay = day;
        cell.append(marker);
      }

      const when = document.createElement('span');
      when.className = 'wd-forecast-when';
      when.textContent = forecastWhen(entry, hourly);

      const image = document.createElement('img');
      image.alt = labels[entry && entry.condition] || String((entry && entry.condition) || '');
      image.src = iconUrl(entry && entry.condition);

      cell.append(when, image);

      const high = number(entry && entry.temperature);
      if (high !== null) {
        const value = document.createElement('span');
        value.className = 'wd-forecast-high';
        value.textContent = formatNumber(high, 1) + '°';
        cell.append(value);
      }
      const low = number(entry && entry.templow);
      if (low !== null) {
        const value = document.createElement('span');
        value.className = 'wd-forecast-low';
        value.textContent = formatNumber(low, 1) + '°';
        cell.append(value);
      }
      return cell;
    });
    forecastGrid.replaceChildren(...cells);
    forecastGrid.hidden = cells.length === 0;
    forecastGrid.classList.toggle('is-scrollable', hourly);
    /* A fresh list starts at the beginning, not wherever the last one stood */
    forecastGrid.scrollLeft = 0;
  }

  /* Which forecast the tabs currently show */
  let forecastType = config.forecast === 'hourly' ? 'hourly' : 'daily';
  let currentEntity = null;
  /* Today's high and low, shown next to the current temperature */
  let dailyRange = '';

  function paintTabs() {
    for (const tab of tabs.children) {
      tab.classList.toggle('is-active', tab.dataset.type === forecastType);
      tab.setAttribute('aria-selected', String(tab.dataset.type === forecastType));
    }
  }

  /*
   * Forecasts are no longer an attribute — Home Assistant serves them from
   * `weather.get_forecasts`, which answers with data. An integration without
   * forecast support returns nothing, which the card says instead of leaving
   * an empty box behind.
   */
  async function fetchForecast(type) {
    if (!entityId) return [];
    try {
      const response = await vuePanel.callServiceWithResponse(
        'weather',
        'get_forecasts',
        {type},
        {entity_id: entityId}
      );
      const forecast = response && response[entityId] && response[entityId].forecast;
      return Array.isArray(forecast) ? forecast : [];
    } catch {
      return [];
    }
  }

  async function loadForecast() {
    if (config.forecast === 'none' || !entityId || !currentEntity) {
      forecastSection.hidden = true;
      return;
    }
    forecastSection.hidden = false;
    const hourly = forecastType === 'hourly';
    /* An hour-by-hour row scrolls, so it may hold a lot more than a daily one */
    const count = hourly
      ? Math.min(48, Math.max(1, Math.round(Number(config.hourlyCount) || 24)))
      : Math.min(12, Math.max(1, Math.round(Number(config.forecastCount) || 6)));
    const unit = (currentEntity.attributes && currentEntity.attributes.temperature_unit) || '°C';
    const entries = await fetchForecast(forecastType);

    forecastEmpty.hidden = entries.length > 0;
    forecastEmpty.textContent = vuePanel.t('translation.forecastUnavailable');
    renderForecast(entries.slice(0, count), unit, hourly);
  }

  /* The high/low pair beside the temperature always comes from today */
  async function loadDailyRange() {
    if (!entityId || !currentEntity) {
      dailyRange = '';
      range.textContent = '';
      return;
    }
    const unit = (currentEntity.attributes && currentEntity.attributes.temperature_unit) || '°C';
    const today = (await fetchForecast('daily'))[0];
    const high = formatTemperature(today && today.temperature, unit);
    const low = formatTemperature(today && today.templow, unit);
    dailyRange = [high, low].filter(Boolean).join(' / ');
    range.textContent = dailyRange;
  }

  function render(entity) {
    const state = String((entity && entity.state) || '');
    const attributes = (entity && entity.attributes) || {};

    condition.textContent = !entityId
      ? vuePanel.t('translation.noEntity')
      : !entity
        ? vuePanel.t('translation.entityNotFound')
        : labels[state] || state;
    updated.textContent = entity ? relativeTime(entity.last_changed || entity.last_updated) : '';

    temperature.textContent = formatTemperature(
      attributes.temperature,
      attributes.temperature_unit || '°C'
    ) || '–';
    range.textContent = dailyRange;

    setIcon(icon, state || 'unknown', iconUrl(state));

    attribution.textContent = String(attributes.attribution || '');
    attribution.hidden = !attribution.textContent;

    forecastTitle.textContent = vuePanel.t('translation.forecastHeading');
    document.getElementById('tab-daily').textContent = vuePanel.t('translation.forecastTypes.daily');
    document.getElementById('tab-hourly').textContent = vuePanel.t('translation.forecastTypes.hourly');
    paintTabs();
  }

  /*
   * Dragging the row sideways is the natural gesture on a touch pad or with a
   * mouse; a horizontal scrollbar alone is fiddly to hit. Snapping is turned
   * off while dragging so the row follows the pointer exactly.
   */
  let dragPointer = null;
  let dragStartX = 0;
  let dragStartScroll = 0;
  let dragging = false;

  forecastGrid.addEventListener('pointerdown', event => {
    if (!forecastGrid.classList.contains('is-scrollable') || event.button !== 0) return;
    dragPointer = event.pointerId;
    dragStartX = event.clientX;
    dragStartScroll = forecastGrid.scrollLeft;
    dragging = false;
  });

  forecastGrid.addEventListener('pointermove', event => {
    if (dragPointer !== event.pointerId) return;
    const moved = event.clientX - dragStartX;
    /* A few pixels of slack, so a plain click is not read as a drag */
    if (!dragging) {
      if (Math.abs(moved) < 4) return;
      dragging = true;
      forecastGrid.classList.add('is-dragging');
      forecastGrid.setPointerCapture(event.pointerId);
    }
    event.preventDefault();
    forecastGrid.scrollLeft = dragStartScroll - moved;
  });

  for (const eventName of ['pointerup', 'pointercancel']) {
    forecastGrid.addEventListener(eventName, event => {
      if (dragPointer !== event.pointerId) return;
      dragPointer = null;
      if (!dragging) return;
      dragging = false;
      forecastGrid.classList.remove('is-dragging');
    });
  }

  /* The images would otherwise be picked up by the browser's own drag */
  forecastGrid.addEventListener('dragstart', event => event.preventDefault());

  tabs.addEventListener('click', async event => {
    const tab = event.target.closest('button');
    if (!tab || tab.dataset.type === forecastType) return;
    forecastType = tab.dataset.type;
    paintTabs();
    await loadForecast();
  });

  /* Attributes change constantly; the forecast only needs the state */
  let lastForecastState = null;

  async function refresh(entity) {
    currentEntity = entity;
    render(entity);
    await renderAttributes((entity && entity.attributes) || {});

    const state = String((entity && entity.state) || '');
    if (state === lastForecastState) return;
    lastForecastState = state;
    await loadDailyRange();
    await loadForecast();
  }

  if (entityId) {
    await refresh(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, refresh);
  } else {
    render(null);
    forecastSection.hidden = true;
  }
</script>
