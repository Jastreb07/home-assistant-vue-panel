<script data-vue-panel-javascript>
  const config = vuePanel.config;
  /* Ein einfacher Umschalter für jede Domain */
  async function toggleEntity(id) {
    if (!id) return;
    await vuePanel.callService('homeassistant', 'toggle', {}, {entity_id: id});
  }

  /*
   * Tipp-Aktionen: Tippen, Doppeltippen und Halten. "default" behält die
   * eingebaute Aktion der Card; "more-info" und "assist" brauchen Dialoge von
   * Home Assistant, die das Panel noch nicht öffnen kann, und bleiben leer.
   */
  function bindGestures(element, settings, handlers) {
    /* Das Panel speichert je Geste eine Aktion samt Ziel */
    const slotOf = gesture => (settings.actions || {})[gesture] || {};
    const actionOf = gesture => String(slotOf(gesture).action || 'default');

    const run = async gesture => {
      const action = actionOf(gesture);
      const target = String(slotOf(gesture).target || '');

      if (action === 'none' || action === 'more-info' || action === 'assist') return;
      if (action === 'default') return handlers.default ? handlers.default(gesture) : undefined;
      if (action === 'toggle') return handlers.toggle ? handlers.toggle() : undefined;
      if (action === 'navigate') return target ? vuePanel.navigate(target) : undefined;
      if (action === 'url') {
        if (target) window.open(target, '_blank', 'noopener');
        return;
      }
      if (action === 'perform-action') {
        const [domain, service] = target.split('.');
        if (!domain || !service) return;
        await vuePanel.callService(domain, service, {}, handlers.entityId ? {entity_id: handlers.entityId} : {});
      }
    };

    const ignored = event => Boolean(handlers.ignore) && Boolean(event.target.closest(handlers.ignore));
    let holdTimer = null;
    let held = false;
    let taps = 0;

    element.addEventListener('pointerdown', event => {
      if (ignored(event)) return;
      held = false;
      holdTimer = setTimeout(() => {
        holdTimer = null;
        held = true;
        run('hold');
      }, 500);
    });

    for (const name of ['pointerup', 'pointercancel', 'pointerleave']) {
      element.addEventListener(name, () => {
        if (holdTimer) clearTimeout(holdTimer);
        holdTimer = null;
      });
    }

    element.addEventListener('click', event => {
      if (ignored(event)) return;
      if (held) {
        held = false;
        return;
      }
      const doubled = actionOf('double_tap');
      /* Ohne Doppeltipp-Aktion reagiert der einfache Tipp sofort */
      if (doubled === 'default' || doubled === 'none') {
        run('tap');
        return;
      }
      taps += 1;
      if (taps > 1) return;
      setTimeout(() => {
        const wasDoubled = taps > 1;
        taps = 0;
        run(wasDoubled ? 'double_tap' : 'tap');
      }, 250);
    });
  }

  const entityId = String(config.entity || '');
  const card = document.getElementById('card');
  const name = document.getElementById('name');
  const state = document.getElementById('state');
  const icon = document.getElementById('icon');
  const temperature = document.getElementById('temperature');
  const details = document.getElementById('details');
  const humidity = document.getElementById('humidity');
  const wind = document.getElementById('wind');
  const icons = {
    'clear-night': 'mdi:weather-night',
    cloudy: 'mdi:weather-cloudy',
    fog: 'mdi:weather-fog',
    hail: 'mdi:weather-hail',
    lightning: 'mdi:weather-lightning',
    'lightning-rainy': 'mdi:weather-lightning-rainy',
    partlycloudy: 'mdi:weather-partly-cloudy',
    pouring: 'mdi:weather-pouring',
    rainy: 'mdi:weather-rainy',
    snowy: 'mdi:weather-snowy',
    'snowy-rainy': 'mdi:weather-snowy-rainy',
    sunny: 'mdi:weather-sunny',
    windy: 'mdi:weather-windy',
    'windy-variant': 'mdi:weather-windy-variant',
    exceptional: 'mdi:alert-circle-outline'
  };
  const labels = {
    'clear-night': vuePanel.t('translation.conditions.clearNight'),
    cloudy: vuePanel.t('translation.conditions.cloudy'),
    fog: vuePanel.t('translation.conditions.fog'),
    hail: vuePanel.t('translation.conditions.hail'),
    lightning: vuePanel.t('translation.conditions.lightning'),
    'lightning-rainy': vuePanel.t('translation.conditions.lightningRainy'),
    partlycloudy: vuePanel.t('translation.conditions.partlycloudy'),
    pouring: vuePanel.t('translation.conditions.pouring'),
    rainy: vuePanel.t('translation.conditions.rainy'),
    snowy: vuePanel.t('translation.conditions.snowy'),
    'snowy-rainy': vuePanel.t('translation.conditions.snowyRainy'),
    sunny: vuePanel.t('translation.conditions.sunny'),
    windy: vuePanel.t('translation.conditions.windy'),
    'windy-variant': vuePanel.t('translation.conditions.windy')
  };

  async function render(entity) {
    const condition = String(entity?.state || '');
    card.className = `tile weather-card${config.animation === true ? ` animated ${condition}` : ''}`;
    name.textContent = String(config.name || entity?.attributes?.friendly_name || entityId || vuePanel.t('translation.defaultName'));
    state.textContent = !entityId ? vuePanel.t('translation.noEntity') : !entity ? vuePanel.t('translation.entityNotFound') : labels[condition] || condition;
    const temp = Number(entity?.attributes?.temperature);
    temperature.textContent = Number.isFinite(temp) ? `${config.roundTemperature === false ? temp : Math.round(temp)} ${entity.attributes?.temperature_unit || '°C'}` : '–';
    details.hidden = config.showDetails === false || !entity;
    humidity.textContent = entity?.attributes?.humidity != null ? `💧 ${entity.attributes.humidity} %` : '';
    const speed = Number(entity?.attributes?.wind_speed);
    wind.textContent = Number.isFinite(speed) ? `≋ ${Math.round(speed)} ${entity.attributes?.wind_speed_unit || 'km/h'}` : '';
    icon.src = await vuePanel.getIcon(icons[condition] || 'mdi:weather-partly-cloudy', {
      size: 84,
      color: config.animation === true ? '#ffffff' : '#737373'
    });
  }

  if (entityId) {
    await render(await vuePanel.getEntity(entityId));
    vuePanel.subscribeEntity(entityId, render);
  } else await render(null);

  /* Tipp-Aktionen auf der Card; die eigenen Bedienelemente bleiben unberührt */
  bindGestures(card, config, {
    entityId,
    toggle: () => toggleEntity(entityId)
  });
</script>
